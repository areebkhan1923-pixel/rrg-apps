  if(T==='captions')b+=listBlock(c.captions,x=>`<div class="hook"><div class="hook-t" data-act="capEdit" data-id="${c.id}" data-x="${x.id}">${esc(x.label||x.text.slice(0,60))}<div class="row-s">${esc(x.text.slice(0,140))}</div></div><div class="hook-a"><button class="ibtn" data-act="capCopy" data-id="${c.id}" data-x="${x.id}" aria-label="Copy">${ico('copy')}</button></div></div>`,'No saved captions or CTAs yet.',`<button class="btn" data-act="capAdd" data-id="${c.id}">${ico('plus')}Add caption</button>`);
  return {title:c.name,tabs:CLIENT_TABS,body:b,head:`<span class="swatch" style="--c:${safeColor(c.color)}"></span>`}};
const listBlock=(arr,fn,empty,actions)=>`<section>${(arr||[]).length?`<div class="list">${arr.map(fn).join('')}</div>`:`<p class="empty">${empty}</p>`}</section><section class="btns">${actions}</section>`;

/* ================= TIME ================= */
RENDER.time=()=>{const r=timerRun();const now=new Date(),t0=sod(now),mon=mondayOf(now);const today=msByCat(t0,addDays(t0,1));
  let h=r?(()=>{const c=catInfo(r.cid);return `<section class="plate tcard" style="--c:${c.color}"><div class="lbl">Now logging</div><div class="bigtime" data-tick="${r.start}">${fmtHMS(Date.now()-r.start)}</div><div class="tc-row"><span class="swatch"></span><b>${esc(c.name)}</b><button class="btn pri" data-act="timerStop">${ico('stop')}Stop</button></div></section>`})():`<section><div class="lbl">Tap a client to start the clock</div></section>`;
  h+=`<section class="tiles">${timeCats().map(c=>{const run=r&&r.cid===c.id;return `<button class="tile ${run?'run':''}" style="--c:${c.color}" data-act="${run?'timerStop':'timerStart'}" data-id="${esc(c.id)}"><b>${esc(c.short)}</b><small ${run?`data-tick="${r.start}"`:''}>${run?fmtHMS(Date.now()-r.start):(today[c.id]?fmtDur(today[c.id])+' today':'Start')}</small></button>`}).join('')}</section>`;
  const wk=msByCat(mon,addDays(mon,7));const days=[];for(let i=0;i<7;i++){const d=addDays(mon,i);const m=msByCat(d,addDays(d,1));days.push({d,ms:Object.values(m).reduce((a,b)=>a+b,0)})}const dmax=Math.max(36e5,...days.map(x=>x.ms));const wtot=days.reduce((a,x)=>a+x.ms,0);
  h+=`<section><div class="lbl">This week · ${fmtH(wtot)}h</div><div class="days">${days.map(x=>`<div class="day ${ymd(x.d)===ymd(now)?'today':''}"><span class="col-b ${x.ms?'':'z'}" style="height:${x.ms?(x.ms/dmax*100).toFixed(1)+'%':'3px'}"></span><span>${x.ms?fmtH(x.ms):''}</span><span>${DOW[x.d.getDay()].slice(0,2)}</span></div>`).join('')}</div></section>`;
  const ids=Object.keys(wk).filter(k=>wk[k]>0).sort((a,b)=>wk[b]-wk[a]);const max=Math.max(1,...ids.map(k=>wk[k]));
  if(ids.length)h+=`<section><div class="hbars">${ids.map(k=>{const c=catInfo(k);return `<div class="hb" style="--c:${c.color}"><span>${esc(c.short)}</span><div class="bar"><i style="width:${(wk[k]/max*100).toFixed(1)}%"></i></div><span class="num">${fmtH(wk[k])}h</span></div>`}).join('')}</div></section>`;
  const ym=view.timeMonth||ymOf(now);const [a,z]=monthRange(ym);const mm=msByCat(a,z);
  const rows=clients().map(c=>{const ret=retainerFor(c,ym);const ms=mm[c.id]||0;const rateA=ret&&ms>0?toAED(ret.amount,ret.cur)/hrs(ms):null;return{c,ret,ms,rateA}});
  const rated=rows.filter(x=>x.rateA&&x.ms>=2*36e5);const low=rated.length>1?rated.reduce((m,x)=>x.rateA<m.rateA?x:m):null;
  h+=`<section><div class="lbl-row"><div class="lbl">Rate check · ${fmtYm(ym)}</div><div class="weeknav" style="margin:0"><button class="ibtn" data-act="tMonth" data-d="-1" aria-label="Previous month">${ico('back')}</button><button class="ibtn" data-act="tMonth" data-d="1" aria-label="Next month">${ico('next')}</button></div></div>
  <div class="rtable">${rows.map(x=>`<div class="rt-row"><span><span class="swatch" style="--c:${safeColor(x.c.color)};margin-right:8px"></span>${esc(x.c.short||x.c.name)}<small>${x.ret?money(x.ret.amount,x.ret.cur)+'/mo':'No retainer'}</small></span><span class="num">${fmtH(x.ms)}h</span><span class="num" style="min-width:92px">${x.rateA?`AED ${Math.round(x.rateA)}/h`:'n/a'}${low&&low===x?'<small style="color:var(--bad)">Lowest rate</small>':''}</span></div>`).join('')}</div>
  <p class="muted small">Retainer divided by hours logged. Non AED retainers use the rates in System.</p></section>`;
  const ents=allEntries().filter(e=>e.end>=+addDays(t0,-6)).sort((x,y)=>y.start-x.start).slice(0,40);
  h+=`<section><div class="lbl-row"><div class="lbl">Last 7 days</div><button class="btn sm ghost" data-act="entryAdd">${ico('plus')}Add time</button></div>${ents.length?`<div class="list">${ents.map(e=>{const c=catInfo(e.cid);const d=new Date(e.start);return rowHtml({act:'entryEdit',data:`data-doc="${e._doc}" data-id="${e.id}"`,iconHtml:`<span class="swatch" style="--c:${c.color}"></span>`,t:`${c.short} · ${fmtDur(e.end-e.start)}`,s:`${fmtD(d)} · ${pad(d.getHours())}:${pad(d.getMinutes())} to ${pad(new Date(e.end).getHours())}:${pad(new Date(e.end).getMinutes())}${e.note?' · '+e.note:''}`})}).join('')}</div>`:'<p class="empty">No entries yet.</p>'}</section>`;
  return h};

/* ================= NEW BIZ ================= */
RENDER.biz=()=>{const L=bizList();const today=ymd(new Date());const cnt={};L.forEach(p=>cnt[p.stage]=(cnt[p.stage]||0)+1);
  const f=view.bizStage;const shown=L.filter(p=>f?p.stage===f:p.stage!=='lost').sort((a,b)=>BIZ_STAGES.findIndex(s=>s.id===a.stage)-BIZ_STAGES.findIndex(s=>s.id===b.stage)||String(a.nextDate||'9').localeCompare(String(b.nextDate||'9')));
  const pipeVal=L.filter(p=>p.stage!=='lost'&&p.stage!=='won'&&p.value).reduce((a,p)=>a+toAED(p.value,p.cur||'AED'),0);
  let h=`<section><div class="lbl">Pipeline${pipeVal?` · AED ${Math.round(pipeVal).toLocaleString('en-GB')}/mo open`:''}</div><div class="hs"><button class="chip big ${!f?'on':''}" data-act="bizFilter" data-s="">Open</button>${BIZ_STAGES.map(s=>`<button class="chip big ${f===s.id?'on':''}" data-act="bizFilter" data-s="${s.id}">${s.l} ${cnt[s.id]||0}</button>`).join('')}</div></section>`;
  h+=`<section><div class="list">${shown.map(p=>{const st=BIZ_STAGES.find(s=>s.id===p.stage)||BIZ_STAGES[0];const due=p.nextDate&&p.nextDate<=today&&p.stage!=='won'&&p.stage!=='lost';
    return rowHtml({act:'openBiz',data:`data-id="${p.id}"`,icon:'biz',iconCls:p.stage==='won'?'ok':due?'acc':'',t:p.name,s:[p.vertical,p.next?`Next: ${p.next}${p.nextDate?' ('+fmtDM(parseYmd(p.nextDate))+')':''}`:''].filter(Boolean).join(' · '),side:`<span class="chip ${p.stage==='won'?'ok':p.stage==='lost'?'':due?'bad':'acc'}">${st.l}</span>`})}).join('')||'<p class="empty">Nothing here.</p>'}
  ${rowHtml({act:'bizAdd',icon:'plus',t:'Add prospect'})}</div></section>`;
  return h};
PANELS.biz=pn=>{const p=bizList().find(x=>x.id===pn.id);if(!p)return null;
  const b=`<section><div class="lbl">Stage</div><div class="seg">${BIZ_STAGES.map(s=>`<button class="${p.stage===s.id?'on':''}" data-act="bizStage" data-id="${p.id}" data-s="${s.id}">${s.l}</button>`).join('')}</div></section>
  <section class="sysinfo">${[['Vertical',p.vertical],['Contact',p.contact],['Value',p.value?money(p.value,p.cur||'AED')+'/mo':''],['Next step',p.next],['Due',p.nextDate?fmtD(parseYmd(p.nextDate)):'']].map(([k,v])=>`<div><span>${k}</span><span>${esc(v||'None')}</span></div>`).join('')}</section>
  <section class="btns"><button class="btn" data-act="bizEdit" data-id="${p.id}">Edit details</button></section>
  <section><div class="lbl">Log</div><textarea class="in" id="bizNote" rows="3" placeholder="Call notes, what they said, what you sent"></textarea><div class="btns" style="margin-top:8px"><button class="btn pri" data-act="bizNote" data-id="${p.id}">Add to log</button></div>
  ${(p.notes||[]).slice().reverse().map(n=>`<div class="note"><div class="note-h"><span>${fmtD(parseYmd(n.date))}</span></div><p>${esc(n.text)}</p></div>`).join('')}</section>`;
  return {title:p.name,body:b}};

/* ================= CREATIVE ================= */
const projIcon=p=>p.kind==='music'?'music':p.kind==='3d'?'cube':'film';
RENDER.creative=()=>{const ps=projects();
  return `<section><div class="lbl">Projects</div><div class="list">${ps.map(p=>{const st=stagesOf(p);const i=Math.max(0,st.indexOf(p.stage));const open=(p.todos||[]).filter(t=>!t.done).length;
    return `<button class="row" data-act="openProj" data-id="${p.id}"><span class="row-ic ${p.stage==='Done'?'ok':''}">${ico(projIcon(p))}</span><span class="row-main"><span class="row-t">${esc(p.name)}</span><span class="row-s">${esc(p.stage||st[0])}${open?` · ${plural(open,'to do')}`:''}</span><span class="stagebar" style="margin-top:7px">${st.map((s,j)=>`<i class="${j<=i?'on':''}"></i>`).join('')}</span></span></button>`}).join('')}
  ${rowHtml({act:'projAdd',icon:'plus',t:'New project'})}</div></section>`};
const PROJ_TABS=[['overview','Overview'],['ideas','Ideas'],['script','Script'],['shots','Shots'],['todos','To do'],['refs','Refs']];
PANELS.proj=pn=>{const p=project(pn.id);if(!p)return null;pn.tab=pn.tab||'overview';const T=pn.tab;let b='';
  if(T==='overview'){const st=stagesOf(p);const pr=projProgress(p);
    b+=`<section><div class="lbl">Stage</div><div class="seg">${st.map(s=>`<button class="${p.stage===s?'on':''}" data-act="projStage" data-id="${p.id}" data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div></section>
    <section><div class="lbl-row"><div class="lbl">Progress</div><span class="num muted">${Math.round(pr*100)}%</span></div><div class="bar ${pr>=1?'ok':''}"><i style="width:${(pr*100).toFixed(1)}%"></i></div><p class="muted small">${(p.todos||[]).length?'Based on your to do list.':'Based on stage. Add to dos for a finer bar.'}</p></section>
    <section><div class="lbl">Logline and notes</div><textarea class="in" rows="5" data-in="projField" data-id="${p.id}" data-k="logline" placeholder="What is it, in two lines">${esc(p.logline||'')}</textarea></section>
    <section class="btns"><button class="btn ghost" data-act="projEdit" data-id="${p.id}">Edit project</button></section>`}
  if(T==='ideas'){const ideas=vaultDoc().ideas.filter(i=>i.tag==='p:'+p.id).sort((a,b)=>b.date<a.date?-1:1);
    b+=`<section><div class="cap" style="grid-template-columns:1fr auto"><input class="in" id="pIdea" placeholder="New idea for ${esc(p.name)}" data-enter="projIdea" data-id="${p.id}"><button class="btn pri" data-act="projIdea" data-id="${p.id}">Save</button></div></section><section>${ideas.map(ideaRow).join('')||'<p class="empty">No ideas yet. Anything you tag with this project in the Vault shows up here.</p>'}</section>`}
  if(T==='script')b+=`<section><p class="muted small">Saves as you type.</p><textarea class="in" style="min-height:58vh;font-size:15px" data-in="projField" data-id="${p.id}" data-k="script" placeholder="INT. ...">${esc(p.script||'')}</textarea></section>`;
  if(T==='shots'||T==='todos'){const k=T;const arr=p[k]||[];const done=arr.filter(x=>x.done).length;
    b+=`<section><div class="cap" style="grid-template-columns:1fr auto"><input class="in" id="pItem" placeholder="${k==='shots'?'Shot, e.g. Wide, car pulls in at dusk':'Next thing to do'}" data-enter="projItem" data-id="${p.id}" data-k="${k}"><button class="btn pri" data-act="projItem" data-id="${p.id}" data-k="${k}">Add</button></div></section>
    <section>${arr.length?`<div class="lbl">${done} of ${arr.length} done</div>`+arr.map((x,i)=>`<div class="pr"><button class="ck sm ${x.done?'on':''}" data-act="projTick" data-id="${p.id}" data-k="${k}" data-x="${x.id}" aria-label="Done">${ico('check')}</button><button class="pr-main" data-act="projItemOpts" data-id="${p.id}" data-k="${k}" data-x="${x.id}">${k==='shots'?`<span class="pr-d"><b>${i+1}</b></span>`:''}<span class="pr-t ${x.done?'done':''}" style="white-space:normal">${esc(x.text)}</span></button></div>`).join(''):'<p class="empty">Empty.</p>'}</section>`}
  if(T==='refs')b+=listBlock(p.refs,l=>rowHtml({act:'refOpen',data:`data-id="${p.id}" data-l="${l.id}"`,icon:'link',t:l.label||l.url,s:(l.url||'').replace(/^https?:\/\//,'').slice(0,60)}),'No references yet.',`<button class="btn" data-act="refAdd" data-id="${p.id}">${ico('plus')}Add reference</button>`);
  return {title:p.name,tabs:PROJ_TABS,body:b}};

/* ================= HOOK LAB ================= */
RENDER.hooks=()=>{const H=hooksDoc();const T=view.hookTab;
  let h=`<section><div class="tabs" style="margin-bottom:0">${[['hooks','Hooks'],['swipe','Swipe file'],['formats','Formats']].map(([k,l])=>`<button class="tab ${T===k?'on':''}" data-act="hookTab" data-t="${k}">${l}</button>`).join('')}</div></section>`;
  if(T==='hooks'){const fc=view.hookClient,ff=view.hookFormat;const list=H.list.filter(x=>(!fc||x.cid===fc)&&(!ff||x.format===ff)).sort((a,b)=>(b.star?1:0)-(a.star?1:0)||(b.date||'').localeCompare(a.date||''));
    h+=`<section><div class="hs"><button class="chip big ${!fc?'on':''}" data-act="hookClient" data-c="">All</button>${clients().map(c=>`<button class="chip big ${fc===c.id?'on':''}" data-act="hookClient" data-c="${c.id}"><span class="swatch" style="--c:${safeColor(c.color)}"></span>${esc(c.short)}</button>`).join('')}</div>${ff?`<div class="chips" style="margin-top:8px"><button class="chip acc" data-act="hookFormat" data-f="">${esc(ff)} ✕</button></div>`:''}</section>
    <section><div class="lbl-row"><div class="lbl">${plural(list.length,'hook')}</div><button class="btn sm pri" data-act="hookAdd">${ico('plus')}Hook</button></div>${list.map(x=>{const c=client(x.cid);return `<div class="hook"><div class="hook-t" data-act="hookEdit" data-id="${x.id}">${esc(x.text)}</div><div class="hook-a"><button class="ibtn ${x.star?'on':''}" data-act="hookStar" data-id="${x.id}" aria-label="Winner">${ico('star')}</button><button class="ibtn" data-act="hookCopy" data-id="${x.id}" aria-label="Copy">${ico('copy')}</button></div><div class="chips">${c?`<span class="chip"><span class="swatch" style="--c:${safeColor(c.color)}"></span>${esc(c.short)}</span>`:''}${x.format?`<button class="chip" data-act="hookFormat" data-f="${esc(x.format)}">${esc(x.format)}</button>`:''}<span class="chip ${x.status==='used'?'':'acc'}">${x.status==='used'?'Used':'Idea'}</span>${x.star?'<span class="chip ok">Winner</span>':''}</div></div>`}).join('')||'<p class="empty">No hooks match.</p>'}</section>`}
  if(T==='swipe'){h+=`<section><div class="lbl-row"><div class="lbl">Posts worth stealing from</div><button class="btn sm pri" data-act="swipeAdd">${ico('plus')}Save</button></div>${H.swipe.slice().reverse().map(x=>`<div class="hook"><div class="hook-t" data-act="swipeEdit" data-id="${x.id}">${esc(x.note||x.url)}<div class="row-s">${esc((x.url||'').replace(/^https?:\/\//,'').slice(0,60))}</div></div><div class="hook-a">${safeUrl(x.url)?`<a class="ibtn" href="${esc(x.url)}" target="_blank" rel="noopener" aria-label="Open">${ico('link')}</a>`:''}</div><div class="chips">${x.platform?`<span class="chip">${esc(x.platform)}</span>`:''}${x.format?`<span class="chip">${esc(x.format)}</span>`:''}${x.cid&&client(x.cid)?`<span class="chip acc">For ${esc(client(x.cid).short)}</span>`:''}</div></div>`).join('')||'<p class="empty">Save viral posts here with a line on why they work.</p>'}</section>`}
  if(T==='formats'){const F=allFormats();h+=Object.keys(F).map(g=>`<section><div class="lbl">${esc(g)}</div><div class="list">${F[g].map(f=>{const n=H.list.filter(x=>x.format===f).length;return rowHtml({act:'formatPick',data:`data-f="${esc(f)}"`,icon:'hooks',t:f,s:n?plural(n,'hook'):'',side:n?`<span class="chip acc">${n}</span>`:''})}).join('')}</div></section>`).join('')+`<section class="btns"><button class="btn ghost" data-act="formatAdd">${ico('plus')}Add your own format</button></section>`}
  return h};

/* ================= VAULT ================= */
function ideaRow(i){return `<div class="hook"><div class="hook-t" data-act="ideaOpts" data-id="${i.id}">${i.pinned?'★ ':''}${esc(i.text)}</div><div class="hook-a"><button class="ibtn" data-act="ideaOpts" data-id="${i.id}" aria-label="Options">${ico('dots')}</button></div><div class="chips"><span class="chip">${esc(tagLabel(i.tag))}</span><span class="chip">${fmtDM(parseYmd(i.date))}</span></div></div>`}
RENDER.vault=()=>{const T=view.vaultTab;let h=`<section><div class="cap"><input class="in" id="capIn" placeholder="Capture an idea" data-enter="capture" autocomplete="off"><select class="in in-tag" id="capTag">${tagOptions(S().lastTag||'g')}</select><button class="btn pri" data-act="capture">Save</button></div></section>
  <section><div class="tabs" style="margin-bottom:0">${[['ideas','Ideas'],['refs','Saved links'],['captions','Caption bank']].map(([k,l])=>`<button class="tab ${T===k?'on':''}" data-act="vaultTab" data-t="${k}">${l}</button>`).join('')}</div></section>`;
  if(T==='ideas'){const tag=view.ideaTag;const all=vaultDoc().ideas;const tags=[...new Set(all.map(i=>i.tag||'g'))];const list=all.filter(i=>!tag||(i.tag||'g')===tag).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(b.date||'').localeCompare(a.date||''));
    h+=`<section><div class="hs"><button class="chip big ${!tag?'on':''}" data-act="ideaTag" data-t="">All ${all.length}</button>${tags.map(t=>`<button class="chip big ${tag===t?'on':''}" data-act="ideaTag" data-t="${esc(t)}">${esc(tagLabel(t))}</button>`).join('')}</div></section><section>${list.map(ideaRow).join('')||'<p class="empty">Nothing captured yet.</p>'}</section>`}
  else if(T==='refs'){h+=refsView()}
  else{h+=clients().map(c=>`<section><div class="lbl-row"><div class="lbl">${esc(c.name)}</div><button class="btn sm ghost" data-act="capAdd" data-id="${c.id}">${ico('plus')}Add</button></div>${(c.captions||[]).map(x=>`<div class="hook"><div class="hook-t" data-act="capEdit" data-id="${c.id}" data-x="${x.id}">${esc(x.label||'Caption')}<div class="row-s">${esc(x.text.slice(0,140))}</div></div><div class="hook-a"><button class="ibtn" data-act="capCopy" data-id="${c.id}" data-x="${x.id}" aria-label="Copy">${ico('copy')}</button></div></div>`).join('')||'<p class="muted small">None saved.</p>'}</section>`).join('')}
  return h};

/* ================= TOOLS ================= */
RENDER.tools=()=>{const f=toolsDoc().focus;const run=f.run;const today=ymd(new Date());
  const items=[
    {p:'focus',icon:'focus',t:'Focus timer',s:run?`${run.mode==='work'?'Focus':'Break'} · ${fmtMS(run.endAt-Date.now())} left`:`${f.work} min focus · ${(f.log[today]||0)} done today`},
    {p:'review',icon:'note',t:'Weekly review',s:'Wins, what slipped, top 3 for next week'},
    {p:'shoot',icon:'cam',t:'Shoot day checklist',s:(()=>{const s=toolsDoc().shoot;const d=s.items.filter(i=>s.checked[i.id]).length;return `${d} of ${s.items.length} ticked`})()},
    {p:'gear',icon:'bag',t:'Gear list',s:plural(toolsDoc().gear.length,'item')},
    {p:'rates',icon:'money',t:'Rate card',s:plural(toolsDoc().rates.length,'line')},
    {p:'feedback',icon:'chat',t:'Feedback log',s:'Everything clients have said, in one place'}
  ];
  return `<section><div class="lbl">Tools</div><div class="list">${items.map(i=>rowHtml({act:'openTool',data:`data-id="${i.p}"`,icon:i.icon,t:i.t,s:i.s})).join('')}</div></section>`};
PANELS.tool=pn=>{const D=toolsDoc();const id=pn.id;
  if(id==='focus'){const f=D.focus,run=f.run;const total=run?(run.mode==='work'?f.work:f.brk)*60000:f.work*60000;const left=run?Math.max(0,run.endAt-Date.now()):total;const p=1-left/total;

/* ================= shared parsing ================= */
const WD={sun:0,sunday:0,mon:1,monday:1,tue:2,tues:2,tuesday:2,wed:3,weds:3,wednesday:3,thu:4,thur:4,thurs:4,thursday:4,fri:5,friday:5,sat:6,saturday:6};
const MONIX={jan:0,january:0,feb:1,february:1,mar:2,march:2,apr:3,april:3,may:4,jun:5,june:5,jul:6,july:6,aug:7,august:7,sep:8,sept:8,september:8,oct:9,october:9,nov:10,november:10,dec:11,december:11};
const PROJ_HINTS={doa:['kris','chris','anomalies','case 60','found footage','film camera'],ram:['repeat after me','toy bird','bird'],backrooms:['blender','backrooms','vhs'],music:['beat','synth','track','song']};
function tagScores(text){const n=' '+norm(text).replace(/[^a-z0-9' ]/g,' ')+' ';const sc={};const add=(t,v)=>{sc[t]=(sc[t]||0)+v};
  const firsts={};allClients().forEach(c=>(c.contacts||[]).forEach(p=>{const f=norm(String(p.name).split(' ')[0]);if(f.length>2)(firsts[f]=firsts[f]||new Set()).add(c.id)}));
  for(const c of allClients()){for(const a of aliasesOf(c)){if(a.length<2)continue;if(n.includes(' '+a+' '))add('c:'+c.id,3+a.length/10)}
    for(const t of norm(c.name).split(' '))if(t.length>4&&n.includes(' '+t+' '))add('c:'+c.id,2)}
  for(const f in firsts)if(firsts[f].size===1&&n.includes(' '+f+' '))add('c:'+[...firsts[f]][0],2);
  for(const p of projects()){const pn=norm(p.name);if(n.includes(' '+pn+' '))add('p:'+p.id,3);for(const h of (PROJ_HINTS[p.id]||[]).concat(p.aliases||[]))if(n.includes(' '+norm(h)+' '))add('p:'+p.id,2)}
  return sc}
function detectTag(text){const sc=tagScores(text);let best='g',bv=0;for(const k in sc)if(sc[k]>bv){bv=sc[k];best=k}return best}
function parseWhen(text,past){let s=' '+text+' ';const now=sod(new Date());let due=null;const hit=(re,fn)=>{if(due)return;const m=s.match(re);if(m){const d=fn(m);if(d){due=d;s=s.replace(m[0],' ')}}};
  hit(/\s(?:by |on |due |for )?(today|tonight|eod)\b/i,()=>now);
  hit(/\s(?:by |on |due )?(tomorrow|tmrw|tmr|tomoz)\b/i,()=>addDays(now,1));
  hit(/\s(yesterday)\b/i,()=>addDays(now,-1));
  hit(/\s(\d{1,2}) days? ago\b/i,m=>addDays(now,-(+m[1])));
  hit(/\s(?:in )(\d{1,2}) days?\b/i,m=>addDays(now,+m[1]));
  hit(/\s(?:by |on |due )?next week\b/i,()=>addDays(mondayOf(now),7));
  hit(/\s(?:by |on |due )?(end of (?:the )?month|eom)\b/i,()=>new Date(now.getFullYear(),now.getMonth()+1,0));
  hit(/\s(?:by |on |due |this |last |next )?(next |last )?(mon|monday|tue|tues|tuesday|wed|weds|wednesday|thu|thur|thurs|thursday|fri|friday|sat|saturday|sun|sunday)\b/i,m=>{const w=WD[m[2].toLowerCase()];let d=0;
    if(past||/last/i.test(m[0])){d=(now.getDay()-w+7)%7;if(d===0&&/last/i.test(m[0]))d=7;return addDays(now,-d)}d=(w-now.getDay()+7)%7;if(d===0)d=7;if(/next/i.test(m[1]||''))d+=d<7?7:0;return addDays(now,d)});
  hit(/\s(?:by |on |due )?(\d{1,2})(?:st|nd|rd|th)?\s+(jan|january|feb|february|mar|march|apr|april|may|jun|june|jul|july|aug|august|sep|sept|september|oct|october|nov|november|dec|december)\b/i,m=>fixYear(+m[1],MONIX[m[2].toLowerCase()],past));
  hit(/\s(?:by |on |due )?(jan|january|feb|february|mar|march|apr|april|may|jun|june|jul|july|aug|august|sep|sept|september|oct|october|nov|november|dec|december)\s+(\d{1,2})(?:st|nd|rd|th)?\b/i,m=>fixYear(+m[2],MONIX[m[1].toLowerCase()],past));
  hit(/\s(?:by |on |due )?(\d{1,2})\/(\d{1,2})\b/,m=>(+m[2]>=1&&+m[2]<=12)?fixYear(+m[1],+m[2]-1,past):null);
  return{due:due?ymd(due):null,rest:s.replace(/\s+/g,' ').trim()}}
function fixYear(d,mo,past){const now=sod(new Date());let dt=new Date(now.getFullYear(),mo,d);if(isNaN(dt)||dt.getMonth()!==mo)return null;if(past){if(dt>addDays(now,1))dt=new Date(now.getFullYear()-1,mo,d)}else if(dt<addDays(now,-30))dt=new Date(now.getFullYear()+1,mo,d);return dt}
function dueChip(due,done){if(!due)return '';const d=parseYmd(due),t=sod(new Date());const n=daysBetween(t,d);if(done)return `<span class="chip">${fmtDM(d)}</span>`;
  if(n<0)return `<span class="chip bad">${n===-1?'Yesterday':`${-n}d overdue`}</span>`;if(n===0)return '<span class="chip acc">Today</span>';if(n===1)return '<span class="chip">Tomorrow</span>';if(n<7)return `<span class="chip">${DOWL[d.getDay()]}</span>`;return `<span class="chip">${fmtD(d)}</span>`}
const tagColor=t=>{if(!t||t==='g')return '#ffffff';const [k,id]=t.split(':');if(k==='c'){const c=client(id);return c?safeColor(c.color):'#ffffff'}return '#ffd27f'};
const tagChip=t=>`<span class="chip"><span class="swatch" style="--c:${tagColor(t)}"></span>${esc(tagLabel(t))}</span>`;
const allTags=()=>[{v:'g',l:'General'},...clients().map(c=>({v:'c:'+c.id,l:c.name})),...projects().map(p=>({v:'p:'+p.id,l:p.name}))];

const todosDoc=()=>{const d=Store.ensure('codex/todos',()=>({list:[]}));d.list=d.list||[];return d};
function parseTodo(raw){let t=String(raw||'').trim();let pri=false;if(/(^|\s)!+(\s|$)|!$|\b(urgent|asap)\b/i.test(t)){pri=true;t=t.replace(/(^|\s)!+(?=\s|$)/g,' ').replace(/!+$/,'')}
  const w=parseWhen(t,false);const tag=view.todoTag||detectTag(t);return{text:w.rest.replace(/\s+(by|on|due)$/i,'').trim(),due:w.due,pri,tag}}
function todoBucket(x){if(!x.due)return 3;const n=daysBetween(sod(new Date()),parseYmd(x.due));return n<0?0:n===0?1:2}
const todoSort=(a,b)=>todoBucket(a)-todoBucket(b)||String(a.due||'').localeCompare(String(b.due||''))||(b.pri?1:0)-(a.pri?1:0)||(b.created||0)-(a.created||0);
function todoRow(x){return `<div class="td ${x.done?'done':''} ${x.pri?'pri':''}"><button class="ck sm ${x.done?'on':''}" data-act="tdTick" data-id="${x.id}" aria-label="Done">${ico('check')}</button><button class="td-main" data-act="tdOpts" data-id="${x.id}"><span class="td-t">${esc(x.text)}</span><span class="chips">${dueChip(x.due,x.done)}</span></button></div>`}
function todoQuickAdd(){const p=parseTodo(view.todoDraft||'');const has=(view.todoDraft||'').trim();
  return `<section><div class="qadd"><input class="in" id="tdIn" placeholder="One to do, or your whole day: call Matt, edit No5 reel, gym at 6" autocomplete="off" value="${esc(view.todoDraft||'')}" data-in="tdType" data-enter="tdAdd"><button class="mic" data-act="tdMic" aria-label="Speak">${ico('mic')}</button><button class="btn pri" data-act="tdAdd">Add</button></div>
  <div class="qprev" id="tdPrev">${has?`<button class="chip acc" data-act="tdPickTag"><span class="swatch" style="--c:${tagColor(p.tag)}"></span>${esc(tagLabel(p.tag))} ▾</button>${p.due?dueChip(p.due):''}${p.pri?'<span class="chip warn">Priority</span>':''}`:'<span class="muted small">It works out the company and the date. Add ! for priority. List your whole day with commas or new lines and it splits and plans it.</span>'}</div></section>`}
RENDER.todo=()=>{const L=todosDoc().list;const open=L.filter(x=>!x.done);const f=view.todoFilter||'';const today=ymd(new Date());
  const cnt=t=>open.filter(x=>(x.tag||'g')===t).length;const tags=[...new Set(open.map(x=>x.tag||'g'))];const dueToday=open.filter(x=>x.due&&x.due<=today).length;
  let h=todoQuickAdd();
  h+=`<section><div class="hs"><button class="chip big ${!f?'on':''}" data-act="tdFilter" data-f="">All ${open.length}</button><button class="chip big ${f==='plan'?'on':''}" data-act="tdFilter" data-f="plan">${ico('time')}Plan</button><button class="chip big ${f==='today'?'on':''}" data-act="tdFilter" data-f="today">Today ${dueToday}</button>${tags.map(t=>`<button class="chip big ${f===t?'on':''}" data-act="tdFilter" data-f="${esc(t)}"><span class="swatch" style="--c:${tagColor(t)}"></span>${esc(tagLabel(t))} ${cnt(t)}</button>`).join('')}</div></section>`;
  if(f==='plan'){h+=planView();}
  else if(f==='today'){const list=open.filter(x=>x.due&&x.due<=today).sort(todoSort);h+=`<section>${list.map(x=>todoRow(x).replace('<span class="chips">',`<span class="chips">${tagChip(x.tag||'g')}`)).join('')||'<p class="empty">Nothing due today.</p>'}</section>`}
  else{const groups=(f?[f]:tags).map(t=>({t,items:open.filter(x=>(x.tag||'g')===t).sort(todoSort)})).filter(g=>g.items.length).sort((a,b)=>todoBucket(a.items[0])-todoBucket(b.items[0])||b.items.length-a.items.length);
    h+=groups.map(g=>`<section><div class="grp-h"><span class="swatch" style="--c:${tagColor(g.t)}"></span><b>${esc(tagLabel(g.t))}</b><span>${g.items.length}</span></div>${g.items.map(todoRow).join('')}</section>`).join('')||'<p class="empty">All clear. Add your first to do above.</p>'}
  const done=L.filter(x=>x.done&&f!=='plan'&&(!f||f==='today'||(x.tag||'g')===f)).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  if(done.length)h+=`<section><div class="lbl-row"><div class="lbl">Done · ${done.length}</div><button class="btn sm ghost" data-act="tdClear">Clear done</button></div>${done.slice(0,8).map(todoRow).join('')}</section>`;
  return h};

function todoItemsFrom(raw,multiDefaultToday){const {items,prefix}=splitTasks(raw);return items.map(t=>{let txt=t;if(prefix&&!parseWhen(txt,false).due)txt+=' '+prefix;const p=parseTodo(txt);const th=timeHint(t);const min=estMin(t);const text=stripTime(p.text)||p.text;
  return{text,tag:p.tag,due:p.due||(multiDefaultToday&&items.length>1?ymd(new Date()):null),pri:p.pri,min,fix:th&&th.at!=null?(th.by?th.at-min:th.at):null,part:th&&th.part||null}}).filter(x=>x.text)}

function parseExpense(raw){let s=' '+String(raw||'')+' ';const r={amount:null,cur:'AED',cat:'Other',to:'',date:ymd(new Date()),cid:'',paidBy:'',desc:''};

  if(r.amount==null){m=s.match(new RegExp('\\b(\\d[\\d,]*(?:\\.\\d+)?)\\s*'+CURW+'\\b','i'));if(m){r.amount=+m[1].replace(/,/g,'');r.cur=cmap(m[2]);s=s.replace(m[0],' ')}}
  if(r.amount==null){m=s.match(new RegExp('\\b'+CURW+'\\s*(\\d[\\d,]*(?:\\.\\d+)?)','i'));if(m){r.amount=+m[2].replace(/,/g,'');r.cur=cmap(m[1]);s=s.replace(m[0],' ')}}
  const w=parseWhen(s,true);if(w.due){r.date=w.due;s=' '+w.rest+' '}
  if(r.amount==null){m=s.match(/\b(\d[\d,]*(?:\.\d+)?)\b/);if(m){r.amount=+m[1].replace(/,/g,'');s=s.replace(m[0],' ')}}
  if(/\b(business card|business account|wio card|company card)\b/i.test(s))r.paidBy='Business Account';else if(/\b(personal|my card|own card)\b/i.test(s))r.paidBy='Areeb (personal)';
  s=s.replace(/\b(on the |with the |using the |paid with |paid by |on )?(business card|business account|wio card|company card|personal card|my card|own card|personally)\b/ig,' ');
  const hist=moneyDoc().expenses.slice().reverse();const ns=norm(s);
  for(const e of hist){const t=norm(e.to||'');if(t.length>2&&ns.includes(t.split(' (')[0])){r.cat=e.cat;r.to=e.to.split(' (')[0];break}}
  if(!r.to){for(const v of VENDOR_NAMES)if(new RegExp('\\b'+reEsc(v)+'\\b','i').test(s)){r.to=v;break}}
  if(r.cat==='Other'||!r.to){for(const [re,cat] of VENDOR_HINTS)if(re.test(s)){if(r.cat==='Other')r.cat=cat;break}}
  const tag=detectTag(s);if(tag.startsWith('c:'))r.cid=tag.slice(2);if(r.cat==='AD')r.cat=r.cid?'Ad Spend (client)':'Ad Spend (RRG)';
  if(!r.to){m=s.match(/\b(?:at|from|to)\s+([A-Za-z][\w&'.-]*(?:\s+[A-Z][\w&'.-]*){0,2})/);if(m)r.to=m[1].replace(/\b\w/g,c=>c.toUpperCase())}
  r.desc=s.replace(/\b(for|at|from|to|on|paid|spent|i|bought|got|a|the)\b/ig,' ').replace(/\s+/g,' ').trim();r.desc=r.desc?r.desc[0].toUpperCase()+r.desc.slice(1):'';
  if(!r.paidBy)r.paidBy=S().lastPaidBy||'Business Account';return r}

const todayOpen=()=>{const t=ymd(new Date());return todosDoc().list.filter(x=>!x.done&&x.due&&x.due<=t)};
function planDay(quiet){const t=ymd(new Date());const L=todayOpen();const items=L.map((x,i)=>({id:x.id,min:x.min||estMin(x.text),at:x.fix!=null?x.fix:null,part:x.part||null,pri:x.pri,order:x.created||i}));
  const {over}=layoutDay(items,nextStart(),23*60,10);items.forEach(it=>{const x=findIn(todosDoc().list,it.id);if(!x)return;x.min=it.min;x.at=it.start;x.planDate=t});Store.touch('codex/todos');
  if(!quiet){Snd.play('done');toast(over.length?`Planned ${items.length-over.length}, ${over.length} won't fit`:`Planned ${items.length} to dos`,'ok',over.length?'Move the rest to tomorrow from the plan':'Tap any one to change its time')}return over.length}
function planView(){const t=ymd(new Date());const L=todayOpen();const planned=L.filter(x=>x.planDate===t&&x.at!=null).sort((a,b)=>a.at-b.at);const over=L.filter(x=>x.planDate===t&&x.at==null);const fresh=L.filter(x=>x.planDate!==t);const doneT=todosDoc().list.filter(x=>x.done&&x.planDate===t);
  if(!L.length&&!doneT.length)return `<section class="plate"><b>Nothing planned yet.</b><p class="muted small" style="margin:6px 0 0">Type your whole day in the box above, like: call Matt, edit the No5 reel, invoice Cortex, gym at 6. It splits it, tags each one to the right company and lays out your day.</p></section>`;
  const nm=nowMin();const end=planned.length?planned[planned.length-1].at+planned[planned.length-1].min:null;const mins=planned.reduce((a,x)=>a+x.min,0);
  let h=`<section class="lbl-row"><div class="lbl">Today · ${plural(planned.length,'block')}${end?` · done by ${clockOf(end)}`:''}</div><div class="btns"><button class="btn sm" data-act="planRun">${ico('time')}${planned.length?'Re-plan':'Plan my day'}</button></div></section>`;
  if(planned.length)h+=`<section class="tl">${planned.map(x=>{const live=nm>=x.at&&nm<x.at+x.min;const past=nm>=x.at+x.min;return `<div class="tl-r ${live?'live':''} ${past?'past':''}">${tlHead(x.at,x.min)}<span class="tl-d"></span><div class="td ${x.pri?'pri':''}"><button class="ck sm" data-act="tdTick" data-id="${x.id}" aria-label="Done">${ico('check')}</button><button class="td-main" data-act="planOpts" data-id="${x.id}"><span class="td-t">${esc(x.text)}</span><span class="chips">${tagChip(x.tag||'g')}${live?'<span class="chip acc">Now</span>':''}${x.fix!=null?'<span class="chip">Fixed time</span>':''}</span></button></div></div>`}).join('')}</section><p class="muted small">${durTxt(mins)} of work planned with short breaks between.</p>`;
  if(fresh.length)h+=`<section class="plate"><b>${plural(fresh.length,'to do')} not in the plan yet</b><div class="btns" style="margin-top:8px"><button class="btn sm pri" data-act="planRun">Fit them in</button></div></section>`;
  if(over.length)h+=`<section><div class="lbl-row"><div class="lbl">Won't fit today · ${over.length}</div><button class="btn sm ghost" data-act="planPush">Move to tomorrow</button></div>${over.map(todoRow).join('')}</section>`;
  if(doneT.length)h+=`<section><div class="lbl">Done today · ${doneT.length}</div>${doneT.map(todoRow).join('')}</section>`;
  return h}

function refParse(u){let url=String(u||'').trim();const m=url.match(/https?:\/\/[^\s]+/i);if(m)url=m[0];url=url.replace(/[)\].,]+$/,'');let host='',path='';try{const x=new URL(url);host=x.hostname.replace(/^www\.|^m\./,'');path=x.pathname}catch(e){return null}
  let platform=host,kind='Link',handle='';
  if(/instagram\.com$/.test(host)){platform='Instagram';const seg=path.split('/').filter(Boolean);if(/^reels?$/.test(seg[0]))kind='Reel';else if(seg[0]==='p')kind='Post';else if(seg[0]==='stories'){kind='Story';handle=seg[1]||''}else if(seg[0]==='tv')kind='Video';else if(seg[0]){kind='Profile';handle=seg[0]}
    url=`https://www.instagram.com${path.replace(/\/?$/,'/')}`}
  else if(/tiktok\.com$/.test(host)){platform='TikTok';const h=path.match(/@([^/]+)/);handle=h?h[1]:'';kind=/\/video\//.test(path)?'Video':handle?'Profile':'Video'}
  else if(/youtube\.com$|youtu\.be$/.test(host)){platform='YouTube';kind=/shorts/.test(path)?'Short':'Video'}
  else if(/linkedin\.com$/.test(host)){platform='LinkedIn';kind=/\/posts\/|\/feed\//.test(path)?'Post':'Page'}
  else if(/pinterest\./.test(host)){platform='Pinterest';kind='Pin'}
  else if(/x\.com$|twitter\.com$/.test(host)){platform='X';kind='Post'}
  return{url,platform,kind,handle}}

function allPosts(){const out=[];for(const k in Store.data){if(!k.startsWith('weeks/')||!Store.data[k])continue;const wid=k.slice(6);for(const p of (Store.data[k].posts||[]))out.push({p,wid})}return out}
function movePost(wid,pid,date){const w0=weekDoc(wid);const p=w0&&findIn(w0.posts,pid);if(!p)return false;const target=ymd(mondayOf(parseYmd(date)));p.date=date;if(target!==wid){removeIn(w0.posts,pid);Store.touch('weeks/'+wid);const w=weekDoc(target,true);w.posts.push(p);Store.touch('weeks/'+target)}else Store.touch('weeks/'+wid);return true}
RENDER.calendar=()=>{const ym=view.calMonth||ymOf(new Date());const [y,m]=ym.split('-').map(Number);const first=new Date(y,m-1,1);const start=mondayOf(first);const today=ymd(new Date());const sel=view.calDay||(ymOf(new Date())===ym?today:ymd(first));const f=view.calFilter||'';
  const all=allPosts().filter(x=>x.p.date&&(!f||x.p.cid===f));const by={};all.forEach(x=>{(by[x.p.date]=by[x.p.date]||[]).push(x)});
  const inMonth=all.filter(x=>x.p.date.startsWith(ym));const sch=inMonth.filter(x=>x.p.scheduled).length;const wait=inMonth.filter(x=>x.p.mediaStatus==='waiting').length;const undated=allPosts().filter(x=>!x.p.date&&(!f||x.p.cid===f));
  const cids=[...new Set(allPosts().map(x=>x.p.cid))].filter(id=>client(id));
  let h=`<section class="cal-h"><button class="ibtn" data-act="calMove" data-d="-1" aria-label="Previous month">${ico('back')}</button><div><b>${MONL[m-1]} ${y}</b><small>${plural(inMonth.length,'post')} · ${sch} scheduled${wait?` · ${wait} waiting on footage`:''}</small></div><button class="ibtn" data-act="calMove" data-d="1" aria-label="Next month">${ico('next')}</button></section>
  <section><div class="hs"><button class="chip big ${!f?'on':''}" data-act="calFilter" data-c="">All clients</button>${cids.map(id=>{const c=client(id);return `<button class="chip big ${f===id?'on':''}" data-act="calFilter" data-c="${id}"><span class="swatch" style="--c:${safeColor(c.color)}"></span>${esc(c.short||c.name)}</button>`}).join('')}${ymOf(new Date())!==ym?`<button class="chip big" data-act="calToday">Today</button>`:''}</div></section>
  <section class="cal"><div class="cal-dow">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<span>${d}</span>`).join('')}</div><div class="cal-g">`;
  for(let i=0;i<42;i++){const d=addDays(start,i);const k=ymd(d);if(i>=35&&d.getMonth()!==m-1)break;const items=(by[k]||[]).sort((a,b)=>(a.p.cid||'').localeCompare(b.p.cid||''));const out=d.getMonth()!==m-1;
    h+=`<div class="cal-c ${out?'out':''} ${k===today?'today':''} ${k===sel?'sel':''} ${k<today?'past':''}" data-act="calDay" data-d="${k}" data-drop="${k}"><span class="cal-n">${d.getDate()}${shootsDoc().list.some(s=>s.date===k&&(!f||s.cid===f))?'<i class="cal-sh" title="Shoot"></i>':''}</span><span class="cal-bars">${items.slice(0,4).map(x=>{const c=client(x.p.cid);return `<i class="${x.p.scheduled?'s':''} ${x.p.mediaStatus==='waiting'?'w':''}" style="--c:${safeColor(c&&c.color)}" draggable="true" data-drag="${x.wid}|${x.p.id}" title="${esc((c?c.short+': ':'')+(x.p.title||''))}"><em>${esc(x.p.title||'')}</em></i>`}).join('')}${items.length>4?`<small>+${items.length-4}</small>`:''}</span></div>`}
  h+=`</div><p class="muted small cal-key"><span><i class="k s"></i>scheduled</span><span><i class="k"></i>not yet</span><span><i class="k w"></i>waiting on footage</span>${matchMedia('(pointer:fine)').matches?'<span>drag a post to move it</span>':''}</p></section>`;
  const dayItems=(by[sel]||[]).slice().sort((a,b)=>(a.p.scheduled?1:0)-(b.p.scheduled?1:0));const sd=parseYmd(sel);
  h+=`<section><div class="lbl-row"><div class="lbl">${sel===today?'Today':fmtD(sd)} · ${plural(dayItems.length,'post')}</div><div class="btns"><button class="btn sm" data-act="shootNew" data-d="${sel}">${ico('cam')}Shoot</button><button class="btn sm" data-act="calAdd" data-d="${sel}">${ico('plus')}Add post</button></div></div>${(()=>{const S_=shootsDoc().list.filter(s=>s.date===sel&&(!f||s.cid===f));return S_.length?`<div class="list" style="margin-bottom:10px">${S_.map(shootRow).join('')}</div>`:''})()}${dayItems.length?dayItems.map(x=>{const c=client(x.p.cid);return postRow(x.p,x.wid).replace('<span class="pr-t',`<span class="pr-cl" style="--c:${safeColor(c&&c.color)}">${esc(c?c.short||c.name:'')}</span><span class="pr-t`).replace('</button></div>',`</button><button class="ibtn" data-act="calMoveOpts" data-w="${x.wid}" data-id="${x.p.id}" aria-label="Move">${ico('calendar')}</button></div>`)}).join(''):'<p class="empty">Nothing on this day.</p>'}</section>`;
  if(undated.length)h+=`<section><div class="lbl">No date yet · ${undated.length}</div>${undated.slice(0,10).map(x=>postRow(x.p,x.wid).replace('</button></div>',`</button><button class="ibtn" data-act="calMoveOpts" data-w="${x.wid}" data-id="${x.p.id}" aria-label="Set date">${ico('calendar')}</button></div>`)).join('')}</section>`;
  return h};

/* ================= RETAINER TRACKER ================= */
const DELIV_SRC=[['manual','I tap + and minus'],['posts','Posts ticked as out'],['shoots','Shoots marked done'],['hours','Hours logged']];
function delivCount(c,d,ym){const src=d.src||'manual';if(src==='manual')return((c.deliv&&c.deliv[ym])||{})[d.id]||0;
  if(src==='posts'){const kw=norm(d.kw||'');return allPosts().filter(x=>x.p.cid===c.id&&x.p.date&&x.p.date.startsWith(ym)&&x.p.scheduled&&(!kw||norm([x.p.title,x.p.caption,x.p.mediaLabel].join(' ')).includes(kw))).length}
  if(src==='shoots')return shootsDoc().list.filter(s=>s.cid===c.id&&s.status==='done'&&s.date.startsWith(ym)).length;
  if(src==='hours'){const [a,z]=monthRange(ym);return Math.round(hrs((msByCat(a,z)[c.id])||0)*10)/10}return 0}
function paceOf(ym){const now=new Date();const [a]=monthRange(ym);const dim=new Date(a.getFullYear(),a.getMonth()+1,0).getDate();return ym===ymOf(now)?now.getDate()/dim:(ym<ymOf(now)?1:0)}
function retainerBoard(){const ym=ymOf(new Date());const fr=paceOf(ym);const cs=clients().filter(c=>(c.deliverables||[]).length);if(!cs.length)return `<section><div class="lbl">Retainers · ${fmtYm(ym)}</div><p class="empty">Open a client and add monthly targets, like 12 posts or 1 shoot. They count themselves from your posts, shoots and hours.</p></section>`;
  return `<section><div class="lbl">Retainers · ${fmtYm(ym)}</div><div class="rboard">${cs.map(c=>{const ds=c.deliverables;const items=ds.map(d=>{const have=delivCount(c,d,ym),t=d.target||0;const p=t?Math.min(1,have/t):0;const behind=t&&have<t*fr-1;return{d,have,t,p,behind}});const bad=items.filter(i=>i.behind).length;
    return `<button class="rb" data-act="openClient" data-id="${c.id}" data-tab="overview" style="--c:${safeColor(c.color)}"><span class="rb-h"><span class="swatch"></span><b>${esc(c.short||c.name)}</b>${bad?`<span class="chip warn">${bad} behind</span>`:'<span class="chip ok">On pace</span>'}</span>${items.map(i=>`<span class="rb-r"><small>${esc(i.d.label)}</small><span class="bar ${i.p>=1?'ok':''}"><i style="width:${(i.p*100).toFixed(1)}%"></i>${fr>0&&fr<1?`<span class="pace" style="left:${(fr*100).toFixed(1)}%"></span>`:''}</span><small class="num">${i.have}/${i.t}</small></span>`).join('')}</button>`}).join('')}</div></section>`}

/* ================= EXPENSES FROM BANK TEXTS =================
   Screenshot (read on the phone with on device text recognition) or pasted text.
   Finds every card purchase, skips balances, refunds, OTPs and declines, and never adds the same one twice. */
const SMS_CUR={aed:'AED',dhs:'AED',dh:'AED',usd:'USD',gbp:'GBP',eur:'EUR',sar:'SAR',inr:'INR'};
const MONS3=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function smsDateIn(t,fallback){let m=t.match(/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/);if(m)return ymd(new Date(+m[1],+m[2]-1,+m[3]));

  m=t.match(/\b(\d{1,2})[\s-]*(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*[\s,-]*(\d{2,4})?\b/i);if(m){let y=m[3]?+m[3]:new Date().getFullYear();if(y<100)y+=2000;const d=new Date(y,MONS3.indexOf(m[2].slice(0,3).toLowerCase()),+m[1]);if(!m[3]&&d>addDays(new Date(),2))d.setFullYear(y-1);return ymd(d)}
  m=t.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\s+(\d{1,2}),?\s*(\d{4})?\b/i);if(m){const y=m[3]?+m[3]:new Date().getFullYear();return ymd(new Date(y,MONS3.indexOf(m[1].slice(0,3).toLowerCase()),+m[2]))}
  return fallback}
/* the grey headers in Messages: "Today 14:22", "Yesterday 9:41 AM", "Mon 26 Oct at 14:22", "Monday" */
function smsHeaderDate(line){const l=line.trim();if(l.length>40)return null;const now=new Date();
  if(/^today\b/i.test(l))return ymd(now);if(/^yesterday\b/i.test(l))return ymd(addDays(now,-1));
  const wd=l.match(/^(sun|mon|tue|wed|thu|fri|sat)[a-z]*\b(?!\s*\d{1,2}\s*[a-z]{3})/i);if(wd&&!/\d{1,2}\s*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/i.test(l)){const want=['sun','mon','tue','wed','thu','fri','sat'].indexOf(wd[1].toLowerCase());for(let i=1;i<=7;i++){const d=addDays(now,-i);if(d.getDay()===want)return ymd(d)}}
  if(/\b(at|am|pm|\d{1,2}:\d{2})\b/i.test(l)||/^(sun|mon|tue|wed|thu|fri|sat)/i.test(l)){const d=smsDateIn(l,null);if(d)return d}return null}
function smsMerchant(t){const stop='(?=\\s+(?:on|dated|dt|with|using|via|for|from|card|ref|reference|txn|transaction)\\b|[.;]\\s|,\\s*(?:avl|available|bal|on)\\b|\\s+avl|\\s+available|\\s+bal\\b|$)';
  for(const re of [new RegExp('\\b(?:at|@)\\s+(.{2,60}?)'+stop,'i'),new RegExp('\\btowards\\s+(.{2,60}?)'+stop,'i'),new RegExp('\\b(?:transferred|sent|paid|payment)\\s+to\\s+(.{2,60}?)'+stop,'i'),new RegExp('\\bmerchant[:\\s]+(.{2,60}?)'+stop,'i')]){const m=t.match(re);if(m)return cleanMerchant(m[1])}return ''}
function cleanMerchant(s){s=String(s||'').replace(/\s+/g,' ').replace(/\s+[0-9][0-9-]{2,}\b/g,' ').replace(/[*_]+/g,' ').replace(/\b(dubai|abu dhabi|sharjah|ajman|uae|ae|are|al ain|ras al khaimah)\b\.?/ig,' ').replace(/[,\-\s]+$/,'').replace(/^[,\-\s]+/,'').replace(/\s{2,}/g,' ').trim();
  if(!s)return '';if(s===s.toUpperCase())s=s.toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase()).replace(/\b(Llc|Fze|Fz|Co|Lls)\b/g,x=>x.toUpperCase());return s.slice(0,40)}
function smsCat(to,text){const nt=norm(to);if(nt){for(const e of moneyDoc().expenses.slice().reverse()){const t=norm(e.to||'');if(t&&t.split(' (')[0]===nt)return e.cat}}
  const s=to+' '+text;for(const [re,cat] of VENDOR_HINTS)if(re.test(s))return cat==='AD'?'Ad Spend (RRG)':cat;
  if(/\b(apple\.com|itunes|google \*|youtube|spotify|netflix|openai|chatgpt|anthropic|canva|adobe)\b/i.test(s))return 'Software & Subscriptions';
  if(/\b(facebk|facebook|meta platforms|instagram|tiktok ads|google ads|ads)\b/i.test(s))return 'Ad Spend (RRG)';return 'Other'}
const SKIP_RE=/\b(otp|one[- ]time password|verification code|passcode|declined|unsuccessful|failed|insufficient|not been processed|was not completed)\b/i;
const CREDIT_RE=/\b(credited|refund(ed)?|reversal|reversed|received|deposit(ed)?|cash ?back|salary)\b/i;
const DEBIT_RE=/\b(purchase|spent|debited|used|payment of|paid|withdrawn|withdrawal|charged|transaction of|txn of|pos)\b/i;
const SMS_START=/(?:(?<=^)|(?<=[.!?]\s{0,3})|(?<=[0-9]\s{1,3}))(?=\b(?:Purchase of|Your (?:Cr\.?\s?Card|Credit Card|Debit Card|Card|OTP|account|a\/c|transaction)|Thank you for using|Dear (?:Customer|Client|Card ?member)|Transaction of|Txn of|Refund of|Payment of|A (?:purchase|transaction|payment) of|You have (?:spent|paid|made|used)|(?:AED|USD|GBP|EUR|SAR)\s?[0-9][0-9,]*(?:\.[0-9]{1,2})?\s+(?:was|has been|is|debited|spent|charged)\b))/i;
function smsParse(text){const lines=String(text||'').replace(/\r/g,'').split('\n');const segs=[];let buf=[],hdr=ymd(new Date());
  const flush=()=>{if(buf.length){segs.push({t:buf.join(' ').replace(/\s+/g,' ').trim(),day:hdr});buf=[]}};
  for(const raw of lines){const l=raw.trim();if(!l)continue;const hd=smsHeaderDate(l);if(hd&&!/\d[\d,]*\.\d{2}/.test(l)){flush();hdr=hd;continue}buf.push(l)}flush();
  const blocks=[];for(const sg of segs){for(const piece of sg.t.split(SMS_START)){const p=piece.trim();if(p.length>8)blocks.push({t:p,day:sg.day})}}
  const out=[],skipped={balance:0,credit:0,other:0};
  for(const b of blocks){const t=b.t;if(SKIP_RE.test(t)){skipped.other++;continue}
    const re=/(?:\b(AED|AED\.|Dhs?|USD|GBP|EUR|SAR|INR)\s?([0-9][0-9,]*(?:\.[0-9]{1,2})?)|([0-9][0-9,]*\.[0-9]{2})\s?(AED|Dhs?|USD|GBP|EUR|SAR|INR)\b)/gi;let m,found=null;
    while((m=re.exec(t))){const before=t.slice(Math.max(0,m.index-28),m.index);if(/(av[a-z]{0,7}|bal[a-z]*|limit|outstanding|due|minimum)\W*(?:is|of|:)?\W*$/i.test(before))continue;const cur_=(m[1]||m[4]||'AED').toLowerCase().replace('.','').replace(/^dhs?$/,'dhs');const amt=+(m[2]||m[3]).replace(/,/g,'');if(!(amt>0))continue;found={amount:Math.round(amt*100)/100,cur:SMS_CUR[cur_]||'AED'};break}
    if(!found){if(/\d/.test(t)&&/(av[a-z]{0,7}|balance)/i.test(t))skipped.balance++;continue}
    if(CREDIT_RE.test(t)&&!DEBIT_RE.test(t)){skipped.credit++;continue}
    if(!/(purchase|spent|used|using|debited|paid|payment|transaction|txn|charged|transferred|withdraw|pos|for (?:aed|usd|gbp|eur))/i.test(t)){skipped.other++;continue}
    const to=smsMerchant(t)||'';const date=smsDateIn(t,b.day);const tmm=t.match(/\b(\d{1,2}:\d{2})(?::\d{2})?\s*(am|pm)?\b/i);const tm=tmm?tmm[1]+(tmm[2]?tmm[2]:''):'';const card=(t.match(/(?:ending(?: with)?|no\.?|card\s*(?:no\.?)?|x{2,}|\*{2,})\s*:?\s*(\d{4})\b/i)||[])[1]||'';
    out.push({amount:found.amount,cur:found.cur,to,date,time:tm.replace(/\s+/g,'').toLowerCase(),card,cat:smsCat(to,t),raw:t.slice(0,220)})}
  /* the same text twice, from overlapping screenshots */
  const seen=new Set();const uniq=[];for(const x of out){const k=smsKey(x);if(seen.has(k)){x.dupBatch=1;continue}seen.add(k);uniq.push(x)}
  return{items:uniq,skipped,dupInBatch:out.length-uniq.length}}
const smsKey=x=>[x.date,x.amount.toFixed(2),x.cur,norm(x.to).replace(/[^a-z0-9]/g,'').slice(0,12),x.time||''].join('|');
function smsCheckExisting(x){const L=moneyDoc().expenses;const k=smsKey(x);const nm=norm(x.to).replace(/[^a-z0-9]/g,'').slice(0,8);
  const sim=e=>{const a=norm(e.to||'').replace(/[^a-z0-9]/g,'');return !nm||!a||a.slice(0,4)===nm.slice(0,4)};const exact=L.find(e=>e.smsKey===k||(e.date===x.date&&Math.abs((+e.amount||0)-x.amount)<.005&&(e.cur||'AED')===x.cur&&sim(e)));

  const near=L.find(e=>Math.abs((+e.amount||0)-x.amount)<.005&&(e.cur||'AED')===x.cur&&Math.abs(daysBetween(parseYmd(e.date),parseYmd(x.date)))<=2&&sim(e));
  if(near)return{state:'maybe',e:near};return{state:'new'}}

/* on device text recognition, loaded the first time you use it */
let _tess=null;function loadTess(){if(window.Tesseract)return Promise.resolve(window.Tesseract);if(_tess)return _tess;_tess=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=()=>res(window.Tesseract);s.onerror=()=>{_tess=null;rej(new Error('Could not load the text reader. Check your connection.'))};document.head.appendChild(s)});return _tess}
function prepImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const k=Math.min(2,2400/Math.max(img.width,1));const W=Math.round(img.width*k),H=Math.round(img.height*k);const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.drawImage(img,0,0,W,H);URL.revokeObjectURL(url);
    try{const d=g.getImageData(0,0,W,H);const p=d.data;let sum=0;for(let i=0;i<p.length;i+=4){const y=.299*p[i]+.587*p[i+1]+.114*p[i+2];p[i]=p[i+1]=p[i+2]=y;sum+=y}const dark=sum/(p.length/4)<128;

  return `<div class="fbars" style="--n:${n}">${D.map(d=>`<${act?'button':'div'} class="fbar ${act&&finV().mode==='month'&&finV().ym===d.m?'on':''}" ${act?`data-act="${act}" data-m="${d.m}"`:''} aria-label="${fmtYm(d.m)} ${fmtA(d.v)}"><em class="num">${d.v?fmtS(d.v>=1000?Math.round(d.v/100)*100:d.v).replace(/,000$/,'k').replace(/,(\d)00$/,'.$1k'):''}</em><span><i style="height:${(d.v/mx*100).toFixed(1)}%"></i></span><small>${MON[+d.m.slice(5)-1].slice(0,3)}</small></${act?'button':'div'}>`).join('')}</div>${avg?`<p class="muted small" style="margin:6px 0 0">Average ${fmtA(avg)} a month across months with spending.</p>`:''}`}
function finRow(e){const c=e.cat;return `<div class="inv frow"><button class="inv-main" data-act="expEdit" data-id="${e.id}"><span class="fdot" style="--c:${catCol(c)}"></span><span class="fmain"><b>${esc((e.to||e.desc||'Expense').split(' (')[0])}</b><small>${esc(catLabel(c))} · ${fmtDM(parseYmd(e.date))}${isMe(e)?' · personal':''}${e.cid&&client(e.cid)?' · '+esc(client(e.cid).short):''}</small></span></button><div class="inv-r"><span class="inv-amt">${e.cur&&e.cur!=='AED'?money(e.amount,e.cur):fmtA(eAmt(e))}</span></div></div>`}
function sortCands(){const M=moneyDoc();const out=[];M.expenses.forEach(e=>{if(NO_SPEND.has(e.cat))return;const g=catFor(e.to,(e.desc||'')+' '+(e.notes||''));
  if(e.cat==='Other'||!e.cat)out.push({e,g:g&&g!=='Other'?g:''});else if(LEGACY_FIT[e.cat]&&!e.cid&&g&&g!==e.cat&&LEGACY_FIT[e.cat].includes(catGroup(g)))out.push({e,g,legacy:1})});return out}

/* ---------- the Expenses sub app ---------- */
moneyExpenses=function(){const v=finV();const R=finRange(v);const L=spendIn(v,R.f,R.t);const tot=sumA(L);const P=R.prev?sumA(spendIn(v,R.prev.f,R.prev.t)):null;
  const start=v.mode==='all'?R.start:R.f;const days=Math.max(1,daysBetween(parseYmd(start),parseYmd(R.end)));const big=L.slice().sort((a,b)=>eAmt(b)-eAmt(a));
  const byG={},byC={};L.forEach(e=>{const g=catGroup(e.cat);byG[g]=(byG[g]||0)+eAmt(e);byC[e.cat]=(byC[e.cat]||0)+eAmt(e)});const G=Object.keys(byG).sort((a,b)=>byG[b]-byG[a]);const topC=Object.keys(byC).sort((a,b)=>byC[b]-byC[a])[0];
  const moved=moneyDoc().expenses.filter(e=>NO_SPEND.has(e.cat)&&e.date>=R.f&&e.date<R.t&&inScope(v,e));
  let h=`<section class="btns fin-top"><button class="btn pri" data-act="smsOpen">${ico('cam')}From bank texts</button><button class="btn" data-act="finAdd">${ico('plus')}Add expense</button></section>
  <section><div class="seg">${[['month','Month'],['year','Year'],['all','All time']].map(([k,l])=>`<button class="${v.mode===k?'on':''}" data-act="finMode" data-v="${k}">${l}</button>`).join('')}</div>
  ${v.mode!=='all'?`<div class="weeknav" style="margin:10px 0 0"><button class="ibtn" data-act="finStep" data-d="-1" aria-label="Back">${ico('back')}</button><b style="flex:1;text-align:center">${esc(R.label)}</b><button class="ibtn" data-act="finStep" data-d="1" aria-label="Forward">${ico('next')}</button></div>`:''}
  <div class="hs" style="margin-top:10px">${[['all','Everything'],['biz','Business account'],['me','Personal']].map(([k,l])=>`<button class="chip big ${v.scope===k?'on':''}" data-act="finScope" data-v="${k}">${l}</button>`).join('')}</div></section>`;
  const ch=P?Math.round((tot-P)/P*100):null;
  h+=`<section><div class="mgrid"><div class="mt big"><small>Spent${v.mode==='all'?'':' in '+esc(R.label)}</small><b>${fmtA(tot)}</b><em>${P!=null&&P>0?`<span style="color:${tot>P?'var(--bad)':'var(--ok)'}">${tot>P?'▲':'▼'} ${Math.abs(ch)}%</span> vs ${R.prevL} (${fmtA(P)})`:`${plural(L.length,'payment')}`}</em></div>
  <div class="mt"><small>Payments</small><b>${L.length}</b><em>${L.length?fmtA(tot/L.length)+' average':'none yet'}</em></div><div class="mt"><small>Per day</small><b>${fmtA(tot/days)}</b><em>over ${plural(days,'day')}</em></div>
  <div class="mt"><small>Biggest payment</small><b>${big[0]?fmtA(eAmt(big[0])):'·'}</b><em>${big[0]?esc((big[0].to||big[0].desc||'').split(' (')[0]):''}</em></div><div class="mt"><small>Top category</small><b class="fcat">${topC?esc(catLabel(topC)):'·'}</b><em>${topC?fmtA(byC[topC])+' · '+pct(byC[topC],tot)+'%':''}</em></div></div>
  ${moved.length?`<p class="muted small" style="margin:8px 2px 0">${fmtA(sumA(moved))} moved between your own accounts or paid off cards. Not counted as spending.</p>`:''}</section>`;
  const sc=sortCands();const other=sc.filter(x=>!x.legacy);if(sc.length){const auto=sc.filter(x=>x.g&&!x.legacy).length;
    h+=`<section><button class="fsort" data-act="finSortOpen"><span class="fsort-n num">${other.length||sc.length}</span><span><b>${other.length?`${plural(other.length,'payment')} in Other`:`${plural(sc.length,'payment')} could be more specific`}</b><small>${auto?`${auto} can be sorted for you in one tap`:'Pick a category once per place and the app remembers it'}</small></span>${ico('next')}</button></section>`}
  if(!L.length)return h+`<section><p class="empty">No spending ${v.mode==='all'?'yet':'in '+esc(R.label)}${v.scope!=='all'?' for this filter':''}.</p></section>`+finTxSection(v,L);
  let acc=0;const grad=G.map(g=>{const a=acc;acc+=byG[g]/tot*100;return `${GROUP_COL[g]} ${a.toFixed(2)}% ${acc.toFixed(2)}%`}).join(',');
  h+=`<section><div class="lbl">Where it goes</div><div class="fwhere"><div class="donut-w"><div class="donut" style="background:conic-gradient(${grad})"></div><div class="donut-c"><b class="num">${fmtS(tot)}</b><small>AED</small></div></div>
  <div class="fleg">${G.map(g=>{const open=v.group===g;const cats=Object.keys(byC).filter(c=>catGroup(c)===g).sort((a,b)=>byC[b]-byC[a]);const mx=Math.max(...cats.map(c=>byC[c]));
    return `<button class="fleg-r ${open?'on':''}" data-act="finGroup" data-g="${esc(g)}" style="--c:${GROUP_COL[g]}"><i></i><span>${esc(g)}</span><em class="num">${pct(byG[g],tot)}%</em><b class="num">${fmtS(byG[g])}</b></button>
    ${open?`<div class="fcats">${cats.map(c=>`<button class="fcat-r" data-act="finCat" data-c="${esc(c)}" style="--c:${GROUP_COL[g]}"><span>${esc(catLabel(c))}</span><span class="fbr"><i style="width:${(byC[c]/mx*100).toFixed(1)}%"></i></span><b class="num">${fmtS(byC[c])}</b></button>`).join('')}</div>`:''}`}).join('')}</div></div><p class="muted small" style="margin:8px 2px 0">Tap a group to see its categories, then a category for the detail.</p></section>`;
  h+=`<section><div class="lbl">Top 5 biggest payments</div><div class="ftop">${big.slice(0,5).map((e,i)=>`<button class="ftop-r" data-act="expEdit" data-id="${e.id}"><span class="ftop-n num">${i+1}</span><span class="fmain"><b>${esc((e.to||e.desc||'Expense').split(' (')[0])}</b><small><span class="fdot" style="--c:${catCol(e.cat)}"></span>${esc(catLabel(e.cat))} · ${fmtDM(parseYmd(e.date))}</small></span><b class="num">${fmtA(eAmt(e))}</b></button>`).join('')}</div></section>`;
  const PL=placesOf(L);const pmx=PL[0]?PL[0].sum:1;
  h+=`<section><div class="lbl">Where you spend most</div><div class="fplaces">${PL.slice(0,8).map(p=>`<button class="fpl" data-act="finPlace" data-k="${esc(p.k)}" style="--c:${catCol(p.cat)}"><span class="fmain"><b>${esc(p.name)}</b><small>${p.n>1?`${p.n} times · ${fmtA(p.sum/p.n)} each`:fmtDM(parseYmd(p.last))} · ${esc(catLabel(p.cat))}</small></span><span class="fpl-v"><b class="num">${fmtA(p.sum)}</b><span class="fbr"><i style="width:${(p.sum/pmx*100).toFixed(1)}%"></i></span></span></button>`).join('')}</div></section>`;
  const endYm=v.mode==='month'?v.ym:v.mode==='year'&&v.y<String(new Date().getFullYear())?v.y+'-12':ymOf(new Date());

  const dow=[0,0,0,0,0,0,0];const byDay={};L.forEach(e=>{const d=parseYmd(e.date);dow[(d.getDay()+6)%7]+=eAmt(e);byDay[e.date]=(byDay[e.date]||0)+eAmt(e)});const dmx=Math.max(1,...dow);const topD=dow.indexOf(Math.max(...dow));const bd=Object.keys(byDay).sort((a,b)=>byDay[b]-byDay[a])[0];const DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],DF=['Mondays','Tuesdays','Wednesdays','Thursdays','Fridays','Saturdays','Sundays'];
  const spendDays=Object.keys(byDay).length;
  h+=`<section><div class="lbl">When you spend</div><div class="fdow">${dow.map((x,i)=>`<div class="${i===topD?'on':''}"><span><i style="height:${(x/dmx*100).toFixed(1)}%"></i></span><small>${DN[i]}</small></div>`).join('')}</div>
  <p class="muted small" style="margin:8px 2px 0">Most goes out on ${DF[topD]}. Biggest day was ${fmtD(parseYmd(bd))} at ${fmtA(byDay[bd])}.${v.mode!=='all'?` ${plural(Math.max(0,days-spendDays),'day')} with no spending.`:''}</p></section>`;
  h+=finInsights(v,R,L,tot,byC,PL);
  return h+finTxSection(v,L)};
function finInsights(v,R,L,tot,byC,PL){const out=[];
  if(R.prev){const PL2=spendIn(v,R.prev.f,R.prev.t);const pc={};PL2.forEach(e=>{pc[e.cat]=(pc[e.cat]||0)+eAmt(e)});const ks=[...new Set([...Object.keys(byC),...Object.keys(pc)])].map(c=>({c,d:(byC[c]||0)-(pc[c]||0)})).sort((a,b)=>b.d-a.d);
    const up=ks[0],dn=ks[ks.length-1];if(up&&up.d>50)out.push(`<b>${esc(catLabel(up.c))}</b> is up ${fmtA(up.d)} vs ${R.prevL} (${fmtA(byC[up.c]||0)} vs ${fmtA(pc[up.c]||0)}).`);if(dn&&dn.d<-50)out.push(`<b>${esc(catLabel(dn.c))}</b> is down ${fmtA(-dn.d)} vs ${R.prevL}. Nice.`)}
  const freq=PL.filter(p=>p.n>1&&!p.k.startsWith('id:')).sort((a,b)=>b.n-a.n)[0];if(freq)out.push(`You paid <b>${esc(freq.name)}</b> ${freq.n} times, ${fmtA(freq.sum)} in total.`);
  const food=['Food Delivery','Restaurants','Fast Food','Cafes & Coffee'].reduce((a,c)=>a+(byC[c]||0),0);if(food>0&&tot)out.push(`Eating and drinking out is ${pct(food,tot)}% of spending (${fmtA(food)}).${byC['Food Delivery']?` Delivery alone is ${fmtA(byC['Food Delivery'])}.`:''}`);
  const rec=moneyDoc().recurring.filter(r=>r.active!==false&&(v.scope==='all'||(v.scope==='me'?r.kind==='personal':r.kind!=='personal'))).reduce((a,r)=>a+perMonth(r),0);if(rec)out.push(`Subscriptions and running costs come to ${fmtA(rec)} a month (${fmtA(rec*12)} a year).`);
  if(v.scope==='all'&&tot){const me=sumA(L.filter(isMe));if(me&&me<tot)out.push(`Split: personal ${pct(me,tot)}%, business account ${100-pct(me,tot)}%.`)}
  const oth=byC['Other']||0;if(oth&&tot&&oth/tot>.1)out.push(`${fmtA(oth)} (${pct(oth,tot)}%) is still in Other. Sorting it makes all of this sharper.`);
  return out.length?`<section><div class="lbl">Worth knowing</div><div class="fins">${out.slice(0,5).map(t=>`<p>${t}</p>`).join('')}</div></section>`:''}
function finTxList(v,L){const q=norm(v.q||'');let X=L.filter(e=>!q||norm([e.to,e.desc,e.cat,catLabel(e.cat),e.notes].join(' ')).includes(q));X=X.sort(v.sort==='big'?(a,b)=>eAmt(b)-eAmt(a):(a,b)=>b.date<a.date?-1:b.date>a.date?1:0);
  const lim=v.more?X.length:30;return (X.slice(0,lim).map(finRow).join('')||'<p class="empty">Nothing matches.</p>')+(X.length>lim?`<button class="btn ghost" data-act="finMore" style="margin-top:8px">Show all ${X.length}</button>`:'')}
function finTxSection(v,L){return `<section><div class="lbl-row"><div class="lbl">Every payment</div><div class="seg sm">${[['new','Newest'],['big','Biggest']].map(([k,l])=>`<button class="${v.sort===k?'on':''}" data-act="finSort" data-v="${k}">${l}</button>`).join('')}</div></div>
  <input class="in" id="finQ" placeholder="Search shops, categories, notes" value="${esc(v.q||'')}" data-in="finQ" autocomplete="off" style="margin-bottom:8px"><div id="finTx">${finTxList(v,L)}</div></section>
  <section class="btns"><button class="btn ghost" data-act="expNew">${ico('plus')}Add with the full form</button></section>`}

PANELS.finCat=pn=>{const c=pn.id;if(!c)return null;const v=finV();const R=finRange(v);const all=moneyDoc().expenses.filter(e=>e.cat===c&&inScope(v,e));const L=all.filter(e=>e.date>=R.f&&e.date<R.t);const tot=sumA(L);

const DATE_RE=/^(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?(\s*[-–—:|•·]\s*|\s+|$)(.*)$/;
function headingClient(t,isHead){const n=norm(t);if(!n||n.length>60)return null;const hits=allClients().filter(c=>aliasesOf(c).some(a=>{if(n===a)return true;if(!n.startsWith(a))return false;const rest=n.slice(a.length);return isHead?/^([^a-z0-9]|$)/.test(rest):/^\s*([-–—|:(•·/]|$)/.test(rest)}));
  if(hits.length===1)return hits[0];if(hits.length>1)return 'multi';return isHead?'unknown':null}

function resolveDate(a,b,y,hint){const now=new Date();const c=[];for(const [m,d] of [[a,b],[b,a]]){if(m<1||m>12||d<1||d>31)continue;const ys=y?[y<100?2000+y:y]:[now.getFullYear()-1,now.getFullYear(),now.getFullYear()+1];for(const yy of ys){const dt=new Date(yy,m-1,d);if(dt.getMonth()===m-1)c.push(dt)}}
  if(!c.length)return null;c.sort((p,q)=>score(p)-score(q));return ymd(c[0]);function score(dt){let s=Math.abs(dt-now)/864e5;if(hint!=null&&dt.getMonth()===hint)s-=400;return s}}
/* day names: "Monday" or "Wed - Title" start a post, dated inside the chosen week */
const DAYS_RE=/^(mon(?:day)?|tue(?:s|sday)?|wed(?:nesday)?|thu(?:r|rs|rsday)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?)\.?\s*(?:[-–—:|•·]\s*(.*))?$/i;
const dowIdx=s=>({mon:0,tue:1,wed:2,thu:3,fri:4,sat:5,sun:6})[s.slice(0,3).toLowerCase()];
/* pasted on a Monday it is for this week, any other day it is for next week */
function pasteWeekDefault(){const t=new Date();t.setHours(0,0,0,0);return ymd(t.getDay()===1?t:mondayOf(addDays(t,7)))}
const clipTitle=s=>{s=String(s).replace(/\s+/g,' ').trim();if(s.length<=60)return s;const c=s.slice(0,60);const i=c.lastIndexOf(' ');return(i>30?c.slice(0,i):c).replace(/[,.;:!?]+$/,'')+'...'};
function parseLines(lines,opts={}){const posts=[],skipped={};let cid=null,section='',cur=null,hint=null,docTitle='';const week=opts.week||pasteWeekDefault();
  const flush=()=>{if(cur){if(!cur.title){const f0=cur.cap.find(x=>x.trim());cur.title=f0?clipTitle(f0):'Untitled'}cur.caption=cur.cap.join('\n').replace(/\n{3,}/g,'\n\n').trim();delete cur.cap;if(cur.cid)posts.push(cur);else skipped[cur.section||'No heading']=(skipped[cur.section||'No heading']||0)+1;cur=null}};
  const start=(title,raw,dow)=>{flush();cur={cid,section,raw,dow:dow==null?null:dow,title:title||(dow!=null?'':'Untitled'),cap:[],tags:'',mediaUrl:'',mediaLabel:'',mediaStatus:'none'}};
  for(const ln of lines){const t=String(ln.text||'').replace(/ /g,' ').trim();
    if(!t){if(cur)cur.cap.push('');continue}
    const isHead=/^(HEADING|TITLE|SUBTITLE)/.test(ln.style||'');
    if(hint==null){const mh=monthHintOf(t);if(mh!=null&&!cur&&/week|month|^[a-z]+\s*\d*$/i.test(t))hint=mh}
    const dd=t.length<70&&t.match(DAYS_RE);if(dd){start((dd[2]||'').trim(),null,dowIdx(dd[1]));continue}
    const dm=t.match(DATE_RE);
    if(dm&&(dm[4].trim()||ln.bold||!dm[5])&&(dm[5]||ln.bold)){const a=+dm[1],b=+dm[2];if(a<=31&&b<=31&&(a<=12||b<=12)){start(dm[5].trim(),[a,b,dm[3]?+dm[3]:null]);continue}}
    const hc=headingClient(t,isHead);
    if(hc==='multi'){if(!docTitle)docTitle=t;continue}
    if(hc&&hc!=='unknown'){flush();cid=hc.id;section=t;continue}
    if(hc==='unknown'){flush();if(monthHintOf(t)!=null&&/week/i.test(t)){if(hint==null)hint=monthHintOf(t);continue}cid=null;section=t;continue}
    if(!cur){if(ln.bold&&cid&&!/week/i.test(t))start(t,null);continue}
    if(/^media\b/i.test(t)){const rest=t.replace(/^media\s*[-–—:]*\s*/i,'');cur.mediaLabel=rest;const u=ln.href||((rest.match(/https?:\/\/\S+/)||[])[0])||'';cur.mediaUrl=u;cur.mediaStatus=/waiting|tbc|tbd|pending|to come|need|soon/i.test(rest)?'waiting':(u||rest)?'ready':'none';continue}

    if(ln.bold&&(cur.cap.some(Boolean)||cur.mediaLabel)){start(t,null);continue}
    cur.cap.push(t)}
  flush();
  posts.forEach(p=>{p.date=p.raw?resolveDate(p.raw[0],p.raw[1],p.raw[2],hint):p.dow!=null?ymd(addDays(parseYmd(week),p.dow)):null;delete p.raw;delete p.section});
  return{posts,skipped,docTitle,days:posts.some(p=>p.dow!=null),week}}
function textToLines(text){return String(text).replace(/\r/g,'').split(/\n|\u000b/).map(s=>({text:s}))}
function htmlToLines(html){try{const d=new DOMParser().parseFromString(html,'text/html');const blocks=[...d.body.querySelectorAll('p,h1,h2,h3,h4,h5,h6,li')].filter(b=>!b.querySelector('p,li'));if(!blocks.length)return null;
  return blocks.map(b=>{const spans=[...b.querySelectorAll('span')].filter(s=>s.textContent.trim()&&!s.querySelector('span'));const bold=spans.length>0&&spans.every(s=>/font-weight:\s*(700|800|bold)/.test(s.getAttribute('style')||''));const a=b.querySelector('a[href]');return{text:b.textContent,style:/^H\d$/.test(b.tagName)?'HEADING_'+b.tagName[1]:'',bold,href:a?a.getAttribute('href'):''}})}catch(e){return null}}
function docBodyToLines(content,out=[]){for(const el of content||[]){if(el.paragraph){const p=el.paragraph;let text='',href='',any=false,boldAll=true;for(const e of p.elements||[]){if(e.textRun){const s=e.textRun.content||'';text+=s;if(s.trim()){any=true;if(!(e.textRun.textStyle&&e.textRun.textStyle.bold))boldAll=false}const u=e.textRun.textStyle&&e.textRun.textStyle.link&&e.textRun.textStyle.link.url;if(u&&!href)href=u}else if(e.richLink){const rp=e.richLink.richLinkProperties||{};text+=rp.title||'';if(!href)href=rp.uri||'';any=true}else if(e.person){text+=(e.person.personProperties||{}).name||''}}
    const parts=text.replace(/\n$/,'').split('\u000b');parts.forEach((s,i)=>out.push({text:s,style:i===0?(p.paragraphStyle||{}).namedStyleType||'':'',bold:any&&boldAll,href}))}

function flattenTabs(tabs,out=[]){for(const t of tabs||[]){out.push(t);if(t.childTabs)flattenTabs(t.childTabs,out)}return out}
