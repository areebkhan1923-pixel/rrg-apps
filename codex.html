<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RRG CODEX"><meta name="application-name" content="RRG CODEX"><meta name="theme-color" content="#0c0305">
<link rel="apple-touch-icon" href="codex-icon.png"><link rel="icon" href="codex-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>RRG CODEX</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@300;400;600&family=M+PLUS+1p:wght@300;400;500;700;800&display=swap">
<style>
/* Layout: handheld console menu. Status bar, horizontal category rail, vertical item column, sliding sub panels, bottom sheets. One dark red world, so a single deliberate theme. */
:root{
  --bg:#0c0305; --ink:#fbf3f3; --dim:rgba(251,236,236,.62); --faint:rgba(251,236,236,.36);
  --line:rgba(255,232,232,.17); --line2:rgba(255,232,232,.08);
  --accent:#ff3341; --accent2:#ff8a92; --glow:rgba(255,60,72,.55);
  --glass:rgba(14,3,5,.66); --glass2:rgba(255,240,240,.06); --glass3:rgba(255,240,240,.12);
  --ok:#8df0b2; --warn:#ffd36e; --bad:#ff7378;
  --bronze:#d8925f; --silver:#d5dce4; --gold:#f5cf55; --plat:#a6dcff;
  --f-ui:"M PLUS 1p","Hiragino Sans","Segoe UI",system-ui,sans-serif;
  --f-num:"M PLUS 1 Code",ui-monospace,Menlo,Consolas,monospace;
  --sys-h:46px; --gut:max(16px,env(safe-area-inset-left,0px)); --gutR:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.i{width:20px;height:20px;flex:none}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* status bar */
.sys{height:var(--sys-h);flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-left:var(--gut);padding-right:var(--gutR);font-family:var(--f-num);font-size:13px;color:var(--ink)}
.sys-l{display:flex;align-items:center;gap:10px;min-width:0}
.logo{font-family:var(--f-ui);font-weight:800;letter-spacing:.22em;font-size:12px;opacity:.85;white-space:nowrap}
.sys-r{display:flex;align-items:center;gap:12px;flex:none}
#clock{white-space:nowrap}
@media(max-width:480px){.sys-l:has(.tchip) .logo{display:none}}
.sys-btn{border:0;background:none;padding:6px;margin:-6px;display:grid;place-items:center;color:var(--dim);cursor:pointer}
.sys-btn .i{width:18px;height:18px}
.tchip{display:flex;align-items:center;gap:6px;border:0;background:rgba(255,255,255,.08);border-radius:999px;padding:3px 10px 3px 8px;font-family:var(--f-num);font-size:12px;cursor:pointer;max-width:42vw}
.tchip .dotp{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--glow);animation:pulse 1.4s ease-in-out infinite}
.tchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.batt{display:flex;align-items:center;gap:2px}
.batt b{position:relative;width:24px;height:12px;border:1.5px solid rgba(255,255,255,.8);border-radius:3px;display:block;overflow:hidden}
.batt b i{position:absolute;left:1px;top:1px;bottom:1px;background:#fff;border-radius:1px;transition:width .4s}
.batt b.low i{background:var(--accent)}
.batt::after{content:"";width:2px;height:5px;background:rgba(255,255,255,.8);border-radius:0 1px 1px 0}

/* category rail */
.xmb{position:relative;height:98px;flex:none;overflow:hidden}
.xmb-track{position:absolute;top:6px;left:0;display:flex;gap:4px;transition:transform .38s cubic-bezier(.2,.8,.2,1);will-change:transform}
.cat{position:relative;width:66px;height:62px;border:0;background:none;display:grid;place-items:center;opacity:.46;cursor:pointer;transition:opacity .25s}
.cat .i{width:30px;height:30px;transition:transform .32s cubic-bezier(.2,.8,.2,1),filter .3s}
.cat.on{opacity:1}
.cat.on .i{transform:scale(1.3);filter:drop-shadow(0 0 7px rgba(255,255,255,.75))}
.cat-l{position:absolute;top:62px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13.5px;font-weight:500;letter-spacing:.02em;opacity:0;transition:opacity .25s;text-shadow:0 0 12px rgba(255,255,255,.55)}
.cat.on .cat-l{opacity:1}
.cat .badge{position:absolute;top:8px;right:13px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--glow)}
.cat:focus-visible{outline:none}
.cat:focus-visible .i{filter:drop-shadow(0 0 7px #fff)}

/* column */
.col{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-left:var(--gut);padding-right:var(--gutR);padding-block:2px 56px;-webkit-overflow-scrolling:touch}
.col-in{max-width:760px;margin:0 auto;display:grid;gap:22px;min-width:0}
.col-in.in-r{animation:colR .26s cubic-bezier(.2,.8,.2,1)}
.col-in.in-l{animation:colL .26s cubic-bezier(.2,.8,.2,1)}
@keyframes colR{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes colL{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
section{min-width:0}
.lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:0 0 8px}
.lbl-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.lbl-row .lbl{margin:0}
.empty{color:var(--dim);font-size:14px;margin:6px 0;padding:14px 0;border-top:1px dashed var(--line2);border-bottom:1px dashed var(--line2)}
.muted{color:var(--dim)}
.small{font-size:12.5px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:500}

/* rows */
.list{display:grid;gap:2px}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:9px 6px;background:none;border:0;text-align:left;border-radius:12px;cursor:pointer;min-width:0;position:relative}
.row:active,.row:focus-visible{background:linear-gradient(90deg,var(--glass3),rgba(255,255,255,0));outline:none}
.row-ic{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:13px;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.2),rgba(255,255,255,.035) 70%);box-shadow:inset 0 0 0 1px var(--line)}
.row-ic.acc{color:#fff;background:radial-gradient(circle at 30% 25%,#ff6a74,#a40f1a 80%);box-shadow:0 0 16px var(--glow)}
.row-ic.bad{color:var(--bad)} .row-ic.warn{color:var(--warn)} .row-ic.ok{color:var(--ok)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-t{font-size:16.5px;font-weight:500;line-height:1.3;text-shadow:0 0 14px rgba(255,255,255,.18);overflow-wrap:anywhere}
.row-s{font-size:12.5px;color:var(--dim);margin-top:2px;overflow-wrap:anywhere}
.row-side{display:flex;align-items:center;gap:6px;flex:none}
.row .chev{opacity:.4}
.swatch{width:10px;height:10px;border-radius:3px;background:var(--c,#fff);box-shadow:0 0 10px var(--c,#fff);flex:none;display:inline-block}
.row-ic .swatch{width:14px;height:14px;border-radius:4px}

/* plates: dialog bars with hairlines top and bottom */
.plate{position:relative;padding:16px;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.02));border-top:1px solid rgba(255,255,255,.3);border-bottom:1px solid rgba(255,255,255,.1);border-radius:6px;min-width:0}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;line-height:1.5;background:var(--glass2);box-shadow:inset 0 0 0 1px var(--line);color:var(--dim);border:0;white-space:nowrap}
button.chip{cursor:pointer}
.chip.ok{color:var(--ok);box-shadow:inset 0 0 0 1px rgba(141,240,178,.35)}
.chip.warn{color:var(--warn);box-shadow:inset 0 0 0 1px rgba(255,211,110,.35)}
.chip.bad{color:var(--bad);box-shadow:inset 0 0 0 1px rgba(255,115,120,.45);background:rgba(255,80,90,.08)}
.chip.acc,.chip.on{color:#fff;background:rgba(255,51,65,.22);box-shadow:inset 0 0 0 1px rgba(255,120,128,.6)}
.chip.big{font-size:14px;padding:8px 14px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.hs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-right:calc(-1 * var(--gutR));padding-right:var(--gutR);scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}

/* buttons and inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.04));font:500 14px var(--f-ui);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.btn.pri{background:linear-gradient(180deg,#ff5260,#c3101d);border-color:#ff8a92;box-shadow:0 0 18px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.sm{min-height:34px;padding:0 13px;font-size:13px}
.btn.ghost{background:none;border-color:var(--line)}
.btn.danger{border-color:rgba(255,115,120,.6);color:var(--bad);background:none}
.btn.wide{width:100%}
.btn .i{width:17px;height:17px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.ibtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--glass2);display:grid;place-items:center;cursor:pointer;flex:none}
.ibtn .i{width:17px;height:17px}
.ibtn.on{color:var(--gold);border-color:rgba(245,207,85,.5)}
.in{width:100%;min-height:44px;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:rgba(0,0,0,.38);color:var(--ink);font:400 16px var(--f-ui)}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:rgba(255,255,255,.55);box-shadow:0 0 0 3px rgba(255,51,65,.28)}
textarea.in{min-height:100px;resize:vertical;line-height:1.5}
select.in{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,rgba(255,255,255,.7) 50%),linear-gradient(135deg,rgba(255,255,255,.7) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
select.in option{background:#1a0508;color:#fff}
.cap{display:grid;grid-template-columns:1fr auto;gap:8px}
.cap .in-tag{grid-column:1/-1}
@media(min-width:560px){.cap{grid-template-columns:1fr 170px auto}.cap .in-tag{grid-column:auto}}
.field{display:grid;gap:6px}
.field>span{font-size:12px;color:var(--dim);letter-spacing:.04em}
.fgrid{display:grid;gap:14px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* checks */
.ck{width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.55);background:rgba(0,0,0,.25);transition:background .18s,border-color .18s,box-shadow .18s;cursor:pointer;padding:0}
.ck .i{width:18px;height:18px;opacity:0;transform:scale(.5);transition:.18s;stroke-width:2.6}
.ck.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 14px var(--glow)}
.ck.on .i{opacity:1;transform:none}
.ck.sm{width:24px;height:24px;border-radius:7px}
.ck.sm .i{width:15px;height:15px}

/* progress */
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#ff7a83,var(--accent));border-radius:9px;box-shadow:0 0 10px var(--glow)}
.bar.ok i{background:var(--ok);box-shadow:0 0 10px rgba(141,240,178,.5)}
.bar .pace{position:absolute;top:-2px;bottom:-2px;width:2px;background:rgba(255,255,255,.7)}
.ring .rv{transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px var(--glow))}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gutR)) 14px 0;padding-right:var(--gutR)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 13px;border-radius:999px;border:0;background:none;font-size:13.5px;color:var(--dim);cursor:pointer}
.tab.on{color:#fff;background:var(--glass3);box-shadow:inset 0 0 0 1px var(--line)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--dim);font-size:13px;cursor:pointer}
.seg button.on{color:#fff;border-color:rgba(255,130,138,.7);background:rgba(255,51,65,.22);box-shadow:0 0 12px rgba(255,51,65,.3)}

/* hero (today) */
.hero{display:grid;gap:6px}
.hero-d{font-size:clamp(40px,12vw,64px);font-weight:300;letter-spacing:-.01em;line-height:1}
.hero-fri{display:flex;align-items:center;gap:14px;margin-top:10px;padding:12px 14px;border:0;width:100%;text-align:left;cursor:pointer;background:linear-gradient(90deg,rgba(255,51,65,.22),rgba(255,51,65,0));border-left:2px solid var(--accent);border-radius:4px}
.hero-fri b{display:block;font-size:17px;font-weight:500}
.hero-fri small{display:block;color:var(--dim);font-size:12.5px}

/* friday */
.fri-head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.fri-title{font-size:clamp(28px,8vw,44px);font-weight:800;letter-spacing:.04em;line-height:1;text-transform:uppercase;text-shadow:0 0 24px rgba(255,51,65,.55)}
.fri-sub{color:var(--dim);font-size:13.5px;margin-top:8px}
.ringbox{position:relative;width:112px;height:112px;flex:none}
.ringbox .rt{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ringbox .rt b{font-family:var(--f-num);font-size:28px;font-weight:600;display:block}
.ringbox .rt small{font-size:10.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.weeknav{display:flex;align-items:center;gap:8px;margin-top:12px}
.fc{display:grid;gap:10px}
.fc-h{display:flex;align-items:center;gap:10px}
.fc-h .swatch{width:12px;height:12px}
.fc-n{font-size:18px;font-weight:700;flex:1;min-width:0}
.fc-c{font-family:var(--f-num);color:var(--dim);font-size:13px}
.fc.is-done{border-top-color:rgba(141,240,178,.55)}
.fc.is-done .fc-n{color:var(--ok)}
.fi{display:flex;align-items:center;gap:12px;width:100%;padding:8px 2px;border:0;background:none;text-align:left;cursor:pointer}
.fi-t{display:flex;flex-direction:column;font-size:16px;font-weight:500;min-width:0}
.fi-t small{font-size:12px;color:var(--dim);font-weight:400}
.fc-posts{display:grid;gap:2px;padding-top:8px;border-top:1px solid var(--line2)}
.pr{display:flex;align-items:center;gap:10px;min-width:0}
.pr-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:8px 2px;border:0;background:none;text-align:left;cursor:pointer}
.pr-d{font-family:var(--f-num);font-size:11px;letter-spacing:.06em;color:var(--dim);width:46px;flex:none;text-transform:uppercase;line-height:1.15}
.pr-d b{display:block;font-size:15px;color:var(--ink);font-weight:600}
.pr-t{flex:1;min-width:0;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-t.done{color:var(--dim);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.35)}
.pr-chips{display:flex;gap:4px;flex:none}
.fc-foot{display:flex;flex-wrap:wrap;gap:8px}
.hist{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.hist button{border:0;background:none;display:grid;gap:6px;justify-items:center;cursor:pointer;padding:6px 0;border-radius:8px;color:var(--dim);font-size:11px;font-family:var(--f-num)}
.hist button.on{background:var(--glass2);color:#fff}
.hcell{width:100%;max-width:44px;height:54px;border-radius:5px;border:1.5px solid rgba(255,255,255,.4);position:relative;overflow:hidden}
.hcell i{position:absolute;left:2px;right:2px;bottom:2px;border-radius:2px;background:var(--accent)}
.hcell.full i{background:var(--ok)}

/* time */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{position:relative;min-height:84px;padding:12px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02));text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);box-shadow:0 0 12px var(--c)}
.tile b{font-size:15px;font-weight:700;display:block}
.tile small{font-family:var(--f-num);font-size:12px;color:var(--dim)}
.tile.run{border-color:var(--c);box-shadow:0 0 22px color-mix(in srgb,var(--c) 40%,transparent),inset 0 0 30px color-mix(in srgb,var(--c) 14%,transparent)}
.tile.run small{color:#fff}
.bigtime{font-family:var(--f-num);font-size:clamp(40px,13vw,64px);font-weight:300;letter-spacing:.02em;line-height:1}
.tcard{display:grid;gap:10px}
.tc-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tc-row b{flex:1;min-width:0;font-size:16px}
.tc-el{font-family:var(--f-num);font-size:20px}
.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:76px 1fr 54px;align-items:center;gap:10px;font-size:13px}
.hb span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .num{text-align:right;color:var(--dim)}
.hb .bar i{background:var(--c);box-shadow:0 0 10px var(--c)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:110px}
.day{display:grid;grid-template-rows:1fr auto auto;gap:4px;height:100%;text-align:center;font-size:10.5px;color:var(--dim);font-family:var(--f-num)}
.day .col-b{align-self:end;width:100%;max-width:28px;margin:0 auto;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,#ff8a92,var(--accent));box-shadow:0 0 10px var(--glow);min-height:2px}
.day.today{color:#fff}
.day .col-b.z{background:rgba(255,255,255,.14);box-shadow:none}
.rtable{display:grid;gap:0}
.rt-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);align-items:center;font-size:14px}
.rt-row .num{text-align:right}
.rt-row small{display:block;color:var(--dim);font-size:11.5px}

/* misc blocks */
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kv>div{padding:12px;border-radius:10px;background:var(--glass2);box-shadow:inset 0 0 0 1px var(--line2)}
.kv b{display:block;font-family:var(--f-num);font-size:22px;font-weight:600;line-height:1.15}
.kv small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.dl{display:grid;gap:10px}
.deliv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.deliv .bar{grid-column:1/-1}
.ctr{display:flex;align-items:center;gap:8px}
.ctr .num{min-width:52px;text-align:center;font-size:15px}
.note{padding:12px 0;border-bottom:1px solid var(--line2);display:grid;gap:4px}
.note-h{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--faint);font-family:var(--f-num)}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.55;margin:0}
.hook{display:grid;grid-template-columns:1fr auto;gap:8px 10px;padding:12px 0;border-bottom:1px solid var(--line2);align-items:start}

.tro .i{width:30px;height:30px}
.tro b{font-size:14px} .tro small{font-size:12px;color:var(--dim)}
.tro.lock{opacity:.42}

.t-bronze{color:var(--bronze)} .t-silver{color:var(--silver)} .t-gold{color:var(--gold)} .t-plat{color:var(--plat)}
.stagebar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.stagebar i{height:5px;border-radius:3px;background:rgba(255,255,255,.14)}
.stagebar i.on{background:var(--accent);box-shadow:0 0 8px var(--glow)}
.focus{display:grid;justify-items:center;gap:14px;padding:10px 0}
.focus .ringbox{width:220px;height:220px}
.focus .ringbox .rt b{font-size:46px;font-weight:300}
.sysinfo{display:grid;gap:0;font-size:14px}
.sysinfo div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.sysinfo span:last-child{color:var(--dim);text-align:right;font-family:var(--f-num);font-size:13px}
.tog{width:50px;height:30px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.08);position:relative;flex:none;cursor:pointer;padding:0}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 12px var(--glow)}
.tog.on::after{transform:translateX(20px)}
.flag{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:rgba(255,80,90,.1);box-shadow:inset 0 0 0 1px rgba(255,115,120,.35);color:#ffd9da;font-size:13.5px}

.panel-h .back{border:0;background:none;display:flex;align-items:center;gap:2px;color:var(--dim);font-size:13px;padding:6px 8px 6px 0;cursor:pointer}

  init(){if(this.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.ctx=new C();this.master=this.ctx.createGain();this.master.gain.value=.55;this.master.connect(this.ctx.destination);
    this.delay=this.ctx.createDelay(1);this.delay.delayTime.value=.27;const fb=this.ctx.createGain();fb.gain.value=.32;const wet=this.ctx.createGain();wet.gain.value=.35;this.delay.connect(fb);fb.connect(this.delay);this.delay.connect(wet);wet.connect(this.master);}catch(e){this.ctx=null}},
  get on(){return S().sound!==false},
  tone(f,{t=0,dur=.08,type='sine',vol=.1,slide=0,attack=.004,wet=false}={}){const c=this.ctx;if(!c)return;const o=c.createOscillator(),g=c.createGain(),t0=c.currentTime+t;o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t0+dur);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+attack);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g);g.connect(this.master);if(wet)g.connect(this.delay);o.start(t0);o.stop(t0+dur+.05)},

    [174.6,220,261.6,329.6,392,523.3].forEach((fr,i)=>{[-6,6].forEach(dt=>{const o=c.createOscillator();o.type=i<2?'sawtooth':'triangle';o.frequency.value=fr;o.detune.value=dt;o.connect(f);o.start(t0);o.stop(t0+4.8)})});
    [1046.5,1318.5,1568,2093].forEach((fr,i)=>this.tone(fr,{t:1.05+i*.11,dur:1.6,vol:.035,wet:true}))},
  play(n){if(!this.on||!this.ctx)return;if(this.ctx.state==='suspended')this.ctx.resume();
    switch(n){
      case 'move':this.tone(2100,{dur:.04,vol:.045});this.tone(1400,{t:.012,dur:.05,vol:.03});break;
      case 'tick':this.tone(1600,{dur:.03,vol:.04});break;
      case 'open':this.tone(880,{dur:.08,vol:.06});this.tone(1320,{t:.045,dur:.14,vol:.055,wet:true});break;
      case 'back':this.tone(1250,{dur:.09,vol:.055,slide:.55});break;

const COLS=['codex','clients','weeks','time','biz','creative','reviews'];
const Store={mode:'boot',db:null,data:Object.create(null),dirty:new Set(),timers:{},inflight:{},again:{},loaded:new Set(),ready:false,readOnly:false,_res:null,
  get(p){return this.data[p]||null},
  ensure(p,def){if(!this.data[p])this.data[p]=def();return this.data[p]},
  touch(p){if(this.readOnly){toast('Save data is read only here','err');return}this.dirty.add(p);clearTimeout(this.timers[p]);this.timers[p]=setTimeout(()=>this.flush(p),450);updSaving();queueTrophyCheck();this.cache()},
  remove(p){this.data[p]=null;this.touch(p)},
  async flush(p){
    clearTimeout(this.timers[p]);
    if(this.mode!=='cloud'){this.dirty.delete(p);if(this.data[p]===null)delete this.data[p];this.saveLocal();updSaving();return}
    if(this.inflight[p]){this.again[p]=true;return}
    this.inflight[p]=true;updSaving();
    const body=this.data[p];
    try{
      if(body===null)await this.db.doc(p).delete();else await this.db.doc(p).set(clone(body));
      if(body===null&&this.data[p]===null)delete this.data[p];
    }catch(e){
      const c=e&&e.code;
      if(c==='invalid_argument'||c==='not_granted'||c==='revoked'){this.readOnly=c!=='invalid_argument'?true:this.readOnly;toast(c==='invalid_argument'?'That change could not be saved':'Save data is read only in this view','err')}
      else if(c==='quota_exceeded'){toast('Storage is full. Delete old entries to keep saving.','err')}
      else{await new Promise(r=>setTimeout(r,800+Math.random()*900));try{if(body===null)await this.db.doc(p).delete();else await this.db.doc(p).set(clone(this.data[p]))}catch(e2){toast('Offline. Changes will retry.','err');this.again[p]=true;setTimeout(()=>this.flush(p),5000)}}
    }finally{
      this.inflight[p]=false;
      if(this.again[p]){this.again[p]=false;setTimeout(()=>this.flush(p),60)}else this.dirty.delete(p);
      updSaving();
    }
  },
  flushAll(){Object.keys(this.timers).forEach(p=>{if(this.dirty.has(p)&&!this.inflight[p])this.flush(p)})},
  subscribe(){
    COLS.forEach(col=>{
      try{this.db.collection(col).onSnapshot(snap=>{
        let changed=false;
        for(const ch of snap.docChanges()){
          const p=col+'/'+ch.doc.id;
          if(this.dirty.has(p)||this.inflight[p])continue;
          if(ch.type==='removed'){if(p in this.data){delete this.data[p];changed=true}}
          else{this.data[p]=clone(ch.doc.data());changed=true}
        }
        if(!this.loaded.has(col)){this.loaded.add(col);if(this.loaded.size===COLS.length)this.markReady()}
        if(changed&&this.ready){this.cache();requestRender()}
      },err=>{if(!this.loaded.has(col)){this.loaded.add(col);if(this.loaded.size===COLS.length)this.markReady()}if(err&&err.code==='revoked'){this.readOnly=true}})}catch(e){this.loaded.add(col)}
    });
  },
  markReady(){if(this.ready)return;this.ready=true;if(this._res)this._res()},
  waitReady(ms){return new Promise(r=>{if(this.ready)return r();this._res=r;setTimeout(()=>{this.markReady();r()},ms)})},
  _ct:0,cache(){clearTimeout(this._ct);this._ct=setTimeout(()=>lsSet(this.mode==='cloud'?'rrgcodex.cache':'rrgcodex.local',JSON.stringify(this.data)),900)},
  saveLocal(){lsSet('rrgcodex.local',JSON.stringify(this.data))},
  loadLocal(k='rrgcodex.local'){try{const d=JSON.parse(lsGet(k)||'{}');for(const p in d)if(d[p]!=null)this.data[p]=d[p]}catch(e){}}
};
function updSaving(){const busy=Store.mode==='cloud'&&(Store.dirty.size>0);$('#saving').hidden=!busy}
const S=()=>{const s=Store.ensure('codex/settings',()=>clone(DEFAULT_SETTINGS));for(const k in DEFAULT_SETTINGS)if(s[k]===undefined)s[k]=clone(DEFAULT_SETTINGS[k]);return s};

const Waves=(()=>{const cv=$('#bg'),cx=cv.getContext('2d');let w=0,h=0,raf=0,t0=performance.now(),fl=0,skip=false;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){const d=Math.min(2,devicePixelRatio||1);w=innerWidth;h=innerHeight;cv.width=Math.round(w*d);cv.height=Math.round(h*d);cx.setTransform(d,0,0,d,0,0);draw(performance.now())}
  function lightK(){const hr=new Date().getHours();return hr>=7&&hr<17?1:hr>=17&&hr<20?.82:hr>=5&&hr<7?.78:.62}
  function ribbon(t,o){cx.lineWidth=1;for(let i=0;i<o.n;i++){const u=i/(o.n-1),fall=1-Math.abs(u-.5)*2;cx.strokeStyle=`rgba(255,238,238,${(o.a*(.18+fall)).toFixed(3)})`;cx.beginPath();for(let x=-12;x<=w+12;x+=12){const X=x/Math.max(w,1);const y=h*(o.y+Math.sin(X*Math.PI*o.f1+t*o.sp+u*.85)*o.amp+Math.sin(X*Math.PI*o.f2-t*o.sp*.6+u*.4)*o.amp*.38+(u-.5)*o.spread*(1+.6*Math.sin(X*Math.PI*1.4+t*o.sp*.5)));if(x===-12)cx.moveTo(x,y);else cx.lineTo(x,y)}cx.stroke()}}
  function draw(now){const t=(now-t0)/1000,k=lightK();
    const g=cx.createLinearGradient(0,0,w*.6,h);g.addColorStop(0,`rgb(${Math.round(78*k)},${Math.round(9*k)},${Math.round(16*k)})`);g.addColorStop(.55,`rgb(${Math.round(34*k)},${Math.round(4*k)},${Math.round(8*k)})`);g.addColorStop(1,'rgb(9,1,3)');cx.fillStyle=g;cx.fillRect(0,0,w,h);
    const r=cx.createRadialGradient(w*.18,h*.1,0,w*.18,h*.1,Math.max(w,h)*.75);r.addColorStop(0,`rgba(255,70,80,${(.2*k).toFixed(3)})`);r.addColorStop(1,'rgba(255,70,80,0)');cx.fillStyle=r;cx.fillRect(0,0,w,h);
    ribbon(t,{y:.68,amp:.085,f1:1.1,f2:2.6,sp:.17,n:24,spread:.085,a:.11});
    ribbon(t+37,{y:.62,amp:.06,f1:.75,f2:2.1,sp:-.12,n:16,spread:.05,a:.075});
    if(fl>0){cx.fillStyle=`rgba(255,255,255,${(fl*.16).toFixed(3)})`;cx.fillRect(0,0,w,h);fl*=.9;if(fl<.01)fl=0}}
  function loop(now){raf=0;skip=!skip;if(!skip||fl>0)draw(now);if(!reduce&&!document.hidden)raf=requestAnimationFrame(loop)}
  addEventListener('resize',size);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!raf&&!reduce)raf=requestAnimationFrame(loop)});
  size();if(!reduce)raf=requestAnimationFrame(loop);
  return{flash(){fl=1;if(reduce)draw(performance.now())}}
})();

const scopeNext=()=>S().fridayScope!=='this';
const weekForFriday=f=>ymd(scopeNext()?addDays(mondayOf(f),7):mondayOf(f));

function flagsFor(p){const text=norm([p.title,p.caption,p.tags].join(' '));const out=[];

    <section><div class="lbl-row"><div class="lbl">Friday checklist items</div>${tog(c.onFriday!==false,'friShow',`data-id="${c.id}"`)}</div><div class="list">${friItems(c).map(it=>rowHtml({act:'friItemEdit',data:`data-id="${c.id}" data-it="${esc(it.id)}"`,icon:it.kind==='posts'?'friday':'check',t:it.label,s:it.kind==='posts'?'Ticks itself when every imported post is scheduled':'Manual tick'})).join('')}${rowHtml({act:'friItemAdd',data:`data-id="${c.id}"`,icon:'plus',t:'Add checklist item'})}</div></section>
    <section class="btns"><button class="btn ghost" data-act="clientEdit" data-id="${c.id}">Edit client</button></section>`}

const listBlock=(arr,fn,empty,actions)=>`<section>${(arr||[]).length?`<div class="list">${arr.map(fn).join('')}</div>`:`<p class="empty">${empty}</p>`}</section><section class="btns">${actions}</section>`;

RENDER.time=()=>{const r=timerRun();const now=new Date(),t0=sod(now),mon=mondayOf(now);const today=msByCat(t0,addDays(t0,1));
  let h=r?(()=>{const c=catInfo(r.cid);return `<section class="plate tcard" style="--c:${c.color}"><div class="lbl">Now logging</div><div class="bigtime" data-tick="${r.start}">${fmtHMS(Date.now()-r.start)}</div><div class="tc-row"><span class="swatch"></span><b>${esc(c.name)}</b><button class="btn pri" data-act="timerStop">${ico('stop')}Stop</button></div></section>`})():`<section><div class="lbl">Tap a client to start the clock</div></section>`;
  h+=`<section class="tiles">${timeCats().map(c=>{const run=r&&r.cid===c.id;return `<button class="tile ${run?'run':''}" style="--c:${c.color}" data-act="${run?'timerStop':'timerStart'}" data-id="${esc(c.id)}"><b>${esc(c.short)}</b><small ${run?`data-tick="${r.start}"`:''}>${run?fmtHMS(Date.now()-r.start):(today[c.id]?fmtDur(today[c.id])+' today':'Start')}</small></button>`}).join('')}</section>`;
  const wk=msByCat(mon,addDays(mon,7));const days=[];for(let i=0;i<7;i++){const d=addDays(mon,i);const m=msByCat(d,addDays(d,1));days.push({d,ms:Object.values(m).reduce((a,b)=>a+b,0)})}const dmax=Math.max(36e5,...days.map(x=>x.ms));const wtot=days.reduce((a,x)=>a+x.ms,0);
  h+=`<section><div class="lbl">This week · ${fmtH(wtot)}h</div><div class="days">${days.map(x=>`<div class="day ${ymd(x.d)===ymd(now)?'today':''}"><span class="col-b ${x.ms?'':'z'}" style="height:${x.ms?(x.ms/dmax*100).toFixed(1)+'%':'3px'}"></span><span>${x.ms?fmtH(x.ms):''}</span><span>${DOW[x.d.getDay()].slice(0,2)}</span></div>`).join('')}</div></section>`;
  const ids=Object.keys(wk).filter(k=>wk[k]>0).sort((a,b)=>wk[b]-wk[a]);const max=Math.max(1,...ids.map(k=>wk[k]));
  if(ids.length)h+=`<section><div class="hbars">${ids.map(k=>{const c=catInfo(k);return `<div class="hb" style="--c:${c.color}"><span>${esc(c.short)}</span><div class="bar"><i style="width:${(wk[k]/max*100).toFixed(1)}%"></i></div><span class="num">${fmtH(wk[k])}h</span></div>`}).join('')}</div></section>`;
  const ym=view.timeMonth||ymOf(now);const [a,z]=monthRange(ym);const mm=msByCat(a,z);
  const rows=clients().map(c=>{const ret=retainerFor(c,ym);const ms=mm[c.id]||0;const rateA=ret&&ms>0?toAED(ret.amount,ret.cur)/hrs(ms):null;return{c,ret,ms,rateA}});
  const rated=rows.filter(x=>x.rateA&&x.ms>=2*36e5);const low=rated.length>1?rated.reduce((m,x)=>x.rateA<m.rateA?x:m):null;
  h+=`<section><div class="lbl-row"><div class="lbl">Rate check · ${fmtYm(ym)}</div><div class="weeknav" style="margin:0"><button class="ibtn" data-act="tMonth" data-d="-1" aria-label="Previous month">${ico('back')}</button><button class="ibtn" data-act="tMonth" data-d="1" aria-label="Next month">${ico('next')}</button></div></div>
  <div class="rtable">${rows.map(x=>`<div class="rt-row"><span><span class="swatch" style="--c:${safeColor(x.c.color)};margin-right:8px"></span>${esc(x.c.short||x.c.name)}<small>${x.ret?money(x.ret.amount,x.ret.cur)+'/mo':'No retainer'}</small></span><span class="num">${fmtH(x.ms)}h</span><span class="num" style="min-width:92px">${x.rateA?`AED ${Math.round(x.rateA)}/h`:'n/a'}${low&&low===x?'<small style="color:var(--bad)">Lowest rate</small>':''}</span></div>`).join('')}</div>
  <p class="muted small">Retainer divided by hours logged. Non AED retainers use the rates in System.</p></section>`;
  const ents=allEntries().filter(e=>e.end>=+addDays(t0,-6)).sort((x,y)=>y.start-x.start).slice(0,40);
  h+=`<section><div class="lbl-row"><div class="lbl">Last 7 days</div><button class="btn sm ghost" data-act="entryAdd">${ico('plus')}Add time</button></div>${ents.length?`<div class="list">${ents.map(e=>{const c=catInfo(e.cid);const d=new Date(e.start);return rowHtml({act:'entryEdit',data:`data-doc="${e._doc}" data-id="${e.id}"`,iconHtml:`<span class="swatch" style="--c:${c.color}"></span>`,t:`${c.short} · ${fmtDur(e.end-e.start)}`,s:`${fmtD(d)} · ${pad(d.getHours())}:${pad(d.getMinutes())} to ${pad(new Date(e.end).getHours())}:${pad(new Date(e.end).getMinutes())}${e.note?' · '+e.note:''}`})}).join('')}</div>`:'<p class="empty">No entries yet.</p>'}</section>`;
  return h};

    <div class="btns">${run?`<button class="btn" data-act="focusStop">${ico('stop')}Stop</button>${run.mode==='break'?`<button class="btn pri" data-act="focusStart">${ico('play')}Skip break</button>`:''}`:`<button class="btn pri" data-act="focusStart">${ico('play')}Start ${f.work} min</button>`}</div></section>

    <p class="muted small">${(f.log[ymd(new Date())]||0)} sessions today · ${Object.values(f.log).reduce((a,b)=>a+b,0)} all time</p>`}}
  if(id==='review'){const wid=view.reviewWeek||ymd(mondayOf(new Date()));const R=Store.get('reviews/'+wid)||{};const mon=parseYmd(wid);const m=msByCat(mon,addDays(mon,7));const tot=Object.values(m).reduce((a,b)=>a+b,0);
    const ideas=vaultDoc().ideas.filter(i=>i.date>=wid&&i.date<=ymd(addDays(mon,6))).length;const hk=hooksDoc().list.filter(i=>(i.date||'')>=wid&&(i.date||'')<=ymd(addDays(mon,6))).length;const fs=friStats(scopeNext()?ymd(addDays(mon,7)):wid);

    ${[['wins','Wins'],['slipped','What slipped'],['next','Top 3 for next week'],['notes','Anything else']].map(([k,l])=>`<section><div class="lbl">${l}</div><textarea class="in" rows="4" data-in="revField" data-w="${wid}" data-k="${k}">${esc(R[k]||'')}</textarea></section>`).join('')}<p class="muted small">Saves as you type.</p>`}}
  if(id==='shoot'){const s=D.shoot;const d=s.items.filter(i=>s.checked[i.id]).length;
    return {title:'Shoot day',body:`<section><div class="lbl-row"><div class="lbl">${d} of ${s.items.length}</div><button class="btn sm ghost" data-act="shootReset">Reset</button></div>${s.items.map(i=>`<div class="pr"><button class="ck ${s.checked[i.id]?'on':''}" data-act="shootTick" data-x="${i.id}" aria-label="Done">${ico('check')}</button><button class="pr-main" data-act="shootOpts" data-x="${i.id}"><span class="pr-t ${s.checked[i.id]?'done':''}" style="white-space:normal;font-size:15.5px">${esc(i.label)}</span></button></div>`).join('')}</section>
    <section><div class="cap" style="grid-template-columns:1fr auto"><input class="in" id="shootIn" placeholder="Add to the checklist" data-enter="shootAdd"><button class="btn" data-act="shootAdd">Add</button></div></section>`}}
  if(id==='gear'){const cats=[...new Set(D.gear.map(g=>g.cat||'Other'))];
    return {title:'Gear list',body:`${cats.map(cg=>`<section><div class="lbl">${esc(cg)}</div>${D.gear.filter(g=>(g.cat||'Other')===cg).map(g=>`<div class="pr"><button class="ck sm ${g.packed?'on':''}" data-act="gearTick" data-x="${g.id}" aria-label="Packed">${ico('check')}</button><button class="pr-main" data-act="gearEdit" data-x="${g.id}"><span class="pr-t" style="white-space:normal">${esc(g.name)}</span>${g.note?`<span class="chip">${esc(g.note)}</span>`:''}</button></div>`).join('')}</section>`).join('')||'<p class="empty">No gear yet.</p>'}
    <section class="btns"><button class="btn pri" data-act="gearAdd">${ico('plus')}Add gear</button><button class="btn ghost" data-act="gearReset">Unpack all</button></section>`}}
  if(id==='rates')return {title:'Rate card',body:`<section>${D.rates.map(r=>`<div class="hook"><div class="hook-t" data-act="rateEdit" data-x="${r.id}">${esc(r.service)}<div class="row-s">${esc(r.note||'')}</div></div><div class="hook-a"><span class="chip acc" style="font-size:13px">${esc(r.price)}</span></div></div>`).join('')||'<p class="empty">No rates yet.</p>'}</section>
    <section class="btns"><button class="btn pri" data-act="rateAdd">${ico('plus')}Add line</button><button class="btn" data-act="rateCopy">${ico('copy')}Copy all</button></section>`};
  if(id==='feedback'){const all=[];clients().forEach(c=>(c.feedback||[]).forEach(f=>all.push({c,f})));all.sort((a,b)=>b.f.date<a.f.date?-1:1);
    return {title:'Feedback log',body:`<section class="btns"><button class="btn pri" data-act="fbAdd">${ico('plus')}Log feedback</button></section><section>${all.map(({c,f})=>`<div class="note"><div class="note-h"><span><span class="swatch" style="--c:${safeColor(c.color)};margin-right:6px"></span>${esc(c.short)} · ${fmtD(parseYmd(f.date))}</span></div><p>${esc(f.text)}</p></div>`).join('')||'<p class="empty">Nothing logged yet.</p>'}</section>`}}
  return null};

PANELS.trophies=()=>{const s=S().trophies||{};return {title:'Trophies',body:`<section class="trophies">${TROPHIES.map(t=>{const g=s[t.id];return `<div class="tro ${g?'':'lock'}">${ico('trophy','t-'+t.tier)}<b>${esc(t.n)}</b><small>${esc(t.d)}</small><small>${g?'Earned '+fmtDM(new Date(g)):t.tier[0].toUpperCase()+t.tier.slice(1)}</small></div>`}).join('')}</section>`}};

/* timer */
A.timerStart=el=>{timerStart(el.dataset.id);render()};
A.timerStop=()=>{timerStop();render()};
A.entryAdd=()=>entryForm();
A.entryEdit=el=>{const d=Store.get(el.dataset.doc);const e=d&&findIn(d.entries,el.dataset.id);if(e)entryForm(e,el.dataset.doc)};
function entryForm(e,docPath){const s=e?new Date(e.start):new Date(Date.now()-36e5),f=e?new Date(e.end):new Date();const hm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
  openForm({title:e?'Edit time':'Add time',fields:[{key:'cid',label:'Client',type:'select',value:e?e.cid:(clients()[0]||{}).id,options:timeCats().map(c=>({v:c.id,l:c.name}))},{key:'date',label:'Date',type:'date',value:ymd(s)},{key:'from',label:'From',type:'time',value:hm(s),half:true},{key:'to',label:'To',type:'time',value:hm(f),half:true},{key:'note',label:'Note',value:e?e.note:'',ph:'Optional'}],
    onSave:v=>{const [y,m,d]=v.date.split('-').map(Number);const [h1,m1]=v.from.split(':').map(Number),[h2,m2]=v.to.split(':').map(Number);let a=new Date(y,m-1,d,h1,m1),b=new Date(y,m-1,d,h2,m2);if(b<=a)b=addDays(b,1);if(isNaN(a)||isNaN(b)){toast('Check the times','err');return false}
      if(e){const dd=Store.get(docPath);removeIn(dd.entries,e.id);Store.touch(docPath)}addEntry(v.cid,+a,+b,v.note)},
    onDelete:e?()=>{const dd=Store.get(docPath);removeIn(dd.entries,e.id);Store.touch(docPath)}:null})}
A.tMonth=el=>{view.timeMonth=shiftYm(view.timeMonth||ymOf(new Date()),+el.dataset.d);Snd.play('tick');render()};

/* friday */
A.weekNav=el=>{const d=+el.dataset.d;view.weekId=d===0?defaultWeek():ymd(addDays(parseYmd(view.weekId||defaultWeek()),d*7));Snd.play('move');render()};
A.weekSet=el=>{view.weekId=el.dataset.w;Snd.play('tick');render()};
function afterFriChange(wid,before){const st=friStats(wid);if(st.t&&st.d===st.t&&before<st.t){Snd.play('done');Waves.flash();toast('Friday checklist complete','ok','Go enjoy the weekend');award('sweep');const fri=fridayForWeek(wid);if(sod(new Date())<sod(fri))award('early')}}
A.friToggle=el=>{const wid=el.dataset.w,c=client(el.dataset.c);if(!c)return;const it=friItems(c).find(i=>i.id===el.dataset.it);if(!it)return;const before=friStats(wid).d;const w=weekDoc(wid,true);
  const ps=postsFor(w,c.id);let on;
  if(it.kind==='posts'&&ps.length){const all=ps.every(p=>p.scheduled);ps.forEach(p=>p.scheduled=!all);on=!all}

const DATE_RE=/^(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?(\s*[-–—:|•·]\s*|\s+|$)(.*)$/;
function headingClient(t,isHead){const n=norm(t);if(!n||n.length>60)return null;const hits=allClients().filter(c=>aliasesOf(c).some(a=>{if(n===a)return true;if(!n.startsWith(a))return false;const rest=n.slice(a.length);return isHead?/^([^a-z0-9]|$)/.test(rest):/^\s*([-–—|:(•·/]|$)/.test(rest)}));
  if(hits.length===1)return hits[0];if(hits.length>1)return 'multi';return isHead?'unknown':null}
function monthHintOf(t){const n=norm(t);for(let i=0;i<12;i++)if(new RegExp('\\b('+MONL[i].toLowerCase()+'|'+MON[i].toLowerCase()+')\\b').test(n))return i;return null}
function resolveDate(a,b,y,hint){const now=new Date();const c=[];for(const [m,d] of [[a,b],[b,a]]){if(m<1||m>12||d<1||d>31)continue;const ys=y?[y<100?2000+y:y]:[now.getFullYear()-1,now.getFullYear(),now.getFullYear()+1];for(const yy of ys){const dt=new Date(yy,m-1,d);if(dt.getMonth()===m-1)c.push(dt)}}
  if(!c.length)return null;c.sort((p,q)=>score(p)-score(q));return ymd(c[0]);function score(dt){let s=Math.abs(dt-now)/864e5;if(hint!=null&&dt.getMonth()===hint)s-=400;return s}}
function parseLines(lines){const posts=[],skipped={};let cid=null,section='',cur=null,hint=null,docTitle='';
  const flush=()=>{if(cur){cur.caption=cur.cap.join('\n').replace(/\n{3,}/g,'\n\n').trim();delete cur.cap;if(cur.cid)posts.push(cur);else skipped[cur.section||'No heading']=(skipped[cur.section||'No heading']||0)+1;cur=null}};
  const start=(title,raw)=>{flush();cur={cid,section,raw,title:title||'Untitled',cap:[],tags:'',mediaUrl:'',mediaLabel:'',mediaStatus:'none'}};
  for(const ln of lines){const t=String(ln.text||'').replace(/ /g,' ').trim();
    if(!t){if(cur)cur.cap.push('');continue}
    const isHead=/^(HEADING|TITLE|SUBTITLE)/.test(ln.style||'');
    if(hint==null){const mh=monthHintOf(t);if(mh!=null&&!cur&&/week|month|^[a-z]+\s*\d*$/i.test(t))hint=mh}
    const dm=t.match(DATE_RE);
    if(dm&&(dm[4].trim()||ln.bold||!dm[5])&&(dm[5]||ln.bold)){const a=+dm[1],b=+dm[2];if(a<=31&&b<=31&&(a<=12||b<=12)){start(dm[5].trim(),[a,b,dm[3]?+dm[3]:null]);continue}}
    const hc=headingClient(t,isHead);
    if(hc==='multi'){if(!docTitle)docTitle=t;continue}
    if(hc&&hc!=='unknown'){flush();cid=hc.id;section=t;continue}
    if(hc==='unknown'){flush();if(monthHintOf(t)!=null&&/week/i.test(t)){if(hint==null)hint=monthHintOf(t);continue}cid=null;section=t;continue}
    if(!cur){if(ln.bold&&cid&&!/week/i.test(t))start(t,null);continue}
    if(/^media\b/i.test(t)){const rest=t.replace(/^media\s*[-–—:]*\s*/i,'');cur.mediaLabel=rest;const u=ln.href||((rest.match(/https?:\/\/\S+/)||[])[0])||'';cur.mediaUrl=u;cur.mediaStatus=/waiting|tbc|tbd|pending|to come|need|soon/i.test(rest)?'waiting':(u||rest)?'ready':'none';continue}
    if(/^(#[^\s#]+\s*)+$/u.test(t)){cur.tags=(cur.tags?cur.tags+' ':'')+t;continue}
    if(ln.bold&&(cur.cap.some(Boolean)||cur.mediaLabel)){start(t,null);continue}
    cur.cap.push(t)}
  flush();
  posts.forEach(p=>{p.date=p.raw?resolveDate(p.raw[0],p.raw[1],p.raw[2],hint):null;delete p.raw;delete p.section});
  return{posts,skipped,docTitle}}
function textToLines(text){return String(text).replace(/\r/g,'').split(/\n|\u000b/).map(s=>({text:s}))}
function htmlToLines(html){try{const d=new DOMParser().parseFromString(html,'text/html');const blocks=[...d.body.querySelectorAll('p,h1,h2,h3,h4,h5,h6,li')].filter(b=>!b.querySelector('p,li'));if(!blocks.length)return null;
  return blocks.map(b=>{const spans=[...b.querySelectorAll('span')].filter(s=>s.textContent.trim()&&!s.querySelector('span'));const bold=spans.length>0&&spans.every(s=>/font-weight:\s*(700|800|bold)/.test(s.getAttribute('style')||''));const a=b.querySelector('a[href]');return{text:b.textContent,style:/^H\d$/.test(b.tagName)?'HEADING_'+b.tagName[1]:'',bold,href:a?a.getAttribute('href'):''}})}catch(e){return null}}
function docBodyToLines(content,out=[]){for(const el of content||[]){if(el.paragraph){const p=el.paragraph;let text='',href='',any=false,boldAll=true;for(const e of p.elements||[]){if(e.textRun){const s=e.textRun.content||'';text+=s;if(s.trim()){any=true;if(!(e.textRun.textStyle&&e.textRun.textStyle.bold))boldAll=false}const u=e.textRun.textStyle&&e.textRun.textStyle.link&&e.textRun.textStyle.link.url;if(u&&!href)href=u}else if(e.richLink){const rp=e.richLink.richLinkProperties||{};text+=rp.title||'';if(!href)href=rp.uri||'';any=true}else if(e.person){text+=(e.person.personProperties||{}).name||''}}
    const parts=text.replace(/\n$/,'').split('\u000b');parts.forEach((s,i)=>out.push({text:s,style:i===0?(p.paragraphStyle||{}).namedStyleType||'':'',bold:any&&boldAll,href}))}
    else if(el.table){for(const r of el.table.tableRows||[])for(const c of r.tableCells||[])docBodyToLines(c.content,out)}}return out}
function flattenTabs(tabs,out=[]){for(const t of tabs||[]){out.push(t);if(t.childTabs)flattenTabs(t.childTabs,out)}return out}

async function pullDoc(){const raw=val('docUrl');const m=raw.match(/\/document\/d\/([A-Za-z0-9_-]+)/);const id=m?m[1]:(/^[A-Za-z0-9_-]{25,}$/.test(raw)?raw:null);const st=$('#impStatus');
  if(!id){st.innerHTML='<div class="flag">'+ico('warn')+'<div>That does not look like a Google Doc link.</div></div>';Snd.play('err');return}
  const tabParam=(raw.match(/[?&#]tab=([A-Za-z0-9._-]+)/)||[])[1];
  if(S().docUrl!==raw){S().docUrl=raw;saveS()}
  st.innerHTML='<div class="boot-load" style="margin:6px 0"><i></i></div><p class="muted small">Reading the doc</p>';
  let mcp=null;try{mcp=window.claude&&window.claude.use?await window.claude.use('mcp'):null}catch(e){}
  if(!mcp){st.innerHTML=`<div class="flag">${ico('warn')}<div>Google Docs is not reachable in this view. Use Paste instead.</div></div>`;return}
  const call=()=>mcp.callTool('Google Docs','read_doc',{documentId:id},{cache:false});
  let res;try{res=await call()}catch(e){if(e&&e.retryable){await new Promise(r=>setTimeout(r,Math.min(e.retryAfterMs||1500,6000)));try{res=await call()}catch(e2){e=e2}}if(!res){const msg={server_not_connected:'Google Docs is not connected. Add it in claude.ai Settings, Connectors, or paste the doc instead.',needs_reauth:'Reconnect Google Docs in claude.ai Settings, Connectors.',not_in_manifest:'Google Docs is turned off for this app. Turn it on in the app\'s permissions, or paste instead.',approval_required:'This needs your OK. Tap Pull again and choose Allow.',tool_error:'Google could not open that doc. Check the link and that this Google account can see it.',selection_required:'Pick which Google Docs connection to use when claude.ai asks, then pull again.',blocked_by_policy:'Your organisation blocks this. Paste the doc instead.'}[e&&e.code]||'Could not read the doc right now. Try again or paste it.';st.innerHTML=`<div class="flag">${ico('warn')}<div>${esc(msg)}</div></div>`;Snd.play('err');return}}
  let p=res.payload;if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){}}const doc=(p&&p.content&&(p.content.tabs||p.content.body))?p.content:p;
  const tabs=flattenTabs(doc&&doc.tabs).filter(t=>t.documentTab);
  let tabsInfo=null,lines;
  if(tabs.length){tabsInfo=tabs.map(t=>({id:(t.tabProperties||{}).tabId,title:(t.tabProperties||{}).title||'Tab',content:t.documentTab.body&&t.documentTab.body.content}));let pick=tabsInfo.find(t=>t.id===tabParam)||tabsInfo[tabsInfo.length-1];tabsInfo.sel=pick.id;lines=docBodyToLines(pick.content)}
  else if(doc&&doc.body)lines=docBodyToLines(doc.body.content);
  else{st.innerHTML=`<div class="flag">${ico('warn')}<div>The doc came back in a shape this app does not know. Paste it instead.</div></div>`;return}
  IMP={tabsInfo,title:doc.title||''};showPreview(parseLines(lines),tabsInfo)}
A.pullDoc=()=>pullDoc();
A.impTab=el=>{if(!IMP||!IMP.tabsInfo)return;const t=IMP.tabsInfo.find(x=>x.id===el.value);if(!t)return;IMP.tabsInfo.sel=t.id;showPreview(parseLines(docBodyToLines(t.content)),IMP.tabsInfo)};
function showPreview(res,tabsInfo){const ps=res.posts;const by={};ps.forEach(p=>{by[p.cid]=(by[p.cid]||0)+1});const fl=ps.filter(p=>flagsFor(p).length);const sk=Object.entries(res.skipped);
  const weeks=[...new Set(ps.map(p=>p.date?ymd(mondayOf(parseYmd(p.date))):(view.weekId||defaultWeek())))];
  IMP=Object.assign(IMP||{},{res});
  openSheet(`<div class="sh-h"><div class="sh-t">${ps.length?`Found ${plural(ps.length,'post')}`:'No posts found'}</div><button class="sh-x" data-act="closeSheet">Cancel</button></div>
  ${tabsInfo&&tabsInfo.length>1?`<label class="field" style="margin-bottom:12px"><span>Tab</span><select class="in" data-ch="impTab">${tabsInfo.map(t=>`<option value="${esc(t.id)}" ${t.id===tabsInfo.sel?'selected':''}>${esc(t.title)}</option>`).join('')}</select></label>`:''}
  <div class="chips" style="margin-bottom:12px">${Object.keys(by).map(cid=>{const c=client(cid);return `<span class="chip"><span class="swatch" style="--c:${safeColor(c&&c.color)}"></span>${esc(c?c.short:cid)} ${by[cid]}</span>`}).join('')}${weeks.map(w=>`<span class="chip acc">Week of ${fmtDM(parseYmd(w))}</span>`).join('')}</div>
  ${fl.length?`<div class="flag" style="margin-bottom:10px">${ico('warn')}<div>${fl.map(p=>{const f=flagsFor(p)[0];return `"${esc(p.title)}" uses "${esc(f.phrase)}" (${esc((client(f.cid)||{}).short||'')} rule)`}).join('<br>')}</div></div>`:''}
  ${sk.length?`<p class="muted small">Skipped: ${sk.map(([s,n])=>`${plural(n,'post')} under "${esc(s)}"`).join(', ')}. Add that heading to a client under Clients, Rules, Doc import names.</p>`:''}
  <div class="plate" style="max-height:38vh;overflow:auto;margin-bottom:14px">${ps.map(p=>{const c=client(p.cid);const d=p.date?parseYmd(p.date):null;return `<div class="pr"><span class="swatch" style="--c:${safeColor(c&&c.color)}"></span><span class="pr-d">${d?`${DOW[d.getDay()]}<b>${d.getDate()}</b>`:'<b>?</b>'}</span><span class="pr-t">${esc(p.title)}</span><span class="pr-chips">${mediaChip(p)}</span></div>`}).join('')||'<p class="muted small">Check the doc has client headings and lines like "10/5 - Title".</p>'}</div>
  <div class="sh-actions"><span class="sp"></span>${ps.length?`<button class="btn pri" data-act="impCommit">Import ${plural(ps.length,'post')}</button>`:''}</div>`)}
A.impCommit=()=>{if(!IMP||!IMP.res)return;const ps=IMP.res.posts;const groups={};const fb=view.weekId||defaultWeek();ps.forEach(p=>{const w=p.date?ymd(mondayOf(parseYmd(p.date))):fb;(groups[w]=groups[w]||[]).push(p)});
  const key=p=>`${p.cid}|${p.date||''}|${norm(p.title)}`;let target=null,max=0;
  for(const wid in groups){const w=weekDoc(wid,true);const g=groups[wid];const inImp=new Set(g.map(p=>p.cid));const old=w.posts;const keep=old.filter(p=>!inImp.has(p.cid)||p.manual);
    const fresh=g.map(np=>{const prev=old.find(o=>key(o)===key(np));return{id:prev?prev.id:uid(),cid:np.cid,date:np.date,title:np.title,caption:np.caption,tags:np.tags,mediaUrl:np.mediaUrl,mediaLabel:np.mediaLabel,mediaStatus:np.mediaStatus,scheduled:prev?!!prev.scheduled:false}});
    w.posts=[...keep,...fresh];w.importedAt=Date.now();Store.touch('weeks/'+wid);if(g.length>max){max=g.length;target=wid}}
  IMP=null;closeSheet(true);Snd.play('done');award('import');view.weekId=target;const ci=CATS.findIndex(c=>c.id==='friday');if(view.cat!==ci){view.dir=1;view.cat=ci}view.panel=null;$('#panel').hidden=true;render();toast(`Imported ${plural(ps.length,'post')}`,'ok',`Week of ${fmtDM(parseYmd(target))}`)};

/* ================= events ================= */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;if(el.tagName==='A')return;const fn=A[el.dataset.act];if(fn){e.preventDefault();Snd.init();try{fn(el,e)}catch(err){console.error(err);toast('Something went wrong','err',err.message)}}});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el&&IN[el.dataset.in])IN[el.dataset.in](el,e)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el){if(CH[el.dataset.ch])CH[el.dataset.ch](el,e);else if(A[el.dataset.ch])A[el.dataset.ch](el,e)}});
document.addEventListener('keydown',e=>{const el=e.target.closest&&e.target.closest('[data-enter]');if(el&&e.key==='Enter'&&!e.shiftKey&&el.tagName==='INPUT'){e.preventDefault();const fn=A[el.dataset.enter];if(fn)fn(el)}
  if(e.key==='Escape'){if(!$('#sheet').hidden||!$('#opts').hidden)closeSheet();else if(view.panel)A.closePanel()}
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement&&document.activeElement.tagName))return;
  if(!$('#sheet').hidden||!$('#opts').hidden||view.panel||!Store.ready||!$('#boot').classList.contains('go'))return;
  if(e.key==='ArrowRight')goCat(view.cat+1);if(e.key==='ArrowLeft')goCat(view.cat-1)});
$('#scrim').addEventListener('click',()=>closeSheet());
(()=>{let sx=0,sy=0,st=0,tgt=null;const on=(el,fn)=>{el.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now();tgt=e.target},{passive:true});el.addEventListener('touchend',e=>{const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;if(Date.now()-st>600||Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.6)return;if(tgt&&tgt.closest&&tgt.closest('.hs,.tabs,textarea,input,select,.hist'))return;fn(dx)},{passive:true})};
  on($('#col'),dx=>goCat(view.cat+(dx<0?1:-1)));on($('#xmb'),dx=>goCat(view.cat+(dx<0?1:-1)));on($('#panel'),dx=>{if(dx>0&&view.panel)A.closePanel()})})();
document.addEventListener('visibilitychange',()=>{if(document.hidden)Store.flushAll();else{renderStatus();requestRender()}});
addEventListener('pagehide',()=>Store.flushAll());
addEventListener('resize',()=>{if(Store.ready)renderRail()});

/* ticker */
let lastMin=-1;
setInterval(()=>{const now=Date.now();document.querySelectorAll('[data-tick]').forEach(el=>{el.textContent=fmtHMS(now-(+el.dataset.tick))});
  if(!Store.ready)return;const f=toolsDoc().focus;if(f.run){focusTick();const fe=document.querySelector('[data-focus]');if(fe&&f.run)fe.textContent=fmtMS(f.run.endAt-now)}
  const m=new Date().getMinutes();if(m!==lastMin){lastMin=m;renderStatus()}},1000);

/* ================= boot ================= */
(async function boot(){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  const bootEl=$('#boot');const showBoot=lsGet('rrgcodex.boot')!=='0';$('#bootTap').hidden=true;$('#bootLoad').hidden=false;
  const saved=lsGet('rrgcodex.cat');const dow=new Date().getDay();
  view.cat=Math.max(0,CATS.findIndex(c=>c.id===((dow===4||dow===5)?'friday':(saved||'today'))));
  let db=null;try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(db){Store.db=db;Store.mode='cloud';Store.subscribe();await Store.waitReady(9000);if(Object.keys(Store.data).length===0)Store.loadLocal('rrgcodex.cache')}
  else{Store.mode='local';Store.loadLocal();Store.markReady()}
  const s=S();if(!s.docUrl)s.docUrl='';lsSet('rrgcodex.boot',s.boot===false?'0':'1');
  const enter=()=>{bootEl.classList.add('go');render();setTimeout(()=>{award('boot');checkTrophies()},900);setTimeout(()=>bootEl.remove(),900)};
  if(!showBoot||s.boot===false){enter();return}
  $('#bootLoad').hidden=true;$('#bootTap').hidden=false;
  bootEl.addEventListener('click',()=>{Snd.init();Snd.play('boot');bootEl.classList.add('lit');Waves.flash();setTimeout(enter,1300)},{once:true});
})();
</script>
