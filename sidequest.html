function timeHint(t){t=String(t);let m=t.match(/\b(at|@|by|from|around)?\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i)||t.match(/\b(at|@|by|around)\s+(\d{1,2})(?::(\d{2}))?\b(?!\s*(?:min|mins|minutes|h|hr|hrs|hours|days?|weeks?))/i)||t.match(/\b()(\d{1,2}):(\d{2})\b/);
  if(m){let h=+m[2],mi=+(m[3]||0);const ap=(m[4]||'').toLowerCase();if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;if(!ap&&h>=1&&h<=7)h+=12;if(h<24&&mi<60)return{at:h*60+mi,by:/^by$/i.test(m[1]||''),match:m[0]}}
  if(/\b(first thing|this morning|in the morning|morning)\b/i.test(t))return{part:'am'};if(/\b(this afternoon|afternoon|after lunch)\b/i.test(t))return{part:'pm'};if(/\b(tonight|this evening|evening|after work)\b/i.test(t))return{part:'eve'};if(/\b(late|before bed|night)\b/i.test(t))return{part:'night'};return null}
function stripTime(t){return String(t).replace(/\s*\b(?:at|@|by|from|around)?\s*\d{1,2}(?::\d{2})?\s*(?:am|pm)\b/ig,'').replace(/\s*\b(?:at|@|around)\s+\d{1,2}(?::\d{2})?\b(?!\s*(?:min|mins|minutes|h|hr|hrs|hours))/ig,'').replace(DUR_RE,'').replace(/\s*\b(first thing|this morning|in the morning|this afternoon|after lunch|this evening|after work)\b/ig,'').replace(/\s+/g,' ').replace(/\s+(for|at|by)$/i,'').trim()}
const PART_START={am:8*60,pm:13*60,eve:18*60,night:20*60+30};const PART_RANK={am:0,none:1,pm:2,eve:3,night:4};
/* items: {id,min,at?,part?,pri?,order}. Fixed times stay put, everything else fills the gaps in a sensible order */
function layoutDay(items,startM,endM=23*60,gap=10){const slots=[];const fixed=items.filter(i=>i.at!=null).sort((a,b)=>a.at-b.at);fixed.forEach(f=>{f.start=f.at;slots.push([f.at,f.at+f.min])});
  const flex=items.filter(i=>i.at==null).sort((a,b)=>(PART_RANK[a.part||'none']-PART_RANK[b.part||'none'])||((b.pri?1:0)-(a.pri?1:0))||((a.order||0)-(b.order||0)));let t=startM;const over=[];
  for(const it of flex){let s=Math.max(t,it.part?Math.max(startM,PART_START[it.part]):startM);for(let k=0;k<60;k++){const c=slots.find(([a,b])=>s<b+gap&&s+it.min+gap>a);if(!c)break;s=c[1]+gap}
    if(s+it.min>endM){it.start=null;over.push(it);continue}it.start=s;slots.push([s,s+it.min]);t=s+it.min+gap}
  return{over}}
const clockOf=m=>{m=((Math.round(m)%1440)+1440)%1440;const h=Math.floor(m/60),mi=m%60;return `${h%12||12}:${pad(mi)} ${h<12?'am':'pm'}`};
const durTxt=m=>m>=60?`${Math.floor(m/60)}h${m%60?' '+(m%60)+'m':''}`:`${m}m`;
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const nextStart=()=>{const n=nowMin();return Math.max(7*60,Math.ceil((n+5)/15)*15)};
const tlHead=(m,min)=>{if(m==null)return `<div class="tl-t"><b>Later</b><small>${durTxt(min)}</small></div>`;const c=clockOf(m).split(' ');return `<div class="tl-t"><b>${c[0]}</b><small>${c[1]} · ${durTxt(min)}</small></div>`};

function liveChip(){const L=Store.ready?liveDoc():{};const f=Store.ready?focusDoc().run:null;
  if(L.game){const g=findIn(gamesDoc().list,L.game.id);return `<button class="tchip" data-act="openGame" data-id="${L.game.id}"><i class="dotp"></i><span>${esc(g?g.title:'Game')}</span><span data-tick="${L.game.start}">${fmtHMS(Date.now()-L.game.start)}</span></button>`}
  if(L.lift||L.skate){const r=L.lift||L.skate;return `<button class="tchip" data-act="resume"><i class="dotp"></i><span>${L.skate?'Skate':'Lift'}</span><span data-tick="${r.start}">${fmtHMS(Date.now()-r.start)}</span></button>`}
  if(L.fit)return `<button class="tchip" data-act="goCatId" data-c="fitness"><i class="dotp"></i><span>${esc(L.fit.act)}</span><span data-tick="${L.fit.start}">${fmtHMS(Date.now()-L.fit.start)}</span></button>`;
  if(f)return `<button class="tchip" data-act="goCatId" data-c="focus"><i class="dotp"></i><span>Focus</span><span data-fcd>${fmtMS(focusLeft(f))}</span></button>`;return ''}
function renderStatus(){paintClock();const st=Store.ready?lvlOf(stats().xp):{pct:0,l:1};const b=$('#batt b');b.querySelector('i').style.width=`calc(${Math.round(st.pct*100)}% - 2px)`;b.classList.remove('low');$('#batt').title=`Level ${st.l} · ${Math.round(st.pct*100)}%`;
  $('#sndBtn').innerHTML=ico(S().sound!==false?'sndOn':'sndOff');$('#tchip').innerHTML=liveChip()}
function renderRail(){const tr=$('#track');if(!tr.children.length)tr.innerHTML=CATS.map((c,i)=>`<button class="cat" data-act="cat" data-i="${i}" aria-label="${c.label}">${cati(c.icon)}<span class="cat-l">${c.label}</span></button>`).join('');
  [...tr.children].forEach((el,i)=>{el.classList.toggle('on',i===view.cat);el.setAttribute('aria-current',i===view.cat?'page':'false')});
  const sel=tr.children[view.cat];const anchor=Math.max(10,parseFloat(getComputedStyle($('.col')).paddingLeft)-8);tr.style.transform=`translateX(${anchor-sel.offsetLeft}px)`}
const RENDER={},PANELS={};
function render(){if(!Store.ready)return;renderStatus();renderRail();const col=$('#col');const id=CATS[view.cat].id;const keep=col.dataset.cat===id?col.scrollTop:0;
  let html='';try{html=RENDER[id]()}catch(e){console.error(e);html=`<p class="empty">This section hit an error: ${esc(e.message)}</p>`}
  const anim=col.dataset.cat&&col.dataset.cat!==id?(view.dir>0?'in-r':'in-l'):'';keepHScroll(col,col.dataset.cat===id,()=>{col.innerHTML=`<div class="col-in ${anim}">${html}</div>`});col.dataset.cat=id;col.scrollTop=keep;if(view.panel)renderPanel()}
function goCat(i){if(i<0||i>=CATS.length||i===view.cat)return;view.dir=i>view.cat?1:-1;view.cat=i;view.panel=null;$('#panel').hidden=true;lsSet('sq.cat',CATS[i].id);Snd.play('move');render()}
const goId=id=>goCat(CATS.findIndex(c=>c.id===id));
function renderPanel(){const pn=view.panel;const el=$('#panel');if(!pn){el.hidden=true;return}const fn=PANELS[pn.type];let r=null;try{r=fn&&fn(pn)}catch(e){console.error(e);r={title:'Error',body:`<p class="empty">${esc(e.message)}</p>`}}
  if(!r){view.panel=null;el.hidden=true;return}const body=el.querySelector('.panel-b');const key=pn.type+(pn.id||'');const keep=body&&el.dataset.key===key?body.scrollTop:0;
  el.hidden=false;el.setAttribute('style',el.dataset.key?'animation:none':'');
  keepHScroll(el,el.dataset.key===key,()=>{el.innerHTML=`<div class="panel-h"><button class="back" data-act="closePanel">${ico('back')}${esc(r.back||CATS[view.cat].label)}</button><div class="panel-t">${esc(r.title)}</div></div><div class="panel-b"><div class="panel-in">${r.body}</div></div>`});el.dataset.key=key;el.querySelector('.panel-b').scrollTop=keep}
function openPanel(type,id,tab){view.panel={type,id,tab};const el=$('#panel');el.dataset.key='';el.removeAttribute('style');el.hidden=true;Snd.play('open');renderPanel()}
const tabsHtml=(k,items)=>`<div class="tabs">${items.map(([v,l,n])=>`<button class="tab ${view[k]===v?'on':''}" data-act="setView" data-k="${k}" data-v="${v}">${esc(l)}${n!=null?`<span class="tn">${n}</span>`:''}</button>`).join('')}</div>`;
const filterChips=(k,items,allLabel='All')=>`<div class="hs fchips"><button class="chip ${!view[k]?'on':''}" data-act="setView" data-k="${k}" data-v="">${esc(allLabel)}</button>${items.map(([v,l])=>`<button class="chip ${view[k]===v?'on':''}" data-act="setView" data-k="${k}" data-v="${esc(v)}">${esc(l)}</button>`).join('')}</div>`;
const skillChip=id=>{const s=skillOf(id);return `<span class="chip skc" style="--c:${s.c}">${esc(s.n)}</span>`};
const tile=(title,sub='',art='',sq=0)=>{const h=dayHash(title||'?');const a=(Math.imul(h^(h>>>15),2654435761)>>>0)%360,b=(a+20+((h>>>11)%40))%360;const ini=String(title||'?').replace(/^(the|a|an)\s+/i,'').split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();const ok=art&&/^https:\/\//i.test(art);return `<span class="cov ${sq?'sqr':''} ${ok?'has':''}" style="--a:hsl(${a} 60% 46%);--b:hsl(${b} 65% 24%)"><b>${esc(ini)}</b>${sub?`<small>${esc(sub)}</small>`:''}${ok?`<img src="${esc(art)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.parentNode.classList.remove('has');this.remove()">`:''}</span>`};
const empty=(t,act,lbl)=>`<div class="empty2"><p>${esc(t)}</p>${act?`<button class="btn sm" data-act="${act}">${ico('plus')}${esc(lbl)}</button>`:''}</div>`;

/* ================= MY WORLD ================= */
const STAR=`<svg viewBox="0 0 24 24" aria-hidden="true"><defs><radialGradient id="pcg" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#cfe0ff"/></radialGradient></defs><path d="M12 1.6l3.2 6.5 7.1 1-5.2 5 1.3 7.1L12 17.8l-6.4 3.4 1.3-7.1-5.2-5 7.1-1z" fill="url(#pcg)"/></svg>`;
function playerCard(){const st=stats(),L=lvlOf(st.xp),s=S();return `<section class="pcard"><i class="holo"></i><div class="pc-row"><div class="pc-star">${STAR}</div><div class="pc-id"><div class="pc-name">${esc(s.name||'Player')}</div><div class="pc-title">${esc(s.title||'Rookie')}</div></div><button class="pc-lvl" data-act="goCatId" data-c="trophies" aria-label="Level ${L.l}"><small>LV</small><b>${L.l}</b></button></div>
  <div class="xpbar"><i style="width:${Math.max(2,Math.round(L.pct*100))}%"></i></div><div class="pc-meta"><span>${L.cur} / ${L.need} XP to level ${L.l+1}</span><button class="coins" data-act="goRewards">${ico('coin')}${st.coins.toLocaleString('en-GB')}</button></div></section>`}
function radar(sk){const W=280,H=230,cx=W/2,cy=H/2+8,R=78;const max=Math.max(100,...Object.values(sk));const ang=i=>-Math.PI/2+i*2*Math.PI/5;const pt=(i,r)=>[cx+Math.cos(ang(i))*r,cy+Math.sin(ang(i))*r];
  const ring=f=>SKILLS.map((_,i)=>pt(i,R*f).map(v=>v.toFixed(1)).join(',')).join(' ');
  const val=SKILLS.map((s,i)=>pt(i,R*Math.max(.06,sk[s.id]/max)).map(v=>v.toFixed(1)).join(',')).join(' ');
  return `<svg class="radar" viewBox="0 0 ${W} ${H}" role="img" aria-label="Skill balance">${[.34,.67,1].map(f=>`<polygon points="${ring(f)}" fill="none" stroke="rgba(255,255,255,${f===1?.3:.13})"/>`).join('')}${SKILLS.map((_,i)=>{const [x,y]=pt(i,R);return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,.12)"/>`}).join('')}
  <polygon points="${val}" fill="rgba(255,255,255,.22)" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>${SKILLS.map((s,i)=>{const [x,y]=pt(i,R*Math.max(.06,sk[s.id]/max));return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.6" fill="${s.c}"/>`}).join('')}
  ${SKILLS.map((s,i)=>{const [x,y]=pt(i,R+26);return `<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" fill="rgba(255,255,255,.85)" font-size="11.5">${s.n}</text><text x="${x.toFixed(1)}" y="${(y+18).toFixed(1)}" text-anchor="middle" fill="${s.c}" font-size="11" font-family="var(--f-num)">${sk[s.id]}</text>`}).join('')}</svg>`}
function workoutsOn(day){return sessionsOf('lift').filter(s=>s.date===day).length+sessionsOf('skate').filter(s=>s.date===day).length+fitDoc().list.filter(x=>x.date===day).length}
function nextUp(){const L=liveDoc(),now=new Date(),hr=now.getHours(),today=ymd(now);
  if(L.game){const g=findIn(gamesDoc().list,L.game.id);if(g)return{t:`Back to ${g.title}`,s:'Your session timer is running',act:'openGame',data:`data-id="${g.id}"`,icon:'game'}}
  if(L.lift)return{t:'Finish your workout',s:WORKOUTS[L.lift.wid].n,act:'resume',icon:'dumbbell'};
  if(L.skate)return{t:'Skate session running',s:'Log your tries as you go',act:'goCatId',data:'data-c="skate"',icon:'board'};
  if(L.fit)return{t:`${L.fit.act} in progress`,s:'Tap Finish when you are done',act:'goCatId',data:'data-c="fitness"',icon:'flame'};
  if(focusDoc().run)return{t:'Focus session running',s:focusDoc().run.task||'Stay with it',act:'goCatId',data:'data-c="focus"',icon:'focus'};
  const due=qDoc().list.filter(q=>q.status==='active'&&q.due&&q.due<=today).sort((a,b)=>a.due.localeCompare(b.due));
  if(due.length)return{t:due[0].title,s:due[0].due<today?'Past its target date. Still worth it, no pressure':'Target date is today',act:'openQuest',data:`data-id="${due[0].id}"`,icon:'quest'};
  const moved=workoutsOn(today)>0;const playing=gamesDoc().list.filter(g=>g.status==='playing').sort((a,b)=>(b.last||0)-(a.last||0));const wl=filmsDoc().list.filter(f=>f.status==='watchlist');
  if(hr>=5&&hr<11&&!moved){const a=dayActs(now).find(x=>ACTS[x]&&ACTS[x].kind!=='rest');if(a){const A_=ACTS[a];return{t:`Today: ${A_.n}`,s:'Any movement counts',act:A_.kind==='skate'?'goCatId':A_.kind==='lift'?'openWorkout':'openStarter',data:A_.kind==='skate'?'data-c="skate"':A_.kind==='lift'?`data-id="${a}"`:`data-id="${({Boxing:'box33',Padel:'padel',Walking:'walk20',Mobility:'mob10'})[A_.a]||'walk20'}"`,icon:A_.icon}}return{t:'10 minutes of mobility',s:'An easy way to start the day',act:'openStarter',data:'data-id="mob10"',icon:'user'}}
  if(hr>=18||hr<3){if(playing[0]&&playing[0].next)return{t:`Continue ${playing[0].title}`,s:`Next: ${playing[0].next}`,act:'openGame',data:`data-id="${playing[0].id}"`,icon:'game'};if(wl.length)return{t:'Pick tonight\'s film',s:`${plural(wl.length,'film')} on your watchlist`,act:'pickFilm',icon:'film'}}
  if(hr>=11&&hr<18&&!focusDoc().list.some(f=>f.date===today))return{t:'One focus session',s:'25 minutes on the thing that matters most',act:'goCatId',data:'data-c="focus"',icon:'focus'};
  if(!moved)return{t:'Move a little today',s:'A 20 minute walk counts',act:'openStarter',data:'data-id="walk20"',icon:'user'};
  if(playing[0])return{t:`Continue ${playing[0].title}`,s:playing[0].next?`Next: ${playing[0].next}`:'Pick up where you left off',act:'openGame',data:`data-id="${playing[0].id}"`,icon:'game'};
  return{t:'Spin Creative Roulette',s:'A small idea you can finish today',act:'goCatId',data:'data-c="studio"',icon:'dice'}}
function dailyPicks(){const d=dailyDoc();const today=ymd(new Date());if(d.date!==today||!Array.isArray(d.ids)||d.ids.length<3){d.date=today;d.ids=seedPick(today);d.done=[];Store.touch('sq/daily')}d.done=d.done||[];return d}
function seedPick(day){let h=dayHash(day);const rnd=()=>{h=(Math.imul(h,1664525)+1013904223)>>>0;return h/4294967296};const pool=[...DAILY];for(let i=pool.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const out=[],used=new Set();for(const q of pool){if(out.length>=3)break;if(used.has(q.s))continue;used.add(q.s);out.push(q.id)}return out}
function dailyBlock(){const d=dailyPicks();const today=d.date;return `<section><div class="lbl-row"><div class="lbl">Daily side quests</div><span class="muted small num">${d.done.length} of 3</span></div><div class="dq">${d.ids.map((id,i)=>{const q=dqOf(id);if(!q)return '';const done=d.done.includes(id);const s=skillOf(q.s);
  return `<div class="dqc ${done?'done':''}" style="--c:${s.c}"><button class="ck ${done?'on':''}" data-act="dDone" data-id="${id}" aria-label="Done">${ico('check')}</button><div class="dq-m"><b>${esc(q.t)}</b><small>${esc(s.n)} · +${q.xp} XP</small></div>${done?'':`<button class="dq-sw" data-act="dSwap" data-i="${i}" aria-label="Swap">${ico('dice')}</button>`}</div>`}).join('')}</div><p class="muted small" style="margin:6px 0 0">New ones every day. Skipping a day never costs you anything.</p></section>`}
function tryToday(){const today=ymd(new Date());const h=dayHash(today+'try');const ex=exploreDoc().list.filter(x=>x.status==='totry');const out=[];
  if(ex.length){const x=ex[h%ex.length];out.push(rowHtml({act:'openExplore',data:`data-id="${x.id}"`,icon:'pin',iconCls:'acc',t:`Try: ${x.title}`,s:[kindName(x.kind),x.area].filter(Boolean).join(' · ')||'From your Explore list'}))}
  else{const i=TRY_IDEAS[h%TRY_IDEAS.length];out.push(rowHtml({act:'addTryIdea',data:`data-i="${h%TRY_IDEAS.length}"`,icon:'pin',iconCls:'acc',t:`Idea: ${i.t}`,s:'Tap to add it to Explore'}))}
  const p=PROMPTS[(h>>4)%PROMPTS.length];out.push(rowHtml({act:'showPrompt',data:`data-i="${PROMPTS.indexOf(p)}"`,icon:'cam',t:`Make: ${p.title}`,s:`${mediaName(p.m)} · ${p.t>=120?'2h+':p.t+' min'} · ${p.out}`}));
  const wl=filmsDoc().list.filter(f=>f.status==='watchlist');if(wl.length){const f=wl[(h>>8)%wl.length];out.push(rowHtml({act:'openFilm',data:`data-id="${f.id}"`,icon:'film',t:`Watch: ${f.title}`,s:[f.year,f.genre,f.runtime?f.runtime+' min':''].filter(Boolean).join(' · ')}))}
  const tl=musicDoc().list.filter(m=>m.status==='tolisten');if(tl.length){const m=tl[(h>>12)%tl.length];out.push(rowHtml({act:'openMusic',data:`data-id="${m.id}"`,icon:'music',t:`Listen: ${m.title}`,s:[m.artist,fmtName(m.format)].filter(Boolean).join(' · ')}))}
  return `<section><div class="lbl">Try this today</div><div class="list">${out.join('')}</div></section>`}
RENDER.world=()=>{const st=stats();const nx=nextUp();const qs=qDoc().list.filter(q=>q.status==='active').slice(0,3);const playing=gamesDoc().list.filter(g=>g.status==='playing').sort((a,b)=>(b.last||0)-(a.last||0)).slice(0,2);
  let h=playerCard();
  h+=`<section class="cmdrow"><button class="cmdbar" data-act="cmd"><span class="cmd-ic">${ico('mic')}</span><span>What did you do? <em>watched, played, tried, boxing 30 min</em></span></button>${typeof planCard==='function'&&planCard()?'':`<button class="cmdbar plan" data-act="planNew"><span class="cmd-ic">${ico('time')}</span><span>Plan my day <em>list it all, it splits and times it</em></span></button>`}</section>`;
  if(typeof planCard==='function')h+=planCard();
  h+=`<section><button class="hero-fri nextup" data-act="${nx.act}" ${nx.data||''}><span class="row-ic acc">${ico(nx.icon||'next')}</span><span style="flex:1;min-width:0"><small>Next up</small><b>${esc(nx.t)}</b><small>${esc(nx.s)}</small></span>${ico('next')}</button></section>`;
  h+=skyCard(true);h+=dailyBlock();h+=tryToday();
  h+=countdownBlock();
  h+=`<section><div class="lbl-row"><div class="lbl">Skill balance</div><span class="muted small num">${st.xp.toLocaleString('en-GB')} XP lifetime</span></div><div class="radarbox">${radar(st.sk)}</div><div class="sklv">${SKILLS.map(s=>{const L=skillLvl(st.sk[s.id]);return `<span style="--c:${s.c}"><b>${L.l}</b><small>${s.n}</small><i><em style="width:${Math.round(L.pct*100)}%"></em></i></span>`}).join('')}</div></section>`;
  h+=weekRecap(st)+memories();
  h+=`<section><div class="lbl-row"><div class="lbl">Your year</div><button class="btn sm ghost" data-act="openYear">${new Date().getFullYear()} in review</button></div><button class="hmbox" data-act="openYear" aria-label="Open your year in review">${heatmap(26)}</button></section>`;
  if(qs.length)h+=`<section><div class="lbl-row"><div class="lbl">Active quests</div><button class="btn sm ghost" data-act="goCatId" data-c="quests">All</button></div><div class="list">${qs.map(questRow).join('')}</div></section>`;
  if(playing.length)h+=`<section><div class="lbl">Now playing</div><div class="list">${playing.map(gameRow).join('')}</div></section>`;
  h+=`<section><div class="lbl">Recent activity</div>${st.ev.length?`<div class="feed">${st.ev.slice(0,7).map(e=>{const s=skillOf(e.s);return `<div class="fd"><i style="background:${s.c}"></i><span>${esc(e.l)}</span><b class="num">+${e.xp}</b><small>${ago(e.at)}</small></div>`}).join('')}</div>`:'<p class="empty">Nothing yet. Every quest, film, workout and idea shows up here with its XP.</p>'}</section>`;
  return h};

/* ================= QUESTS ================= */
function questRow(q){const s=skillOf(q.skill);const ms=q.ms||[];const md=ms.filter(m=>m.done).length;const today=ymd(new Date());
  const sub=[DIFF[q.diff]?DIFF[q.diff].n:'',s.n,ms.length?`${md}/${ms.length} steps`:'',q.due?(q.status==='active'&&q.due<today?`was due ${fmtDM(parseYmd(q.due))}`:`by ${fmtDM(parseYmd(q.due))}`):'',q.starter?'Starter':''].filter(Boolean).join(' · ');
  return `<button class="row qrow ${q.status}" data-act="openQuest" data-id="${q.id}"><span class="row-ic qstar" style="--c:${s.c}">${ico(q.status==='done'?'check':'quest')}</span><span class="row-main"><span class="row-t">${esc(q.title)}</span><span class="row-s">${esc(sub)}</span>${ms.length&&q.status==='active'?`<span class="mbar"><i style="width:${Math.round(md/ms.length*100)}%;background:${s.c}"></i></span>`:''}</span><span class="row-side"><span class="xpb">${DIFF[q.diff]?DIFF[q.diff].xp:0}</span></span></button>`}
RENDER.quests=()=>{const L=qDoc().list;const by=k=>L.filter(q=>q.status===k);const T=view.qTab;if(T==='bosses')return bossesView(by('active').length);let list=by(T);
  if(T==='active')list.sort((a,b)=>(a.due||'9').localeCompare(b.due||'9')||b.created-a.created);else list.sort((a,b)=>(b.doneAt||b.created)-(a.doneAt||a.created));
  return `<section class="lbl-row"><div class="lbl">Quests</div><button class="btn sm pri" data-act="questNew">${ico('plus')}New quest</button></section>
  ${tabsHtml('qTab',[['active','Active',by('active').length],['bosses','Bosses',bossesActive().length],['done','Completed',by('done').length],['archived','Archived',by('archived').length]])}
  <section>${list.length?`<div class="list">${list.map(questRow).join('')}</div>`:T==='active'?empty('No active quests. Make one, or turn a Creative Roulette idea into a quest.','questNew','New quest'):`<p class="empty">Nothing here yet.</p>`}</section>
  ${T==='active'?`<section class="plate"><div class="lbl">How XP works</div><div class="xpt-grid"><span>Quick quest</span><b>30</b><span>Standard quest</span><b>80</b><span>Boss quest</span><b>180</b></div><p class="muted small" style="margin:8px 0 0">Quests with steps unlock once every step is ticked. One coin for every 5 XP.</p></section>`:''}`};
PANELS.quest=pn=>{const q=findIn(qDoc().list,pn.id);if(!q)return null;const s=skillOf(q.skill);const ms=q.ms||[];const md=ms.filter(m=>m.done).length;const ready=!ms.length||md===ms.length;
  return{title:q.title,back:'Quests',body:`<section><div class="chips">${skillChip(q.skill)}<span class="chip">${DIFF[q.diff].n} · ${DIFF[q.diff].xp} XP</span>${q.due?`<span class="chip">Target ${fmtD(parseYmd(q.due))}</span>`:''}${q.starter?'<span class="chip">Starter quest</span>':''}${q.src==='roulette'?'<span class="chip">From Creative Roulette</span>':''}${q.status==='done'?`<span class="chip ok">Completed ${fmtDM(new Date(q.doneAt))}</span>`:''}${q.status==='archived'?'<span class="chip">Archived</span>':''}</div></section>
  ${q.desc?`<section><p class="qdesc">${esc(q.desc)}</p></section>`:''}
  ${ms.length?`<section><div class="lbl-row"><div class="lbl">Steps</div><span class="num muted small">${md} of ${ms.length}</span></div><div class="list">${ms.map(m=>`<button class="fi" data-act="msTick" data-id="${q.id}" data-m="${m.id}" ${q.status!=='active'?'disabled':''}><span class="ck ${m.done?'on':''}">${ico('check')}</span><span class="fi-t">${esc(m.t)}</span></button>`).join('')}</div></section>`:''}
  <section class="btns">${q.status==='active'?`<button class="btn pri ${ready?'':'off'}" data-act="questDone" data-id="${q.id}">${ico('check')}${ready?'Complete quest':`${ms.length-md} steps to go`}</button>`:''}

function skillLvl(xp){const l=1+Math.floor(Math.sqrt((xp||0)/40));const lo=40*(l-1)**2,hi=40*l**2;return{l,pct:(xp-lo)/(hi-lo)}}
function weekRecap(st){const since=Date.now()-7*864e5;const ev=st.ev.filter(e=>e.at>=since);if(!ev.length)return '';const xp=ev.reduce((a,e)=>a+e.xp,0);const sk={};ev.forEach(e=>{sk[e.s]=(sk[e.s]||0)+e.xp});const top=Object.keys(sk).sort((a,b)=>sk[b]-sk[a])[0];const days=new Set(ev.map(e=>e.d)).size;
  return `<section><div class="lbl">Last 7 days</div><div class="mgrid z3"><div class="mt"><small>XP</small><b>${xp.toLocaleString('en-GB')}</b></div><div class="mt"><small>Active days</small><b>${days} / 7</b></div><div class="mt"><small>Top skill</small><b style="color:${skillOf(top).c}">${skillOf(top).n}</b></div></div></section>`}
function memories(){const now=new Date();const md=`${pad(now.getMonth()+1)}-${pad(now.getDate())}`;const items=[];
  filmsDoc().list.forEach(f=>{if(f.watchedAt&&f.watchedAt.slice(5)===md&&!f.watchedAt.startsWith(now.getFullYear()+''))items.push({y:+f.watchedAt.slice(0,4),t:`You watched ${f.title}`,s:f.rating!=null?`and gave it ${fmtR(f.rating)}/10`:'',act:'openFilm',id:f.id,ic:'film'})});
  gamesDoc().list.forEach(g=>(g.sessions||[]).forEach(s=>{if(s.date&&s.date.slice(5)===md&&!s.date.startsWith(now.getFullYear()+''))items.push({y:+s.date.slice(0,4),t:`You played ${g.title}`,s:s.what||fmtHrs(s.min||0),act:'openGame',id:g.id,ic:'game'})}));
  qDoc().list.forEach(q=>{if(q.doneAt){const d=new Date(q.doneAt);if(`${pad(d.getMonth()+1)}-${pad(d.getDate())}`===md&&d.getFullYear()!==now.getFullYear())items.push({y:d.getFullYear(),t:`You finished ${q.title}`,s:'Quest',act:'openQuest',id:q.id,ic:'quest'})}});
  if(!items.length)return '';return `<section><div class="lbl">On this day</div><div class="list">${items.slice(0,4).map(x=>rowHtml({act:x.act,data:`data-id="${x.id}"`,icon:x.ic,t:x.t,s:`${now.getFullYear()-x.y} ${now.getFullYear()-x.y===1?'year':'years'} ago${x.s?' · '+x.s:''}`})).join('')}</div></section>`}

/* ================= holographic player card ================= */
(()=>{let tx=0,ty=0;const apply=()=>{const c=document.querySelector('.pcard');if(!c)return;c.style.setProperty('--rx',(ty*7).toFixed(2)+'deg');c.style.setProperty('--ry',(tx*9).toFixed(2)+'deg');c.style.setProperty('--hx',(50+tx*40).toFixed(1)+'%');c.style.setProperty('--hy',(50+ty*40).toFixed(1)+'%')};
  document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.pcard');if(!c||e.pointerType==='touch')return;const r=c.getBoundingClientRect();tx=(e.clientX-r.left)/r.width*2-1;ty=-((e.clientY-r.top)/r.height*2-1);apply()},{passive:true});
  document.addEventListener('pointerleave',()=>{tx=ty=0;apply()},true);
  addEventListener('deviceorientation',e=>{if(e.gamma==null)return;tx=Math.max(-1,Math.min(1,e.gamma/30));ty=Math.max(-1,Math.min(1,((e.beta||45)-45)/30));apply()},{passive:true})})();

/* ================= SKATE and LIFT (from KICKFLIP 2000) ================= */
const skateDoc=()=>{const d=Store.ensure('ko/skate',()=>({step:0,best:{},att:0,lands:0}));d.best=d.best||{};return d};
const prDoc=()=>Store.ensure('ko/prs',()=>({}));
const plan=()=>S().plan||PLAN_DEFAULT;
const dayActs=d=>plan()[String(d.getDay())]||['rest'];
function sessionsOf(col){const out=[];for(const p in Store.data)if(p.startsWith(col+'/')&&Store.data[p])for(const s of (Store.data[p].sessions||[]))out.push(Object.assign({_doc:p},s));return out.sort((a,b)=>b.start-a.start)}
function pushSession(col,s){const p=col+'/'+ymOf(new Date(s.start));const d=Store.ensure(p,()=>({sessions:[]}));d.sessions=d.sessions||[];d.sessions.push(s);Store.touch(p)}
function actDone(act,d){const k=ymd(d);const a=ACTS[act];if(!a)return false;if(a.kind==='rest')return true;if(a.kind==='skate')return sessionsOf('skate').some(s=>s.date===k);if(a.kind==='log')return fitDoc().list.some(x=>x.date===k&&x.act===a.a);return sessionsOf('lift').some(s=>s.date===k&&s.wid===act)}
function weekStats(mon){let t=0,d=0;for(let i=0;i<7;i++){const day=addDays(mon,i);for(const a of dayActs(day)){if(!ACTS[a]||ACTS[a].kind==='rest')continue;t++;if(actDone(a,day))d++}}return{t,d,pct:t?d/t:0}}
const stepIdx=()=>Math.min(LADDER.length-1,skateDoc().step||0);
const allCleared=()=>(skateDoc().step||0)>=LADDER.length;
const trickName=id=>(LADDER.find(s=>s.id===id)||{}).n||id;
function lastSetsFor(ex){for(const s of sessionsOf('lift')){const sets=(s.sets||[]).filter(x=>x.ex===ex);if(sets.length)return sets}return null}
function suggest(exId){const e=EX[exId];const last=lastSetsFor(exId);const u=e.unit==='s'?'s':'';
  if(!last)return{w:null,r:e.hi,note:e.inc?`First time: pick a weight you could do about ${e.hi+2} times`:`Aim for ${e.hi}${u}`};
  const topW=Math.max(0,...last.map(s=>s.w||0));const work=last.filter(s=>(s.w||0)===topW);const allHit=work.length>=e.sets&&work.every(s=>s.r>=e.hi);
  if(!e.inc){const best=Math.max(...last.map(s=>s.r||0));return{w:null,r:e.amrap?best+1:Math.min(e.hi,best+(allHit?0:2)),note:`Last: ${last.map(s=>s.r+u).join(', ')}${e.amrap?` · beat ${best}`:''}`}}
  const w=allHit?Math.round((topW+e.inc)*10)/10:topW;return{w,r:allHit?e.lo:e.hi,note:`Last: ${topW}kg × ${last.map(s=>s.r).join(', ')}${allHit?` · all sets hit ${e.hi}, go up to ${w}kg`:` · hit ${e.hi} on every set to go up`}`}}
function weekBlock(mon,wk){const today=ymd(new Date());return `<section><div class="lbl-row"><div class="lbl">This week · ${wk.d} of ${wk.t}</div><button class="btn sm ghost" data-act="setView" data-k="fitTab" data-v="plan">Plan</button></div><div class="week7">${[0,1,2,3,4,5,6].map(i=>{const d=addDays(mon,i);const acts=dayActs(d).filter(a=>ACTS[a]);const real=acts.filter(a=>ACTS[a].kind!=='rest');const hit=real.length&&real.every(a=>actDone(a,d));return `<button class="dcell ${ymd(d)===today?'today':''} ${hit?'hit':''}" data-act="dayOpts" data-d="${ymd(d)}"><span>${DOW[d.getDay()].slice(0,2)}</span>${ico(acts[0]?ACTS[acts[0]].icon:'moon')}<span class="dots">${real.map(a=>`<i class="${actDone(a,d)?'on':''}"></i>`).join('')}</span></button>`}).join('')}</div></section>`}

/* skate */
RENDER.skate=()=>{const L=liveDoc(),sk=skateDoc(),i=stepIdx();let h='';
  if(L.skate){const s=L.skate;const cur=LADDER.find(x=>x.id===s.cur)||LADDER[i];const c=(s.c&&s.c[cur.id])||{a:0,l:0};const tot=Object.values(s.c||{}).reduce((m,x)=>({a:m.a+x.a,l:m.l+x.l}),{a:0,l:0});const isGoal=LADDER.indexOf(cur)===(sk.step||0);
    h+=`<section class="plate" style="display:grid;gap:14px"><div class="lbl-row" style="margin:0"><div class="lbl">Session · <span data-tick="${s.start}">${fmtHMS(Date.now()-s.start)}</span></div><button class="btn sm ghost" data-act="pickTrick">Switch trick</button></div>
    <div><div class="player-ex">${esc(cur.n)}</div><div class="muted small" style="margin-top:4px">${isGoal?`Goal: ${cur.need} ${esc(cur.unit)} this session to unlock the next step`:'Practice'}</div></div>
    ${isGoal?`<div><div class="lbl-row" style="margin-bottom:6px"><span class="num">${c.l} / ${cur.need}</span><span class="num muted small">${c.a?Math.round(c.l/c.a*100):0}% landed</span></div><div class="bar ${c.l>=cur.need?'ok':''}"><i style="width:${Math.min(100,c.l/cur.need*100).toFixed(1)}%"></i></div></div>`:''}
    <div class="bigbtns"><button class="big" data-act="skTry">Bail<small>${c.a-c.l} missed</small></button><button class="big land" data-act="skLand">Landed<small>${c.l} landed</small></button></div>
    <div class="statrow"><div><b>${tot.a}</b><small>Tries</small></div><div><b>${tot.l}</b><small>Landed</small></div><div><b>${tot.a?Math.round(tot.l/tot.a*100):0}%</b><small>Rate</small></div></div>
    <div class="btns"><button class="btn ghost" data-act="skUndo">Undo</button><span style="flex:1"></span><button class="btn pri" data-act="skEnd">${ico('stop')}End session</button></div></section>`;
    h+=tipsBlock(cur)}
  else{const cur=allCleared()?LADDER[LADDER.length-1]:LADDER[i];
    h+=`<section class="plate" style="display:grid;gap:12px"><div class="lbl">${allCleared()?'All steps cleared':`Road to kickflip · step ${i+1} of ${LADDER.length}`}</div><div class="player-ex">${esc(cur.n)}</div><div class="muted">${esc(cur.goal)}: ${cur.need} in one session · ${esc(cur.where)}</div><span class="stagebar">${LADDER.map((s,j)=>`<i class="${j<(sk.step||0)?'on':''}"></i>`).join('')}</span><div class="btns"><button class="btn pri" data-act="skStart">${ico('play')}Start session</button></div></section>`;
    h+=tipsBlock(cur)}
  h+=`<section><div class="lbl">The ladder</div><div class="list">${LADDER.map((s,j)=>{const st=j<(sk.step||0)?'done':j===(sk.step||0)?'cur':'lock';return `<button class="step ${st}" data-act="openStep" data-id="${s.id}"><span class="step-n">${st==='done'?'✓':j+1}</span><span class="row-main"><span class="row-t">${esc(s.n)}</span><span class="row-s">${st==='done'?`Cleared · best ${sk.best[s.id]||0} in a session`:`${s.need} ${esc(s.unit)} in one session`}</span></span></button>`}).join('')}</div></section>`;
  return h};
const tipsBlock=s=>`<section><div class="lbl">How to</div><ul class="tips">${s.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><p class="flag" style="margin-top:12px">${ico('warn')}<span>${esc(s.safe)}</span></p></section>`;
PANELS.step=pn=>{const s=LADDER.find(x=>x.id===pn.id);if(!s)return null;const sk=skateDoc();const j=LADDER.indexOf(s);const st=j<(sk.step||0)?'done':j===(sk.step||0)?'cur':'lock';
  const hist=sessionsOf('skate').filter(x=>x.c&&x.c[s.id]&&x.c[s.id].a).slice(0,14).reverse();
  return{title:s.n,back:'Skate',body:`<section><div class="chips"><span class="chip ${st==='done'?'ok':st==='cur'?'acc':''}">${st==='done'?'Cleared':st==='cur'?'Current step':'Locked'}</span><span class="chip">${s.need} ${esc(s.unit)} in one session</span><span class="chip">${esc(s.where)}</span></div></section>${tipsBlock(s)}
  <section><div class="lbl">Land rate by session</div>${hist.length?spark(hist.map(x=>x.c[s.id].l/x.c[s.id].a)):'<p class="empty">No sessions on this one yet.</p>'}</section>
  ${st!=='done'?`<section class="btns"><button class="btn ghost" data-act="cb" data-i="${cb(el=>armSkip(el,s))}">I can already do this</button></section>`:''}`}};
function armSkip(el,s){if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Tap again to mark it cleared';Snd.play('err');return}const sk=skateDoc();const j=LADDER.indexOf(s);if((sk.step||0)<=j){sk.step=j+1;Store.touch('ko/skate');Snd.play('done');Waves.flash()}view.panel=null;$('#panel').hidden=true;queueTrophyCheck();render()}
function spark(vals){const w=300,h=70,n=vals.length;if(!n)return '';const pts=vals.map((v,i)=>[n===1?w/2:i/(n-1)*(w-12)+6,h-8-v*(h-16)]);const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');const last=pts[n-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="Land rate trend"><line x1="0" y1="${h-8}" x2="${w}" y2="${h-8}" stroke="rgba(255,255,255,.12)"/><line x1="0" y1="8" x2="${w}" y2="8" stroke="rgba(255,255,255,.06)"/><path d="${d} L${last[0].toFixed(1)} ${h-8} L${pts[0][0].toFixed(1)} ${h-8} Z" fill="rgba(255,255,255,.16)"/><path d="${d}" fill="none" stroke="#ffffff" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="#fff"/></svg><div class="lbl-row small muted" style="margin-top:4px"><span>Oldest</span><span class="num">Last: ${Math.round(vals[n-1]*100)}%</span></div>`}
A.openStep=el=>openPanel('step',el.dataset.id);
A.skStart=()=>{openSheet(`<div class="sh-h"><div class="sh-t">Before you roll</div><button class="sh-x" data-act="closeSheet">Cancel</button></div><div class="list">${SAFETY.map(s=>`<button class="fi" data-act="cb" data-i="${cb(el=>{const c=el.querySelector('.ck');c.classList.toggle('on');Snd.play(c.classList.contains('on')?'check':'uncheck')})}"><span class="ck">${ico('check')}</span><span class="fi-t" style="font-size:15px">${esc(s)}</span></button>`).join('')}</div><div class="sh-actions" style="margin-top:14px"><span class="sp"></span><button class="btn pri" data-act="skGo">${ico('play')}Start session</button></div>`)};
A.skGo=()=>{const L=liveDoc();const i=stepIdx();L.skate={start:Date.now(),cur:LADDER[allCleared()?LADDER.length-1:i].id,c:{},h:[]};saveLive();closeSheet(true);Snd.play('go');render()};
function skHit(land){const L=liveDoc();const s=L.skate;if(!s)return;s.c=s.c||{};const c=s.c[s.cur]=s.c[s.cur]||{a:0,l:0};c.a++;if(land)c.l++;s.h=(s.h||[]).concat([[s.cur,land?1:0]]).slice(-30);saveLive();Snd.play(land?'land':'tick');
  const sk=skateDoc();const j=LADDER.findIndex(x=>x.id===s.cur);if(land&&j===(sk.step||0)&&c.l>=LADDER[j].need){sk.step=j+1;sk.best[s.cur]=Math.max(sk.best[s.cur]||0,c.l);Store.touch('ko/skate');Snd.play('done');Waves.flash();toast(`${LADDER[j].n} cleared`,'ok',j+1<LADDER.length?`Next up: ${LADDER[j+1].n}`:'That is the kickflip. Legend.');queueTrophyCheck()}
  render()}
A.skTry=()=>skHit(false);

A.skUndo=()=>{const s=liveDoc().skate;if(!s||!(s.h||[]).length){Snd.play('err');return}const [id,l]=s.h.pop();const c=s.c[id];if(c){c.a=Math.max(0,c.a-1);if(l)c.l=Math.max(0,c.l-1)}saveLive();Snd.play('back');render()};
A.pickTrick=()=>{const sk=skateDoc();const avail=LADDER.filter((s,j)=>j<=(sk.step||0));openOpts('Practice',avail.map(s=>({label:s.n,icon:s.id===liveDoc().skate.cur?'check':'board',fn:()=>{liveDoc().skate.cur=s.id;saveLive()}})))};
A.skEnd=()=>{const L=liveDoc();const s=L.skate;if(!s)return;const end=Date.now();const tot=Object.values(s.c||{}).reduce((m,x)=>({a:m.a+x.a,l:m.l+x.l}),{a:0,l:0});
  if(tot.a){const sk=skateDoc();sk.att=(sk.att||0)+tot.a;sk.lands=(sk.lands||0)+tot.l;for(const k in s.c)sk.best[k]=Math.max(sk.best[k]||0,s.c[k].l);Store.touch('ko/skate');const sid=uid();pushSession('skate',{id:sid,date:ymd(new Date(s.start)),start:s.start,end,c:s.c});Snd.play('done');toast('Session saved','ok',`${tot.l} of ${tot.a} landed · ${fmtDur(end-s.start)}`);gainWorkout('skate:'+sid,Math.round((end-s.start)/60000),'Skate session')}
  else{Snd.play('back');toast('Nothing logged, session discarded')}

/* lift player */
function liftNew(wid){const warm=S().warmup!==false;const L={wid,start:Date.now(),sets:[]};if(warm){L.phase='warm';L.wi=0;L.endAt=Date.now()+WARMUP[0][1]*1000}else liftBegin(L);return L}
function liftBegin(L){const w=WORKOUTS[L.wid];if(w.circuit){L.phase='work';L.round=1;L.st=0;L.endAt=Date.now()+w.circuit.work*1000}else{L.phase='work';L.ei=0;L.si=0}L.wi=null}
PANELS.workout=pn=>{const w=WORKOUTS[pn.id];if(!w)return null;let b='';
  if(w.circuit){const c=w.circuit;b=`<section><p class="muted">${esc(w.sub)}. ${c.rounds} rounds of ${c.stations.length} moves, ${c.work} seconds on and ${c.rest} off, ${c.roundRest} seconds between rounds. About ${Math.round((c.rounds*c.stations.length*(c.work+c.rest)+(c.rounds-1)*c.roundRest)/60)} minutes. Use one dumbbell you could press about 12 times.</p></section><section><div class="lbl">Stations</div><div class="list">${c.stations.map((s,i)=>rowHtml({act:'noop',iconHtml:`<b class="num">${i+1}</b>`,t:s,s:`${c.work}s`})).join('')}</div></section>`}
  else b=`<section><p class="muted">${esc(w.sub)}. Weights come from your last session.</p></section><section><div class="list">${w.ex.map(id=>{const e=EX[id];const sg=suggest(id);return rowHtml({act:'noop',icon:e.eq==='Bodyweight'?'user':'dumbbell',t:e.n,s:`${e.sets} × ${e.lo===e.hi?e.hi:e.lo+' to '+e.hi}${e.unit==='s'?' sec':''}${e.each?' each side':''} · ${e.eq}${sg.w?` · ${sg.w}kg`:''}`})}).join('')}</div></section>`;
  b+=`<section class="btns"><button class="btn pri" data-act="liftStart" data-id="${w.id}">${ico('play')}Start${S().warmup!==false?' with warmup':''}</button></section>`;
  return{title:w.n,back:'Fitness',body:b}};
PANELS.player=()=>{const L=liveDoc().lift;if(!L)return null;const w=WORKOUTS[L.wid];const left=L.paused!=null?L.paused:Math.max(0,(L.endAt||0)-Date.now());let b='';
  if(L.phase==='warm'){const [n,sec]=WARMUP[L.wi];b=`<section class="restbox"><div class="lbl">Warmup ${L.wi+1} of ${WARMUP.length}</div><div class="player-ex" style="text-align:center">${esc(n)}</div><div class="ringbox">${ring(1-left/(sec*1000),200,8)}<div class="rt"><div><b data-cd>${fmtMS(left)}</b><small>Warmup</small></div></div></div><div class="muted small">Next: ${L.wi+1<WARMUP.length?esc(WARMUP[L.wi+1][0]):'Workout'}</div></section><section class="btns" style="justify-content:center"><button class="btn" data-act="warmNext">Next</button><button class="btn ghost" data-act="warmSkip">Skip warmup</button></section>`}
  else if(w.circuit){const c=w.circuit;const tot=L.phase==='work'?c.work:L.phase==='rest'?c.rest:c.roundRest;const nm=L.phase==='work'?c.stations[L.st]:L.phase==='rest'?'Rest':'Round break';const nx=L.phase==='work'?(L.st+1<c.stations.length?c.stations[L.st+1]:(L.round<c.rounds?'Round break':'Done')):c.stations[L.phase==='roundRest'?0:Math.min(L.st+1,c.stations.length-1)];
    b=`<section class="restbox"><div class="lbl">Round ${L.round} of ${c.rounds} · move ${L.st+1} of ${c.stations.length}</div><div class="player-ex" style="text-align:center;${L.phase!=='work'?'color:var(--dim)':''}">${esc(nm)}</div><div class="ringbox">${ring(1-left/(tot*1000),200,8)}<div class="rt"><div><b data-cd>${fmtMS(left)}</b><small>${L.phase==='work'?'Go':'Breathe'}</small></div></div></div><div class="muted">Next: ${esc(nx)}</div></section>
    <section class="btns" style="justify-content:center"><button class="btn" data-act="cPause">${L.paused!=null?ico('play')+'Resume':ico('pause')+'Pause'}</button><button class="btn ghost" data-act="cSkip">Skip</button></section>`}
  else{const id=w.ex[L.ei];const e=EX[id];const sg=suggest(id);const done=L.sets.filter(x=>x.ex===id);const bw=!e.inc;const u=e.unit==='s'?'sec':(e.each?'reps each':'reps');
    if(L.phase==='rest'){const nextEx=EX[w.ex[L.ei]];b+=`<section class="restbox"><div class="lbl">Rest</div><div class="ringbox">${ring(1-left/((L.restFor||60)*1000),200,8)}<div class="rt"><div><b data-cd>${fmtMS(left)}</b><small>Rest</small></div></div></div><div class="muted">Next: ${esc(nextEx.n)}, set ${L.si+1}</div><button class="btn" data-act="restSkip">Skip rest</button></section>`}
    b+=`<section style="display:grid;gap:6px"><div class="lbl">Exercise ${L.ei+1} of ${w.ex.length} · ${esc(e.eq)}</div><div class="player-ex">${esc(e.n)}</div><div class="muted">${esc(e.cue)}</div><div class="chips" style="margin-top:6px"><span class="chip acc">${e.sets} × ${e.lo===e.hi?e.hi:e.lo+' to '+e.hi} ${u}</span><span class="chip">${esc(sg.note)}</span></div></section>
    <section>${Array.from({length:e.sets},(_,k)=>{const d=done[k];const isCur=!d&&k===done.length;return `<div class="setrow ${d?'done':''}"><span class="sn">${k+1}</span>${bw?`<span class="muted small" style="text-align:center">Body</span>`:`<input class="in" id="w_${k}" type="number" inputmode="decimal" step="0.5" value="${d?d.w:(done.length?done[done.length-1].w:(sg.w??''))}" placeholder="kg" ${d?'disabled':''} aria-label="Weight in kg">`}<input class="in" id="r_${k}" type="number" inputmode="numeric" value="${d?d.r:(done.length?done[done.length-1].r:sg.r)}" ${d?'disabled':''} aria-label="${u}"><button class="ck ${d?'on':''}" data-act="${d?'noop':isCur?'setLog':'noop'}" data-k="${k}" ${!d&&!isCur?'style="opacity:.3"':''} aria-label="Log set">${ico('check')}</button></div>`}).join('')}<div class="setrow"><span></span><span class="muted small" style="text-align:center">${bw?'':'kg'}</span><span class="muted small" style="text-align:center">${u}</span><span></span></div></section>
    <section class="btns">${L.ei>0?`<button class="btn ghost" data-act="exPrev">${ico('back')}Previous</button>`:''}${L.ei<w.ex.length-1?`<button class="btn ghost" data-act="exNext">Skip exercise${ico('next')}</button>`:''}</section>`}
  b+=`<section class="btns" style="margin-top:8px"><button class="btn danger" data-act="cb" data-i="${cb(el=>{if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Tap again to discard';Snd.play('err');return}liveDoc().lift=null;saveLive();view.panel=null;$('#panel').hidden=true;Snd.play('back');render()})}">Discard</button><span style="flex:1"></span><button class="btn pri" data-act="liftFinish">${ico('check')}Finish</button></section>`;
  return{title:w.n,back:'Fitness',body:b}};
function liftAdvance(){const L=liveDoc().lift;if(!L)return;const w=WORKOUTS[L.wid];const now=Date.now();
  if(L.phase==='warm'){L.wi++;if(L.wi>=WARMUP.length){liftBegin(L);Snd.play('go')}else{L.endAt=now+WARMUP[L.wi][1]*1000;Snd.play('go')}}
  else if(w&&w.circuit){const c=w.circuit;
    if(L.phase==='work'){if(L.st+1<c.stations.length){L.phase='rest';L.endAt=now+c.rest*1000}else if(L.round<c.rounds){L.phase='roundRest';L.endAt=now+c.roundRest*1000}else{L.complete=true;saveLive();liftFinish(true);return}Snd.play('beep')}
    else if(L.phase==='rest'){L.phase='work';L.st++;L.endAt=now+c.work*1000;Snd.play('go')}
    else{L.phase='work';L.round++;L.st=0;L.endAt=now+c.work*1000;Snd.play('go')}}
  else if(L.phase==='rest'){L.phase='work';L.endAt=null;Snd.play('go')}
  saveLive();renderPanel()}
function liftFinish(auto){const L=liveDoc().lift;if(!L)return;const w=WORKOUTS[L.wid];const end=Date.now();
  if(!w.circuit&&!L.sets.length&&!auto){toast('Log at least one set first','err');return}
  const pr=prDoc();let newPr=[];
  if(!w.circuit)for(const s of L.sets){const e=EX[s.ex];const best=pr[s.ex];const score=e.inc?(s.w||0)*1000+s.r:s.r;const bs=best?(e.inc?(best.w||0)*1000+best.r:best.r):-1;if(s.r>=(e.amrap?1:e.lo)&&score>bs){if(best)newPr.push(e.n);pr[s.ex]={w:s.w||null,r:s.r,date:ymd(new Date())}}}
  if(Object.keys(pr).length)Store.touch('ko/prs');const sid=uid();
  pushSession('lift',{id:sid,date:ymd(new Date(L.start)),wid:L.wid,start:L.start,end,sets:L.sets,complete:!!L.complete||!w.circuit});
  liveDoc().lift=null;saveLive();view.panel=null;$('#panel').hidden=true;Snd.play('done');Waves.flash();
  toast(w.circuit?(L.complete?'DEAD Circuit done':'Circuit saved'):`${w.n} done`,'ok',`${fmtDur(end-L.start)}${newPr.length?` · new best: ${newPr.slice(0,2).join(', ')}`:''}`);
  gainWorkout('lift:'+sid,Math.round((end-L.start)/60000),w.n);queueTrophyCheck();render()}
A.openWorkout=el=>openPanel('workout',el.dataset.id);
A.liftStart=el=>{const L=liveDoc();if(L.lift&&L.lift.wid!==el.dataset.id){toast('Finish or discard the workout in progress first','err');openPanel('player');return}if(!L.lift)L.lift=liftNew(el.dataset.id);saveLive();Snd.play('go');view.panel={type:'player'};const p=$('#panel');p.dataset.key='';p.removeAttribute('style');p.hidden=true;renderPanel()};
A.warmNext=()=>liftAdvance();
A.warmSkip=()=>{const L=liveDoc().lift;liftBegin(L);saveLive();Snd.play('go');renderPanel()};
A.setLog=el=>{const L=liveDoc().lift;const w=WORKOUTS[L.wid];const id=w.ex[L.ei];const e=EX[id];const k=+el.dataset.k;const wv=document.getElementById('w_'+k);const rv=document.getElementById('r_'+k);const r=Math.round(+((rv&&rv.value)||0));const wt=e.inc?Math.round((+((wv&&wv.value)||0))*10)/10:null;
  if(!r){toast(e.unit==='s'?'Add the seconds':'Add your reps','err');return}if(e.inc&&!wt){toast('Add the weight','err');return}
  L.sets.push({ex:id,w:wt,r});const done=L.sets.filter(x=>x.ex===id).length;Snd.play('check');
  const lastEx=L.ei>=w.ex.length-1;if(done>=e.sets){if(lastEx){saveLive();renderPanel();toast('Last set done','ok','Tap Finish to save');return}L.ei++;L.si=0}else L.si=done;
  L.phase='rest';L.restFor=e.rest;L.endAt=Date.now()+e.rest*1000;saveLive();renderPanel()};
A.restSkip=()=>liftAdvance();
A.exNext=()=>{const L=liveDoc().lift;L.ei=Math.min(WORKOUTS[L.wid].ex.length-1,L.ei+1);L.si=0;L.phase='work';L.endAt=null;saveLive();Snd.play('move');renderPanel()};
A.exPrev=()=>{const L=liveDoc().lift;L.ei=Math.max(0,L.ei-1);L.phase='work';L.endAt=null;saveLive();Snd.play('move');renderPanel()};
A.cPause=()=>{const L=liveDoc().lift;if(L.paused!=null){L.endAt=Date.now()+L.paused;L.paused=null;Snd.play('go')}else{L.paused=Math.max(0,L.endAt-Date.now());Snd.play('back')}saveLive();renderPanel()};
A.cSkip=()=>{const L=liveDoc().lift;if(L.paused!=null){L.paused=null}liftAdvance()};
A.liftFinish=()=>liftFinish(false);

RENDER.fitness=()=>{const T=view.fitTab;let h=`<section class="lbl-row"><div class="lbl">Fitness</div><button class="btn sm pri" data-act="fitLog">${ico('plus')}Log a workout</button></section>${tabsHtml('fitTab',[['train','Train'],['plan','Plan'],['log','Log']])}`;

    h+=`<section class="plate"><div class="lbl">XP for workouts</div><div class="xpt-grid"><span>Under 15 min</span><b>35</b><span>15 to 29 min</span><b>50</b><span>30 to 44 min</span><b>70</b><span>45 to 59 min</span><b>85</b><span>60 min or more</span><b>100</b></div><p class="muted small" style="margin:8px 0 0">Up to two sessions a day earn XP. Extra sessions still save to your log.</p></section>`}
  else if(T==='plan'){const mon=mondayOf(new Date());const order=[1,2,3,4,5,6,0];
    h+=`${weekBlock(mon,weekStats(mon))}<section><div class="lbl">Every week</div><div class="list">${order.map(k=>{const acts=(plan()[String(k)]||[]).filter(a=>ACTS[a]);return rowHtml({act:'dayOpts',data:`data-k="${k}"`,icon:acts[0]?ACTS[acts[0]].icon:'moon',t:DOWL[k],s:acts.map(a=>ACTS[a].n).join(' + ')||'Rest'})}).join('')}</div></section>
    <section class="plate"><div class="lbl">How this plan works</div><ul class="tips"><li>Skate little and often. Short sessions beat one long one for learning tricks.</li><li>Lifts on Monday, Wednesday and Friday with a day between, so your legs recover.</li><li>Thursday is boxing. Swap any day for padel or a walk, it all counts.</li><li>Sunday is rest. That is when you get stronger.</li><li>A missed day is just a missed day. Pick it up tomorrow.</li></ul></section>
    ${S().plan?`<section class="btns"><button class="btn ghost" data-act="planReset">Back to the default plan</button></section>`:''}`}
  else{const ss=sessionsOf('skate'),ls=sessionsOf('lift'),fl=fitDoc().list,sk=skateDoc(),pr=prDoc();const all=fitAll();const days=new Set(all.map(x=>ymd(new Date(x.at))));const mins=all.reduce((a,x)=>a+(x.k==='log'?(x.s.min||0):Math.round(((x.s.end||x.s.start)-x.s.start)/60000)),0);
    h+=`<section class="kv"><div><small>Active days</small><b>${days.size}</b></div><div><small>Sessions</small><b>${all.length}</b></div><div><small>Hours</small><b>${(mins/60).toFixed(1)}</b></div><div><small>Skate tries</small><b>${sk.att||0}</b></div></section>
    <section><div class="lbl">Best lifts</div>${Object.keys(pr).length?`<div class="rtable">${Object.keys(pr).filter(k=>EX[k]).map(k=>`<div class="rt-row"><span>${esc(EX[k].n)}<small>${fmtDM(parseYmd(pr[k].date))}</small></span><span class="num">${pr[k].w?pr[k].w+'kg':''}</span><span class="num">${pr[k].r}${EX[k].unit==='s'?'s':' reps'}</span></div>`).join('')}</div>`:'<p class="empty">Your bests show up after your first lift.</p>'}</section>

const rankList=kind=>kind==='film'?filmsDoc().rank:musicDoc().rank[kind.split(':')[1]];

function rankFlow(kind,id){if(view.quietRank&&Date.now()<view.quietRank){rankClean(kind);return}const R=rankClean(kind);const i=R.indexOf(id);if(i>=0)R.splice(i,1);if(!R.length){R.push(id);rankSave(kind);render();return}view.rank={kind,id,lo:0,hi:R.length};rankAsk()}
function rankAsk(){const st=view.rank;if(!st)return;const R=rankList(st.kind);

  const mid=Math.floor((st.lo+st.hi)/2);st.mid=mid;const a=rankItem(st.kind,st.id),b=rankItem(st.kind,R[mid]);if(!a||!b){view.rank=null;closeSheet(true);return}
  const left=Math.ceil(Math.log2(st.hi-st.lo+1));const sub=x=>metaLine([x.year,x.artist,x.rating!=null?`${fmtR(x.rating)}/10`:''].filter(Boolean));
  openSheet(`<div class="sh-h"><div class="sh-t">Which is better?</div><button class="sh-x" data-act="rankSkip">Skip</button></div>
  <div class="vs"><button class="vsb" data-act="rankPick" data-w="new">${tile(a.title,'',a.art,!!a.format)}<b>${esc(a.title)}</b><small>${esc(sub(a))}</small><em>New</em></button><span class="vs-or">VS</span><button class="vsb" data-act="rankPick" data-w="old">${tile(b.title,'',b.art,!!b.format)}<b>${esc(b.title)}</b><small>${esc(sub(b))}</small><em>#${mid+1}</em></button></div>
  <div class="btns" style="justify-content:center;margin-top:12px"><button class="btn ghost sm" data-act="rankPick" data-w="tie">Too close to call</button></div><p class="muted small" style="text-align:center;margin:10px 0 0">At most ${plural(left,'more pick')}. Skip places it by rating.</p>`)}

A.rankSkip=()=>{const st=view.rank;if(!st){closeSheet();return}const R=rankList(st.kind);const me=rankItem(st.kind,st.id);const r=me&&me.rating!=null?me.rating:0;let at=R.findIndex(id=>{const x=rankItem(st.kind,id);return(x&&x.rating!=null?x.rating:0)<r});if(at<0)at=R.length;st.lo=at;st.hi=at;rankAsk()};

RENDER.cinema=()=>{const D=filmsDoc();const T=view.fTab;const w=D.list.filter(f=>f.status==='watchlist').length,wd=D.list.filter(f=>f.status==='watched').length;

const mediaName=m=>(MEDIA.find(x=>x[0]===m)||[,''])[1];

function rlPool(){const f=view.rl;return PROMPTS.filter(p=>(!f.m||p.m===f.m)&&(!f.t||p.t<=+f.t)&&(!f.e||(f.e==='low'?p.e==='low':f.e==='med'?p.e!=='high':true))&&(!f.p||p.p===f.p||p.p==='any'))}
const rlSeg=(k,items)=>`<div class="seg rlseg"><button class="${!view.rl[k]?'on':''}" data-act="rlSet" data-k="${k}" data-v="">Any</button>${items.map(([v,l])=>`<button class="${view.rl[k]===v?'on':''}" data-act="rlSet" data-k="${k}" data-v="${v}">${l}</button>`).join('')}</div>`;
function promptCard(p,i,actions=true){return `<section class="rcard" id="rcard"><div class="chips"><span class="chip acc">${esc(mediaName(p.m))}</span><span class="chip">${p.t>=120?'2 hours or more':p.t+' min'}</span><span class="chip">${esc((ENERGY.find(e=>e[0]===p.e)||[,''])[1])} energy</span><span class="chip">${p.p==='in'?'Indoors':p.p==='out'?'Outdoors':'Anywhere'}</span></div>
  <h3>${esc(p.title)}</h3><p>${esc(p.brief)}</p><div class="rc-k"><small>The constraint</small><p>${esc(p.rule)}</p></div><div class="rc-k"><small>Finish with</small><p>${esc(p.out)}</p></div>
  ${actions?`<div class="btns"><button class="btn pri" data-act="rlQuest" data-i="${i}">${ico('quest')}Make it a quest</button><button class="btn" data-act="rlSave" data-i="${i}">${ico('save')}Save idea</button><button class="btn ghost" data-act="rlSpin">${ico('dice')}Reroll</button></div>`:''}</section>`}
function ideaRow(x){return `<button class="idea ${x.arch?'arch':''}" data-act="ideaOpts" data-id="${x.id}"><span class="idea-t">${esc(x.text)}</span><span class="chips"><span class="chip">${esc(x.cat)}</span><span class="chip">${fmtDM(new Date(x.created))}</span>${x.arch?'<span class="chip">Archived</span>':''}</span></button>`}
function ideaListHtml(){const q=norm(view.ideaQ);const L=ideasDoc().list.filter(x=>!!x.arch===!!view.ideaArch&&(!view.ideaC||x.cat===view.ideaC)&&(!q||norm(x.text+' '+x.cat).includes(q))).sort((a,b)=>b.created-a.created);
  return L.length?`<div class="ideas">${L.map(ideaRow).join('')}</div>`:`<p class="empty">${view.ideaArch?'No archived ideas.':(q||view.ideaC)?'Nothing matches.':'Your vault is empty. Capture the next idea the second you have it.'}</p>`}
RENDER.studio=()=>{const T=view.sTab;const n=ideasDoc().list.filter(x=>!x.arch).length;let h=`<section class="lbl-row"><div class="lbl">Creative studio</div></section>${tabsHtml('sTab',[['roulette','Roulette'],['vault','Ideas vault',n]])}`;
  if(T==='roulette'){const pool=rlPool();const p=view.spin!=null?PROMPTS[view.spin]:null;
    h+=`<section class="rlf"><div class="lbl">Medium</div>${rlSeg('m',MEDIA)}<div class="lbl">Time you have</div>${rlSeg('t',[['15','15 min'],['30','30 min'],['60','1 hour'],['120','2 hours+']])}<div class="lbl">Energy</div>${rlSeg('e',ENERGY)}<div class="lbl">Where</div>${rlSeg('p',[['in','Indoors'],['out','Outdoors']])}</section>
    <section class="btns"><button class="btn pri wide spinbtn" data-act="rlSpin" ${pool.length?'':'disabled'}>${ico('dice')}${pool.length?`Spin · ${pool.length} ideas`:'No ideas match, loosen a filter'}</button></section>`;
    h+=p?promptCard(p,view.spin):`<section class="rcard ghost"><h3>Spin for a brief</h3><p class="muted">Every prompt comes with a clear brief, a constraint that makes it interesting, and a finish line you can actually reach today.</p></section>`}
  else{h+=`<section><div class="qadd"><input class="in" id="ideaIn" placeholder="An idea, a hook, a film concept" autocomplete="off" data-enter="ideaAdd"><select class="in ideacat" id="ideaCat" aria-label="Category">${IDEA_CATS.map(c=>`<option ${c===(view.ideaC||'Idea')?'selected':''}>${esc(c)}</option>`).join('')}</select><button class="btn pri" data-act="ideaAdd">Add</button></div><p class="muted small" style="margin:6px 0 0">25 XP for each new idea, up to 3 a day.</p></section>
    <section class="filters"><input class="in srch" placeholder="Search ideas" value="${esc(view.ideaQ)}" data-in="ideaQ" autocomplete="off">${filterChips('ideaC',IDEA_CATS.map(c=>[c,c]),'All')}<div class="btns" style="margin-top:6px"><button class="chip ${view.ideaArch?'on':''}" data-act="ideaArchView">${ico('archive')}${view.ideaArch?'Showing archive':'Archive'}</button></div></section><section id="ideaList">${ideaListHtml()}</section>`}
  return h};
IN.ideaQ=el=>{view.ideaQ=el.value;const b=$('#ideaList');if(b)b.innerHTML=ideaListHtml()};
A.rlSet=el=>{view.rl[el.dataset.k]=el.dataset.v;Snd.play('tick');render()};
A.rlSpin=()=>{const pool=rlPool();if(!pool.length)return;let n=0;const btn=$('.spinbtn');const card=$('#rcard');const steps=9;const pick=pool[Math.floor(Math.random()*pool.length)];
  const t=setInterval(()=>{n++;const p=pool[Math.floor(Math.random()*pool.length)];Snd.play('tick');if(card){card.classList.add('spinning');const h3=card.querySelector('h3');if(h3)h3.textContent=p.title}if(n>=steps){clearInterval(t);view.spin=PROMPTS.indexOf(pick);Snd.play('open');render()}},75);if(btn)btn.disabled=true};
A.rlSave=el=>{const p=PROMPTS[+el.dataset.i];if(!p)return;const L=ideasDoc().list;const text=`${p.title}. ${p.brief} Constraint: ${p.rule} Finish with: ${p.out}`;if(L.some(x=>x.text===text)){toast('Already in your vault');return}L.push({id:uid(),text,cat:'Creative prompt',created:Date.now(),src:'roulette'});Store.touch('ideas/list');Snd.play('add');toast('Saved to your vault','ok',p.title)};
A.rlQuest=el=>{const p=PROMPTS[+el.dataset.i];if(!p)return;questForm(null,{title:p.title,desc:`${p.brief} Constraint: ${p.rule}`,skill:p.m==='car'?'exp':'cre',diff:p.t>=120?'boss':p.t>=60?'standard':'quick',ms:['Plan it',`Make it (${p.rule.replace(/\.$/,'')})`,p.out.replace(/\.$/,'')],src:'roulette'})};

A.ideaAdd=()=>{const i=$('#ideaIn');const t=(i&&i.value||'').trim();if(!t){Snd.play('err');return}const cat=($('#ideaCat')||{}).value||'Idea';addIdea(t,cat);i.value='';const b=$('#ideaList');if(b)b.innerHTML=ideaListHtml()};
function addIdea(text,cat){const x={id:uid(),text,cat,created:Date.now()};ideasDoc().list.push(x);Store.touch('ideas/list');Snd.play('add');gain({k:'idea:'+x.id,t:'idea',xp:XP.idea,skill:'cre',label:'New idea'})||toast('Idea saved','ok',cat);queueTrophyCheck();return x}
A.ideaArchView=()=>{view.ideaArch=!view.ideaArch;Snd.play('tick');render()};
A.ideaOpts=el=>{const x=findIn(ideasDoc().list,el.dataset.id);if(!x)return;openOpts(x.text.length>40?x.text.slice(0,40)+'…':x.text,[
  {label:'Edit',icon:'edit',fn:()=>setTimeout(()=>openForm({title:'Edit idea',fields:[{key:'text',label:'Idea',type:'textarea',rows:5,value:x.text},{key:'cat',label:'Category',type:'select',value:x.cat,options:IDEA_CATS.map(c=>({v:c,l:c}))}],onSave:v=>{if(!v.text)return false;x.text=v.text;x.cat=v.cat;Store.touch('ideas/list')}}),40)},
  {label:'Turn into a quest',icon:'quest',fn:()=>setTimeout(()=>questForm(null,{title:x.text.split(/[.\n]/)[0].slice(0,70),desc:x.text,skill:x.cat==='Car project'?'exp':'cre',diff:'standard',ms:[],src:x.src==='roulette'?'roulette':undefined}),40)},
  {label:x.arch?'Unarchive':'Archive',icon:'archive',fn:()=>{x.arch=!x.arch;Store.touch('ideas/list')}},

const focusLeft=r=>r.paused!=null?r.paused:Math.max(0,r.endAt-Date.now());
const focusElapsed=r=>Math.max(0,r.dur-focusLeft(r));
const FPRESETS=[15,25,45,60,90];
RENDER.focus=()=>{const D=focusDoc(),r=D.run,today=ymd(new Date());const tl=D.list.filter(f=>f.date===today);const tMin=tl.reduce((a,f)=>a+(f.min||0),0);const all=D.list.reduce((a,f)=>a+(f.min||0),0);
  let h=`<section class="lbl-row"><div class="lbl">Focus</div></section>`;
  if(r){const left=focusLeft(r);h+=`<section class="restbox focusbox"><div class="lbl">${r.paused!=null?'Paused':'Focusing'}</div><div class="player-ex" style="text-align:center">${esc(r.task||'Deep work')}</div><div class="ringbox">${ring(1-left/r.dur,220,8)}<div class="rt"><div><b data-fcd>${fmtMS(left)}</b><small>of ${Math.round(r.dur/60000)} min</small></div></div></div>
    <div class="seg amb">${AMB.map(([k,l])=>`<button class="${(S().amb||'off')===k?'on':''}" data-act="ambSet" data-k="${k}">${l}</button>`).join('')}</div><div class="btns" style="justify-content:center"><button class="btn" data-act="fPause">${r.paused!=null?ico('play')+'Resume':ico('pause')+'Pause'}</button><button class="btn pri" data-act="fFinish">${ico('check')}Finish now</button></div><button class="btn sm ghost" data-act="fCancel">Cancel session</button></section>`}
  else{const p=view.fPreset||25;h+=`<section class="plate" style="display:grid;gap:14px"><label class="field"><span>What are you working on?</span><input class="in" id="fTask" placeholder="Edit the Cortex reel" value="${esc(view.fTask||'')}" data-in="fTaskIn" data-enter="fStart" autocomplete="off"></label>
    <div class="seg">${FPRESETS.map(m=>`<button class="${p===m?'on':''}" data-act="fPreset" data-m="${m}">${m} min</button>`).join('')}</div><div><div class="lbl">Soundscape</div><div class="seg amb">${AMB.map(([k,l])=>`<button class="${(S().amb||'off')===k?'on':''}" data-act="ambSet" data-k="${k}">${l}</button>`).join('')}</div></div><div class="btns"><button class="btn pri wide" data-act="fStart">${ico('play')}Start ${p} minutes · ${focusXP(p)} XP</button></div></section>`}
  h+=`<section class="kv"><div><small>Today</small><b>${fmtHrs(tMin)}</b></div><div><small>Sessions</small><b>${D.list.length}</b></div><div><small>All time</small><b>${(all/60).toFixed(1)}h</b></div></section>
  <section><div class="lbl">History</div>${D.list.length?`<div class="list">${D.list.slice().sort((a,b)=>b.start-a.start).slice(0,20).map(f=>rowHtml({act:'fOpen',data:`data-id="${f.id}"`,icon:f.done?'check':'focus',iconCls:f.done?'ok':'',t:f.task||'Deep work',s:`${fmtD(new Date(f.start))} · ${f.min} of ${f.planned} min${f.done?'':' · ended early'}`})).join('')}</div>`:'<p class="empty">Finished sessions show up here.</p>'}</section>
  <section class="plate note"><div class="lbl">Good to know</div><p class="muted small" style="margin:0">The timer runs on the clock, so it stays exact if you switch apps or lock your phone, and it catches up the moment you come back. The end chime only plays while SIDEQUEST is open, because a web app can not ring while it is closed. For an alarm you can not miss, set an iPhone timer as well. Up to 4 sessions a day earn XP, from 30 to 120 depending on length. Sessions under 10 minutes still save.</p></section>`;return h};
IN.fTaskIn=el=>{view.fTask=el.value};
A.fPreset=el=>{view.fPreset=+el.dataset.m;const t=$('#fTask');if(t)view.fTask=t.value;Snd.play('tick');render()};
A.fStart=()=>{const D=focusDoc();if(D.run)return;const t=$('#fTask');const task=(t&&t.value||view.fTask||'').trim();const m=view.fPreset||25;const now=Date.now();D.run={id:uid(),task,start:now,dur:m*60000,endAt:now+m*60000,paused:null};view.fTask='';Store.touch('sq/focus');Snd.play('go');if(S().amb&&S().amb!=='off')Amb.play(S().amb);render()};
A.fPause=()=>{const r=focusDoc().run;if(!r)return;if(r.paused!=null){r.endAt=Date.now()+r.paused;r.paused=null;Snd.play('go')}else{r.paused=Math.max(0,r.endAt-Date.now());Snd.play('back')}if(r.paused!=null)Amb.stop();else if(S().amb&&S().amb!=='off')Amb.play(S().amb);Store.touch('sq/focus');render()};
A.fFinish=()=>focusComplete(true);
A.fCancel=el=>{if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Tap again to cancel, nothing is saved';Snd.play('err');return}focusDoc().run=null;Amb.stop();Store.touch('sq/focus');Snd.play('back');render()};
A.fOpen=el=>{const D=focusDoc();const f=findIn(D.list,el.dataset.id);if(!f)return;openForm({title:'Focus session',intro:`<p class="muted small" style="margin:0 0 12px">${fmtD(new Date(f.start))} · ${f.min} min</p>`,fields:[{key:'task',label:'Task',value:f.task}],onDelete:()=>{D.list.splice(D.list.indexOf(f),1);Store.touch('sq/focus')},onSave:v=>{f.task=v.task;Store.touch('sq/focus')}})};
function focusComplete(early){const D=focusDoc();const r=D.run;if(!r)return;const now=Date.now();const ms=early?focusElapsed(r):r.dur;const min=Math.round(ms/60000);const planned=Math.round(r.dur/60000);const done=!early||min>=planned*.9;
  D.list.push({id:r.id,task:r.task,start:r.start,end:now,min,planned,done,date:ymd(new Date(r.start))});D.run=null;Amb.stop();Store.touch('sq/focus');Snd.play('done');Waves.flash();
  toast(done?'Focus session complete':'Session saved','ok',`${min} min${r.task?' on '+r.task:''}`);if(min>=10)gain({k:'focus:'+r.id,t:'focus',xp:focusXP(min),skill:'foc',label:`Focused ${min} min${r.task?' on '+r.task:''}`});queueTrophyCheck();render()}

/* ================= SKY: golden hour, blue hour and the moon, worked out on the device ================= */
const LOC_DEFAULT={lat:25.2048,lon:55.2708,name:'Dubai'};
const loc=()=>{const l=S().loc;return l&&isFinite(l.lat)?l:LOC_DEFAULT};
function sunTimes(date,lat,lon){const rad=Math.PI/180;const N=Math.floor((new Date(date.getFullYear(),date.getMonth(),date.getDate())-new Date(date.getFullYear(),0,0))/864e5);const g=2*Math.PI/365*(N-1+.5);
  const eqt=229.18*(.000075+.001868*Math.cos(g)-.032077*Math.sin(g)-.014615*Math.cos(2*g)-.040849*Math.sin(2*g));
  const dec=.006918-.399912*Math.cos(g)+.070257*Math.sin(g)-.006758*Math.cos(2*g)+.000907*Math.sin(2*g)-.002697*Math.cos(3*g)+.00148*Math.sin(3*g);
  const tz=-new Date(date.getFullYear(),date.getMonth(),date.getDate(),12).getTimezoneOffset();const noon=720-4*lon-eqt+tz;
  const at=e=>{const c=(Math.sin(e*rad)-Math.sin(lat*rad)*Math.sin(dec))/(Math.cos(lat*rad)*Math.cos(dec));if(c<-1||c>1)return null;const H=Math.acos(c)/rad;return[noon-4*H,noon+4*H]};
  return{noon,rise:at(-.833),gold:at(6),gl:at(-4),blue:at(-6)}}
const minToDate=(d,m)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setMinutes(Math.round(m));return x};
const hm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
function moon(d){const syn=29.530588853;const ref=Date.UTC(2000,0,6,18,14);const age=((d.getTime()-ref)/864e5%syn+syn)%syn;const f=age/syn;const illum=(1-Math.cos(2*Math.PI*f))/2;
  const names=['New moon','Waxing crescent','First quarter','Waxing gibbous','Full moon','Waning gibbous','Last quarter','Waning crescent'];const name=names[Math.floor((f*8)+.5)%8];
  const toFull=((.5-f+1)%1)*syn;return{f,illum,name,age,toFull}}
function moonSvg(f,size=40){const r=size/2-2,c=size/2;const k=Math.cos(2*Math.PI*f);const waxing=f<.5;const rx=Math.abs(k)*r;
  const lit=waxing?`M${c} ${c-r} A${r} ${r} 0 0 1 ${c} ${c+r} A${rx} ${r} 0 0 ${k>0?0:1} ${c} ${c-r}`:`M${c} ${c-r} A${r} ${r} 0 0 0 ${c} ${c+r} A${rx} ${r} 0 0 ${k>0?1:0} ${c} ${c-r}`;
  return `<svg class="moon" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r}" fill="rgba(255,255,255,.12)"/><path d="${lit}" fill="#f4f1e6"/><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="rgba(255,255,255,.35)"/></svg>`}
function skyNow(){const now=new Date(),L=loc();const t=sunTimes(now,L.lat,L.lon);const m=moon(now);const nowM=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;let next=null;
  if(t.gold&&t.gl){const am=[t.gl[0],t.gold[0]],pm=[t.gold[1],t.gl[1]];const win=[['Morning golden hour',am],['Golden hour',pm]];for(const [n,w] of win){if(nowM<w[1]){next={n,a:minToDate(now,w[0]),b:minToDate(now,w[1]),live:nowM>=w[0]};break}}
    if(!next){const t2=sunTimes(addDays(now,1),L.lat,L.lon);if(t2.gl&&t2.gold)next={n:'Morning golden hour',a:minToDate(addDays(now,1),t2.gl[0]),b:minToDate(addDays(now,1),t2.gold[0]),live:false,tomorrow:true}}}
  return{t,m,next,L,rise:t.rise?minToDate(now,t.rise[0]):null,set:t.rise?minToDate(now,t.rise[1]):null,blueEnd:t.blue?minToDate(now,t.blue[1]):null}}
function skyCard(compact){const k=skyNow();const n=k.next;const inMs=n?n.a-Date.now():0;const m=k.m;
  const fullIn=m.toFull<1?'tonight':m.toFull<1.5?'tomorrow':`in ${Math.round(m.toFull)} days`;
  return `<section class="sky ${n&&n.live?'live':''}"><div class="sky-l"><div class="lbl">${n&&n.live?'Golden hour now':'Next golden hour'}${n&&n.tomorrow?' · tomorrow':''}</div>${n?`<b class="sky-t">${hm(n.a)} to ${hm(n.b)}</b><small>${n.live?`Ends in ${fmtDur(n.b-Date.now())}. Go shoot.`:inMs>0?`Starts in ${fmtDur(inMs)}`:''}</small>`:'<b class="sky-t">Not today</b>'}
  <div class="sky-row">${k.rise?`<span>${ico('today')}Sunrise ${hm(k.rise)}</span><span>${ico('moon')}Sunset ${hm(k.set)}</span>`:''}${k.blueEnd&&!compact?`<span>Blue hour until ${hm(k.blueEnd)}</span>`:''}</div></div>

  return `<div class="hm" style="--w:${weeks}">${cells}</div><div class="lbl-row" style="margin:6px 0 0"><span class="muted small">${active} active days in the last ${weeks} weeks</span><span class="hm-key"><i class="hm0"></i><i class="hm1"></i><i class="hm2"></i><i class="hm3"></i><i class="hm4"></i></span></div>`}

  const films=filmsDoc().list.filter(f=>f.status==='watched'&&inYd(f.watchedAt));const rk=filmsDoc().rank;const topFilms=films.slice().sort((a,b)=>{const ia=rk.indexOf(a.id),ib=rk.indexOf(b.id);return(ia<0?999:ia)-(ib<0?999:ib)||(b.rating||0)-(a.rating||0)}).slice(0,5);
  const games=gamesDoc().list.map(g=>({g,m:(g.sessions||[]).filter(s=>inYd(s.date)).reduce((a,s)=>a+(s.min||0),0)})).filter(x=>x.m).sort((a,b)=>b.m-a.m);
  const music=musicDoc().list.filter(m=>m.status==='listened'&&inYd(m.listenedAt||(m.ts?ymd(new Date(m.ts)):'')));const topMusic=music.slice().sort((a,b)=>(b.rating||0)-(a.rating||0)).slice(0,3);

/* ================= focus soundscape: made live on the device, nothing downloaded ================= */
const Amb={src:null,g:null,kind:null,
  make(kind){const c=Snd.ctx;if(!c)return;const len=c.sampleRate*4;const buf=c.createBuffer(2,len,c.sampleRate);for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;if(kind==='brown'||kind==='drive'){last=(last+.02*w)/1.02;d[i]=last*3.2}else d[i]=w*.5}}
    const s=c.createBufferSource();s.buffer=buf;s.loop=true;const f=c.createBiquadFilter();const g=c.createGain();g.gain.value=0;
    if(kind==='rain'){f.type='bandpass';f.frequency.value=1600;f.Q.value=.6}else if(kind==='drive'){f.type='lowpass';f.frequency.value=220}else{f.type='lowpass';f.frequency.value=900}
    s.connect(f);f.connect(g);g.connect(Snd.master);s.start();g.gain.linearRampToValueAtTime(kind==='drive'?.5:.32,c.currentTime+1.5);this.src=s;this.g=g;this.kind=kind;
    if(kind==='drive'){const o=c.createOscillator();o.type='sine';o.frequency.value=52;const og=c.createGain();og.gain.value=.05;o.connect(og);og.connect(g);o.start();this.osc=o}},
  play(kind){this.stop();if(!kind||kind==='off')return;Snd.init();if(Snd.ctx&&Snd.ctx.state==='suspended')Snd.ctx.resume();this.make(kind)},
  stop(){try{if(this.g&&Snd.ctx)this.g.gain.linearRampToValueAtTime(0,Snd.ctx.currentTime+.4);const s=this.src,o=this.osc;setTimeout(()=>{try{s&&s.stop();o&&o.stop()}catch(e){}},500)}catch(e){}this.src=null;this.g=null;this.osc=null;this.kind=null}};

const Dust=(()=>{const cv=document.createElement('canvas');cv.id='dust';cv.setAttribute('aria-hidden','true');$('#bg').after(cv);const cx=cv.getContext('2d');let w=0,h=0,P=[],raf=0,still=false,last=0;
  function size(){const d=Math.min(2,devicePixelRatio||1);w=innerWidth;h=innerHeight;cv.width=w*d;cv.height=h*d;cx.setTransform(d,0,0,d,0,0);if(!P.length)P=Array.from({length:Math.round(Math.min(46,w*h/16000))},()=>({x:Math.random()*w,y:Math.random()*h,r:.6+Math.random()*1.8,v:.08+Math.random()*.28,a:.15+Math.random()*.45,p:Math.random()*6.28}))}
  function draw(t){cx.clearRect(0,0,w,h);for(const p of P){const tw=.55+.45*Math.sin(t/900+p.p);cx.globalAlpha=p.a*tw;const g=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(255,255,255,0)');cx.fillStyle=g;cx.beginPath();cx.arc(p.x,p.y,p.r*4,0,6.283);cx.fill()}cx.globalAlpha=1}
  function loop(t){raf=0;if(t-last>40){last=t;for(const p of P){p.y-=p.v;p.x+=Math.sin(t/4000+p.p)*.12;if(p.y<-10){p.y=h+10;p.x=Math.random()*w}}draw(t)}if(!still&&!document.hidden)raf=requestAnimationFrame(loop)}
  addEventListener('resize',size);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!raf&&!still)raf=requestAnimationFrame(loop)});size();
  return{start(){still=matchMedia('(prefers-reduced-motion: reduce)').matches;if(!still&&!raf)raf=requestAnimationFrame(loop);else draw(0)},setStill(b){still=b;if(b){cancelAnimationFrame(raf);raf=0;draw(0)}else if(!raf)raf=requestAnimationFrame(loop)}}})();

  if(!r){inp.focus();toast('Tap the mic on your keyboard to talk','','Voice typing works there on iPhone')}}

A.backupShare=async()=>{const txt=JSON.stringify(backupObj());const mark=()=>{S().lastBackup=Date.now();saveS();render()};
  try{const f=new File([txt],`SIDEQUEST-backup-${ymd(new Date())}.json`,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'SIDEQUEST backup'});mark();toast('Backup saved','ok','Keep it in iCloud Drive');return}}catch(e){if(e&&e.name==='AbortError')return}
  await copyText(txt,'Backup copied');mark()};
A.backupCopy=()=>{copyText(JSON.stringify(backupObj()),'Backup copied');S().lastBackup=Date.now();saveS()};
function parseBackup(txt){let o;try{const t=String(txt||'');o=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1))}catch(e){return{err:'That is not a backup file'}}
  if(!o||typeof o!=='object'||!o.data||typeof o.data!=='object')return{err:'That backup has no data in it'};
  if(o.app!=='sidequest'&&o.app!=='kickflip-2000')return{err:o.app==='rrg-codex'?'That is an RRG CODEX backup. Restore it in CODEX':'That is not a SIDEQUEST or KICKFLIP backup'};
  const docs={};let bad=0;for(const p in o.data){const d=o.data[p];if(!SQ_PATH.test(p)||!d||typeof d!=='object'||Array.isArray(d)){bad++;continue}if(o.app==='kickflip-2000'&&(p==='ko/live'||p==='ko/settings'))continue;docs[p]=d}
  return{o,docs,bad,n:Object.keys(docs).length}}
function applyBackup(txt){const r=parseBackup(txt);if(r.err){toast(r.err,'err');return false}if(!r.n){toast('Nothing to restore in that file','err');return false}
  for(const p in r.docs){Store.data[p]=r.docs[p];Store.touch(p)}
  if(r.o.app==='kickflip-2000'){const ks=r.o.data['ko/settings'];if(ks){if(ks.plan)S().plan=ks.plan;if(ks.warmup===false)S().warmup=false}S().kfImported=Date.now();saveS();const n=Object.keys(r.docs).filter(p=>/^(skate|lift)\//.test(p)).reduce((a,p)=>a+((r.docs[p].sessions||[]).length),0);toast('KICKFLIP 2000 save imported','ok',`${plural(n,'session')}, your skate ladder and lifts`)}
  else toast('Backup restored','ok',`${plural(r.n,'item')} updated${r.bad?`, ${r.bad} skipped`:''}`);
  Snd.play('done');Waves.flash();queueTrophyCheck();render();return true}
A.backupRestore=()=>{openSheet(`<div class="sh-h"><div class="sh-t">Restore or import</div><button class="sh-x" data-act="closeSheet">Cancel</button></div><div class="fgrid"><p class="muted small" style="margin:0">Pick a SIDEQUEST backup, or a KICKFLIP 2000 backup to bring your skate ladder and lifts across. Anything with the same name here gets replaced. Your XP history stays.</p>
  <label class="btn pri" style="position:relative;overflow:hidden">${ico('doc')}Choose file<input type="file" id="restoreFile" accept=".json,.txt,application/json,text/plain" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label>
  <label class="field"><span>Or paste</span><textarea class="in" id="restoreBox" rows="6"></textarea></label><div class="btns"><button class="btn" data-act="cb" data-i="${cb(()=>{if(applyBackup($('#restoreBox').value)!==false)closeSheet(true)})}">Restore pasted text</button></div></div>`);

IN.srType=el=>{const q=norm(el.value);const out=$('#srOut');if(!out)return;if(q.length<2){out.innerHTML='';return}const has=t=>norm(t).includes(q);const R=[];const push=(icon,t,s,act,data)=>{if(R.length<40)R.push(rowHtml({act,data,icon,t,s}))};

  exploreDoc().list.filter(x=>has(x.title+' '+(x.area||''))).forEach(x=>push('pin',x.title,`Explore · ${x.status==='tried'?'tried':'to try'}`,'srGo',`data-k="explore" data-id="${x.id}"`));
  ideasDoc().list.filter(x=>has(x.text)).forEach(x=>push('vault',x.text.slice(0,60),`Idea · ${x.cat}`,'srGo',`data-k="idea" data-id="${x.id}"`));
  cdDoc().list.filter(x=>has(x.title)).forEach(x=>push('calendar',x.title,`Countdown · ${fmtDM(parseYmd(x.date))}`,'cdEdit',`data-id="${x.id}"`));
  garageDoc().missions.filter(x=>has(x.title)).forEach(x=>push('road',x.title,'Garage mission','srGo','data-k="garage"'));

A.srGo=el=>{const k=el.dataset.k,id=el.dataset.id;closeSheet(true);const go=c=>{const i=CATS.findIndex(x=>x.id===c);if(i!==view.cat){view.dir=i>view.cat?1:-1;view.cat=i;lsSet('sq.cat',c)}};

  if(!Store.ready)return;const L=liveDoc().lift;
