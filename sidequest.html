/* ================= Command line: say or type what you did, it files itself ================= */
const durMin=(n,u)=>{n=parseFloat(n);if(!isFinite(n))return null;return/^h/i.test(u||'')?Math.round(n*60):Math.round(n)};
function bestMatch(list,q,key='title'){const nq=norm(q);if(!nq)return null;let best=null,bs=0;for(const x of list){const t=norm(x[key]);if(!t)continue;let s=0;if(t===nq)s=100;else if(t.startsWith(nq)||nq.startsWith(t))s=70+Math.min(t.length,nq.length)/Math.max(t.length,nq.length)*20;else if(t.includes(nq)||nq.includes(t))s=50+Math.min(t.length,nq.length)/Math.max(t.length,nq.length)*20;if(s>bs){bs=s;best=x}}return bs>=55?best:null}
const tidy=s=>String(s||'').replace(/\s+/g,' ').replace(/^[\s,.:;-]+|[\s,.:;-]+$/g,'').trim();
const SMALLW=new Set(['of','the','in','to','a','an','and','on','at','for','by','with']);
const cap=s=>s.split(' ').map((w,i)=>(i===0||(w.length>1&&!SMALLW.has(w.toLowerCase())))&&/^[a-z]/.test(w)?w[0].toUpperCase()+w.slice(1):w).join(' ');
const cap1=s=>s?s[0].toUpperCase()+s.slice(1):s;
const DUR=/(\d+(?:\.\d+)?)\s*(h|hr|hrs|hour|hours|m|min|mins|minute|minutes)\b/i;
const RATE=/(?:^|\s)(\d{1,2}(?:\.\d)?)(?:\s*\/\s*10|\s*out of 10)?\s*$/i;
function parseCmd(raw){const t=tidy(raw);if(!t)return null;let m;const lo=t.toLowerCase();
  /* film watched */
  if((m=t.match(/^(?:watched|saw|just watched|finished watching)\s+(.+)$/i))){let rest=m[1],r=null;const rm=rest.match(RATE);if(rm&&+rm[1]<=10){r=+rm[1];rest=rest.slice(0,rm.index)}const title=tidy(rest);const ex=bestMatch(filmsDoc().list,title);return{kind:'film',title:ex?ex.title:cap(title),ex,rating:r,xp:ex&&ex.status==='watched'?0:XP.film,label:`Film watched${r!=null?` · ${fmtR(r)}/10`:''}`}}
  if((m=t.match(/^(?:want to watch|to watch|watchlist|add film|film)\s*:?\s+(.+)$/i)))return{kind:'filmAdd',title:cap(tidy(m[1])),xp:0,label:'Add to watchlist'};
  /* music */
  if((m=t.match(/^(?:listened to|listened|heard|played the album|album)\s+(.+)$/i))){let rest=m[1],r=null;const rm=rest.match(RATE);if(rm&&+rm[1]<=10){r=+rm[1];rest=rest.slice(0,rm.index)}let artist='';const bm=rest.match(/\s+by\s+(.+)$/i);if(bm){artist=cap(tidy(bm[1]));rest=rest.slice(0,bm.index)}let fmt='album';const fm=rest.match(/\b(ep|track|song|single|album)\b/i);if(fm){const w=fm[1].toLowerCase();fmt=w==='ep'?'ep':(w==='album'?'album':'track');rest=rest.replace(fm[0],'')}
    const title=tidy(rest);const ex=bestMatch(musicDoc().list,title);return{kind:'music',title:ex?ex.title:cap(title),artist:ex?ex.artist:artist,format:ex?ex.format:fmt,ex,rating:r,xp:ex&&ex.status==='listened'?0:(XP[ex?ex.format:fmt]||5),label:`${fmtName(ex?ex.format:fmt)} listened${r!=null?` · ${fmtR(r)}/10`:''}`}}
  /* workouts */
  const ACTW=[[/\bbox(ing)?\b|shadowbox/i,'Boxing'],[/\bpadel\b/i,'Padel'],[/\bwalk(ed|ing)?\b/i,'Walking'],[/\bran\b|\brun(ning)?\b|\bjog/i,'Run'],[/\bswim/i,'Swim'],[/\bmobility|stretch/i,'Mobility'],[/\bgym\b|\blift(ed|ing)?\b|\bstrength|weights|workout|trained/i,'Strength'],[/\bskat(e|ed|ing)\b/i,'Skate']];
  for(const [re,act] of ACTW){if(re.test(t)&&DUR.test(t)&&!/^(played|play|focus)/i.test(t)){const d=t.match(DUR);const min=durMin(d[1],d[2]);const notes=tidy(t.replace(d[0],'').replace(re,'').replace(/^(did|went|for|a|an)\s+/i,''));return{kind:'fit',act,min,notes,xp:workoutXP(min),label:`${act} · ${min} min`}}}
  /* games */
  if((m=t.match(/^(?:played|play|gamed|gaming)\s+(.+)$/i))){let rest=m[1];let min=null;const d=rest.match(DUR);let what='';if(d){min=durMin(d[1],d[2]);what=tidy(rest.slice(d.index+d[0].length).replace(/^(and|,|then|-)\s*/i,''));rest=rest.slice(0,d.index).replace(/\s+for\s*$/i,'')}
    const title=tidy(rest);const ex=bestMatch(gamesDoc().list,title);return{kind:'game',title:ex?ex.title:cap(title),ex,min:min||60,what,xp:ex&&hasKey(`journal:${ex.id}:${ymd(new Date())}`)?0:XP.journal,label:`Game session · ${fmtHrs(min||60)}${what?' · '+what:''}`}}
  if((m=t.match(/^(?:finished|beat|completed)\s+(.+)$/i))){const ex=bestMatch(gamesDoc().list,m[1]);if(ex)return{kind:'gameDone',title:ex.title,ex,xp:ex.status==='completed'?0:XP.gameDone,label:'Mark game completed'}}
  /* explore */
  if((m=t.match(/^(?:tried|went to|ate at|visited|had)\s+(.+)$/i))){let rest=m[1],r=null;const rm=rest.match(RATE);if(rm&&+rm[1]<=10){r=+rm[1];rest=rest.slice(0,rm.index)}const title=tidy(rest);const ex=bestMatch(exploreDoc().list,title);return{kind:'tried',title:ex?ex.title:cap(title),ex,rating:r,xp:ex&&ex.status==='tried'?0:XP.explore,label:`Tried${r!=null?` · ${fmtR(r)}/10`:''}`}}
  if((m=t.match(/^(?:try|want to try|go to|spot|place)\s*:?\s+(.+)$/i)))return{kind:'exploreAdd',title:cap(tidy(m[1])),xp:0,label:'Save to try'};
  /* focus, quests, countdowns, ideas */
  if((m=lo.match(/^focus(?:\s+for)?\s+(\d+)\s*(?:m|min|mins|minutes)?(?:\s+on\s+(.+))?$/)))return{kind:'focus',min:Math.max(5,Math.min(180,+m[1])),task:m[2]?tidy(t.slice(t.toLowerCase().indexOf(' on ')+4)):'',xp:0,label:`Start a ${m[1]} minute focus`};
  if((m=t.match(/^(?:quest|goal|todo|to do)\s*:?\s+(.+)$/i))){const boss=/\bboss\b/i.test(m[1]);const quick=/\bquick\b/i.test(m[1]);return{kind:'quest',title:cap1(tidy(m[1].replace(/\b(boss|quick)\b/ig,''))),diff:boss?'boss':quick?'quick':'standard',xp:0,label:`New ${boss?'boss':quick?'quick':'standard'} quest`}}
  if((m=t.match(/^(?:countdown|days until)\s*:?\s+(.+?)\s+(?:on\s+)?(\d{1,2})[\s/.-](\d{1,2}|jan\w*|feb\w*|mar\w*|apr\w*|may|jun\w*|jul\w*|aug\w*|sep\w*|oct\w*|nov\w*|dec\w*)(?:[\s/.-](\d{2,4}))?$/i))){const mo=isNaN(+m[3])?MON.findIndex(x=>m[3].toLowerCase().startsWith(x.toLowerCase())):(+m[3]-1);let y=m[4]?+m[4]:new Date().getFullYear();if(y<100)y+=2000;let d=new Date(y,mo,+m[2]);if(!m[4]&&sod(d)<sod(new Date()))d=new Date(y+1,mo,+m[2]);if(mo>=0)return{kind:'countdown',title:cap(tidy(m[1])),date:ymd(d),xp:0,label:`Countdown to ${fmtD(d)}`}}
  const im=t.match(/^(?:idea|note|hook|concept)\s*:?\s+(.+)$/i);const text=im?tidy(im[1]):t;const cat=/^hook/i.test(t)?'Content hook':/^concept/i.test(t)?'Film concept':/\b(z|car|drive|wheels|exhaust)\b/i.test(t)?'Car project':'Idea';
  return{kind:'idea',text,cat,xp:countToday('idea')<CAPS.idea?XP.idea:0,label:`Save as ${cat.toLowerCase()}`}}
function cmdPreview(c){if(!c)return '<span class="muted small">Try: watched Alien 8.5 · played Bloodborne 2h beat the first boss · boxing 30 min · tried Bait 8 · idea: a horror short in one take · focus 25 on the Cortex edit</span>';
  const name=c.title||c.text||c.task||c.act||(c.kind==='focus'?'Focus session':'');const icon={film:'film',filmAdd:'film',music:'music',fit:'flame',game:'game',gameDone:'game',tried:'pin',exploreAdd:'pin',focus:'focus',quest:'quest',countdown:'calendar',idea:'vault'}[c.kind]||'next';
  return `<div class="cmdp"><span class="row-ic acc">${ico(icon)}</span><span><b>${esc(name)}</b><small>${esc(c.label)}${c.ex?' · matches your list':c.kind==='game'||c.kind==='film'||c.kind==='music'||c.kind==='tried'?' · new':''}</small></span>${c.xp?`<em>+${c.xp} XP</em>`:''}</div>`}

    case 'game':{let g=c.ex;if(!g){g={id:uid(),title:c.title,platform:'PS5',status:'playing',sessions:[],created:Date.now(),started:today};gamesDoc().list.push(g)}g.sessions=g.sessions||[];const e={id:uid(),date:today,min:c.min,what:c.what,next:'',at:Date.now()};g.sessions.push(e);g.last=Date.now();if(c.what)g.left=c.what;if(g.status==='backlog'){g.status='playing';g.started=today}Store.touch('games/list');Snd.play('done');toast('Session logged','ok',`${g.title} · ${fmtHrs(c.min)}`);gain({k:`journal:${g.id}:${today}`,t:'journal',xp:XP.journal,skill:'cul',label:`Played ${g.title}`});queueTrophyCheck();return true}

/* ================= XP orbs fly up to your level ================= */
function xpOrbs(n,color){if(document.body.classList.contains('reduce'))return;const tgt=$('#batt');if(!tgt)return;const r=tgt.getBoundingClientRect();const tx=r.left+r.width/2,ty=r.top+r.height/2;const sx=innerWidth/2,sy=innerHeight*.55;
  for(let i=0;i<Math.min(9,Math.max(3,Math.round(n/10)));i++){const o=document.createElement('i');o.className='orb';o.style.setProperty('--c',color||'#fff');const ox=sx+(Math.random()-.5)*120,oy=sy+(Math.random()-.5)*80;o.style.left=ox+'px';o.style.top=oy+'px';document.body.appendChild(o);
    const dx=tx-ox,dy=ty-oy;const a=o.animate([{transform:'translate(-50%,-50%) scale(.4)',opacity:0},{transform:`translate(calc(-50% + ${dx*.15+(Math.random()-.5)*60}px),calc(-50% + ${dy*.1-40}px)) scale(1)`,opacity:1,offset:.25},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.3)`,opacity:.9}],{duration:900+i*70,easing:'cubic-bezier(.5,0,.3,1)',delay:i*40});
    a.onfinish=()=>{o.remove();tgt.classList.remove('gulp');void tgt.offsetWidth;tgt.classList.add('gulp')}}}
{const _x=xpToast;xpToast=function(xp,label,skill){_x(xp,label,skill);try{xpOrbs(xp,skillOf(skill).c)}catch(e){}}}

/* ================= PLAN MY DAY: one list in, a timed day out ================= */
const planDoc=()=>{const d=Store.ensure('sq/plan',()=>({date:'',items:[]}));d.items=d.items||[];return d};
const PL_ICON={fit:'flame',film:'film',game:'game',shoot:'cam',music:'music',explore:'pin',focus:'focus',task:'check',watchfb:'star'};
function classifyPlan(t){const l=t.toLowerCase();
  const fitRe=[[/\bbox(ing)?\b|shadowbox/,'Boxing'],[/\bpadel\b/,'Padel'],[/\bwalk/,'Walking'],[/\brun\b|\bjog/,'Run'],[/\bswim/,'Swim'],[/\bmobility\b|\bstretch/,'Mobility'],[/\bgym\b|\blift\b|\blifting\b|\bworkout\b|\btrain\b|\bweights\b|legs day|upper body|dead circuit/,'Strength'],[/\bskat(e|ing)\b/,'Skate']];
  if(/\b(watch|stream)\b.*\b(united|match|derby|game|vs)\b/.test(l))return{kind:'watchfb'};
  for(const [re,a] of fitRe)if(re.test(l))return{kind:'fit',act:a};
  if(/\b(watch|movie|cinema)\b/.test(l))return{kind:'film',title:tidy(stripTime(t).replace(/^.*?\b(?:watch|see)\s+(?:the\s+film\s+|a\s+film\s+|the\s+movie\s+)?/i,'').replace(/\b(tonight|at the cinema|in the evening)\b/ig,''))};
  if(/\b(shoot|film the|filming|photos|photo walk|photoshoot|b ?roll|golden hour|footage)\b/.test(l))return{kind:'shoot'};
  if(/\b(play|gaming)\b/.test(l))return{kind:'game',title:tidy(stripTime(t).replace(/^.*?\bplay(?:ing)?\s+(?:some\s+)?/i,'').replace(/\b(tonight|for a bit)\b/ig,''))};
  if(/\b(listen|album)\b/.test(l))return{kind:'music',title:tidy(stripTime(t).replace(/^.*?\blisten(?:ing)?\s+to\s+(?:the\s+new\s+|the\s+)?/i,'').replace(/\b(album)\b/ig,''))};
  if(/\b(try|go to|visit|eat at|lunch at|dinner at|brunch at|coffee at)\b/.test(l))return{kind:'explore',title:tidy(stripTime(t).replace(/^.*?\b(?:try|go to|visit|eat at|lunch at|dinner at|brunch at|coffee at)\s+(?:the\s+)?/i,''))};
  if(/\b(edit|write|script|study|learn|blender|focus|work on|design|research|read|practise|practice|deck|draft|storyboard|plan out|render)\b/.test(l))return{kind:'focus'};
  return{kind:'task'}}
function planItemsFrom(raw){const {items}=splitTasks(raw);return items.map((t,i)=>{const c=classifyPlan(t);const th=timeHint(t);let min=estMin(t);if(c.kind==='fit'&&!DUR_RE.test(t))min=c.act==='Padel'?75:c.act==='Walking'?30:c.act==='Mobility'?15:c.act==='Skate'?40:50;if(c.kind==='film'&&!DUR_RE.test(t))min=120;if(c.kind==='game'&&!DUR_RE.test(t))min=90;if(c.kind==='music'&&!DUR_RE.test(t))min=45;if(c.kind==='shoot'&&!DUR_RE.test(t))min=60;if(c.kind==='watchfb')min=110;
  let part=th&&th.part||null;if(!part&&!(th&&th.at!=null)&&['film','game','watchfb'].includes(c.kind))part='eve';
  return Object.assign({id:uid(),text:cap1(stripTime(t)||t),min,fix:th&&th.at!=null?(th.by?th.at-min:th.at):null,part,done:false,order:i},c)})}
function planTarget(){const h=new Date().getHours();const tm=h>=21;const d=tm?addDays(new Date(),1):new Date();return{date:ymd(d),d,startM:tm?9*60:nextStart(),tomorrow:tm}}
function layoutPlan(){const P=planDoc();const T={date:P.date,d:parseYmd(P.date)};const today=P.date===ymd(new Date());const startM=today?nextStart():9*60;const L=loc();const st=sunTimes(T.d,L.lat,L.lon);
  const open=P.items.filter(x=>!x.done);open.forEach(x=>{x.at=x.fix;if(x.kind==='shoot'&&x.fix==null&&st.gold&&st.gl){const am=st.gl[0],pm=st.gold[1];if(today&&nowMin()<am-5)x.at=Math.round(am);else if(!today||nowMin()<pm)x.at=Math.round(pm);x.gold=true}});
  const items=open.map(x=>({id:x.id,min:x.min,at:x.at,part:x.part,order:x.order}));const {over}=layoutDay(items,startM,23*60+30,10);
  items.forEach(it=>{const x=findIn(P.items,it.id);x.start=it.start});Store.touch('sq/plan');return over.length}
function planCard(full){const P=planDoc();const td=ymd(new Date());const tmr=ymd(addDays(new Date(),1));if(!P.items.length||(P.date!==td&&P.date!==tmr))return '';
  const nm=P.date===td?nowMin():-1;const L=P.items.slice().sort((a,b)=>(a.start==null)-(b.start==null)||(a.start||0)-(b.start||0));const left=L.filter(x=>!x.done);const show=full?L:left.filter(x=>x.start==null||x.start+x.min>nm).slice(0,5);const done=L.filter(x=>x.done).length;
  const sch=L.filter(x=>!x.done&&x.start!=null);const clash=new Set();sch.forEach(a=>sch.forEach(b=>{if(a!==b&&a.start<b.start+b.min&&b.start<a.start+a.min){clash.add(a.id);clash.add(b.id)}}));
  const row=x=>{const live=nm>=0&&x.start!=null&&nm>=x.start&&nm<x.start+x.min;const act={fit:'Log it',film:'Watched',game:'Log it',music:'Listened',explore:'Tried',focus:'Start'}[x.kind];
    return `<div class="tl-r ${live?'live':''} ${x.done?'done':''}">${tlHead(x.start,x.min)}<span class="tl-d"></span><div class="pl-i"><button class="ck sm ${x.done?'on':''}" data-act="plTick" data-id="${x.id}" aria-label="Done">${ico('check')}</button><button class="pl-m" data-act="plOpts" data-id="${x.id}"><span class="pl-t">${ico(PL_ICON[x.kind]||'check')}${esc(x.text)}</span><span class="chips">${live?'<span class="chip acc">Now</span>':''}${x.gold?'<span class="chip warn">Golden hour</span>':''}${x.fix!=null?'<span class="chip">Fixed</span>':''}${clash.has(x.id)?'<span class="chip bad">Clash</span>':''}</span></button>${!x.done&&x.kind==='focus'?`<button class="btn sm" data-act="plFocus" data-id="${x.id}">${ico('play')}${act}</button>`:''}</div></div>`};
  return `<section class="plancard"><div class="lbl-row"><div class="lbl">${P.date===td?"Today's plan":"Tomorrow's plan"} · ${done} of ${L.length}</div><div class="btns">${full?'':`<button class="btn sm ghost" data-act="planOpen">All</button>`}<button class="btn sm" data-act="planNew">${ico('plus')}Add</button></div></div>
  ${show.length?`<div class="tl">${show.map(row).join('')}</div>`:`<p class="empty">${left.length?'Everything left is later today.':'Day cleared. Nice.'}</p>`}${!full&&left.length>show.length?`<p class="muted small" style="margin:6px 0 0">${left.length-show.length} more in the plan</p>`:''}</section>`}
PANELS.plan=()=>{const P=planDoc();return{title:P.date===ymd(new Date())?"Today's plan":'Plan',back:CATS[view.cat].label,body:`${planCard(true)}<section class="btns"><button class="btn" data-act="planRe">${ico('time')}Re-plan from now</button><button class="btn" data-act="planNew">${ico('plus')}Add more</button><button class="btn danger" data-act="cb" data-i="${cb(el=>armDelete(el,()=>{P.items=[];Store.touch('sq/plan');view.panel=null;$('#panel').hidden=true}))}">Clear plan</button></section>
  <section class="plate note"><p class="muted small" style="margin:0">Times you give stay fixed. Everything else fills the gaps with a short break between. Shoots land on golden hour, films and games go to the evening. Ticking a workout, film, game or place logs it with its XP, and a fully cleared day is worth a bonus.</p></section>`}};
A.planOpen=()=>openPanel('plan','x');
A.planNew=()=>{const T=planTarget();openSheet(`<div class="sh-h"><div class="sh-t">Plan ${T.tomorrow?'tomorrow':'my day'}</div><button class="sh-x" data-act="closeSheet">Cancel</button></div><p class="muted small" style="margin:-4px 0 10px">Everything you want to do, in any order. Commas, new lines or "then" all work.</p>
  <div class="qadd plq"><textarea class="in" id="plIn" rows="4" placeholder="edit the No5 reel, gym at 6, call mum, shoot the Z, watch Nope tonight, try that ramen place" data-in="plType"></textarea><button class="mic" data-act="plMic" aria-label="Speak">${ico('mic')}</button></div><div id="plPrev" class="qprev"></div>
  <div class="sh-actions" style="margin-top:12px"><span class="sp"></span><button class="btn pri" data-act="plGo">${ico('time')}Plan it</button></div>`);setTimeout(()=>{const i=$('#plIn');if(i)i.focus()},80)};
IN.plType=el=>{const p=$('#plPrev');if(!p)return;const L=el.value.trim()?planItemsFrom(el.value):[];p.innerHTML=L.length?`<div class="mprev"><div class="mp-h"><b>${plural(L.length,'thing')}</b><small>Here is how it splits up</small></div>${L.map(x=>`<div class="mp-r">${ico(PL_ICON[x.kind]||'check')}<span class="mp-t">${esc(x.text)}</span><span class="mp-m">${x.fix!=null?clockOf(x.fix):x.kind==='shoot'?'golden hour':x.part==='eve'?'evening':durTxt(x.min)}</span></div>`).join('')}</div>`:''};
A.plMic=()=>micInto('plIn','[data-act="plMic"]');
A.plGo=()=>{const v=(($('#plIn')||{}).value||'').trim();const L=v?planItemsFrom(v):[];if(!L.length){Snd.play('err');return}const T=planTarget();const P=planDoc();if(P.date!==T.date){P.date=T.date;P.items=[]}const base=P.items.length;L.forEach((x,i)=>{x.order=base+i;P.items.push(x)});const over=layoutPlan();closeSheet(true);Snd.play('done');Waves.flash();
  toast(`Planned ${plural(L.length,'thing')}`,'ok',over?`${over} won't fit, they wait at the end`:`${T.tomorrow?'Tomorrow':'Today'} is laid out`);if(CATS[view.cat].id!=='world')goId('world');else render()};
A.planRe=()=>{const P=planDoc();if(!P.items.length)return;if(P.date!==ymd(new Date())&&P.date<ymd(new Date())){P.date=ymd(new Date())}layoutPlan();Snd.play('done');renderPanel();render()};
function planDoneCheck(){const P=planDoc();if(P.items.length>=3&&P.items.every(x=>x.done))gain({k:'dayclear:'+P.date,t:'dayclear',xp:25,skill:'foc',label:'Day cleared'})}
const findOrMake=(list,title,make)=>bestMatch(list,title)||make();
A.plTick=el=>{const P=planDoc();const x=findIn(P.items,el.dataset.id);if(!x)return;if(x.done){x.done=false;x.doneAt=null;Store.touch('sq/plan');Snd.play('uncheck');render();return}
  x.done=true;x.doneAt=Date.now();Store.touch('sq/plan');Snd.play('check');const td=ymd(new Date());
  if(x.kind==='fit'){const e={id:uid(),act:x.act||'Strength',min:x.min,date:td,notes:'From your plan',at:Date.now()};fitDoc().list.push(e);Store.touch('sq/fit');toast(`${e.act} logged`,'ok',`${e.min} min`);gainWorkout('fit:'+e.id,e.min,e.act)}
  else if(x.kind==='film'&&x.title){const f=findOrMake(filmsDoc().list,x.title,()=>{const n={id:uid(),title:cap(x.title),status:'watchlist',created:Date.now()};filmsDoc().list.push(n);Store.touch('films/list');return n});if(f.status!=='watched')setTimeout(()=>watchFlow(f),60)}
  else if(x.kind==='game'&&x.title){const g=findOrMake(gamesDoc().list,x.title,()=>{const n={id:uid(),title:cap(x.title),platform:'PS5',status:'playing',sessions:[],created:Date.now()};gamesDoc().list.push(n);Store.touch('games/list');return n});setTimeout(()=>sessForm(g,null,x.min),60)}
  else if(x.kind==='music'&&x.title){const m=findOrMake(musicDoc().list,x.title,()=>{const n={id:uid(),title:cap(x.title),artist:'',format:'album',status:'tolisten',created:Date.now()};musicDoc().list.push(n);Store.touch('music/list');return n});if(m.status!=='listened')setTimeout(()=>listenFlow(m),60)}
  else if(x.kind==='explore'&&x.title){const e=findOrMake(exploreDoc().list,x.title,()=>{const n={id:uid(),title:cap(x.title),kind:'spot',area:'',link:'',notes:'',status:'totry',created:Date.now()};exploreDoc().list.push(n);Store.touch('explore/list');return n});if(e.status!=='tried')setTimeout(()=>triedFlow(e),60)}
  else gain({k:'plan:'+x.id,t:'plan',xp:5,skill:x.kind==='shoot'?'cre':x.kind==='watchfb'?'cul':'foc',label:x.text});
  planDoneCheck();queueTrophyCheck();render()};
A.plFocus=el=>{const x=findIn(planDoc().items,el.dataset.id);if(!x)return;const D=focusDoc();if(D.run){toast('A focus session is already running','err');goId('focus');return}const m=Math.max(10,Math.min(90,x.min));const now=Date.now();D.run={id:uid(),task:x.text,start:now,dur:m*60000,endAt:now+m*60000,paused:null,plan:x.id};Store.touch('sq/focus');Snd.play('go');if(S().amb&&S().amb!=='off')Amb.play(S().amb);goId('focus')};
A.plOpts=el=>{const P=planDoc();const x=findIn(P.items,el.dataset.id);if(!x)return;openOpts(x.text.slice(0,40),[
  {label:'Change the time',icon:'time',fn:()=>setTimeout(()=>openForm({title:'Start time',fields:[{key:'t',label:'Start at (leave empty to let it float)',type:'time',value:x.start!=null?`${pad(Math.floor(x.start/60)%24)}:${pad(x.start%60)}`:''}],onSave:v=>{if(!v.t)x.fix=null;else{const [h,m]=v.t.split(':').map(Number);x.fix=h*60+m}layoutPlan()}}),40)},
  {label:'Change how long',icon:'focus',fn:()=>setTimeout(()=>openOpts('How long?',[10,15,20,30,45,60,90,120,180].map(m=>({label:durTxt(m),icon:m===x.min?'check':'time',fn:()=>{x.min=m;layoutPlan()}}))),40)},
  {label:'Rename',icon:'edit',fn:()=>setTimeout(()=>openForm({title:'Rename',fields:[{key:'t',label:'What',value:x.text}],onSave:v=>{if(!v.t)return false;x.text=v.t;Store.touch('sq/plan')}}),40)},
  {label:'Remove from plan',icon:'warn',danger:true,fn:()=>{P.items.splice(P.items.indexOf(x),1);layoutPlan()}}])};
/* focus sessions started from the plan tick their plan item when they finish */
{const _fc=focusComplete;focusComplete=function(early){const r=focusDoc().run;const pid=r&&r.plan;_fc(early);if(pid){const x=findIn(planDoc().items,pid);if(x&&!x.done){x.done=true;x.doneAt=Date.now();Store.touch('sq/plan');planDoneCheck();render()}}}}

/* ================= several things at once in "What did you do?" ================= */
function runQuiet(c){if(!c)return;const td=ymd(new Date());
  if(c.kind==='film'&&c.rating==null){let f=c.ex;if(!f){f={id:uid(),title:c.title,status:'watchlist',created:Date.now()};filmsDoc().list.push(f)}f.status='watched';f.watchedAt=f.watchedAt||td;f.ts=Date.now();Store.touch('films/list');gain({k:'film:'+f.id,t:'film',xp:XP.film,skill:'cul',label:`Watched ${f.title}`});return}
  if(c.kind==='music'&&c.rating==null){let m=c.ex;if(!m){m={id:uid(),title:c.title,artist:c.artist,format:c.format,status:'tolisten',created:Date.now()};musicDoc().list.push(m)}m.status='listened';m.listenedAt=td;m.ts=Date.now();Store.touch('music/list');gain({k:'music:'+m.id,t:'music',xp:XP[m.format]||5,skill:'cul',label:`Listened to ${m.title}`});return}
  if(c.kind==='tried'&&c.rating==null){let x=c.ex;if(!x){x={id:uid(),title:c.title,kind:'spot',area:'',link:'',notes:'',status:'totry',created:Date.now()};exploreDoc().list.push(x)}x.status='tried';x.triedAt=x.triedAt||td;x.ts=Date.now();Store.touch('explore/list');gain({k:'explore:'+x.id,t:'explore',xp:XP.explore,skill:'exp',label:`Tried ${x.title}`});return}
  if(c.kind==='focus'||c.kind==='gameDone'){runCmd(c);return}
  view.quietRank=Date.now()+2500;runCmd(c)}
{const _t=IN.cmdType;IN.cmdType=el=>{const parts=splitTasks(el.value).items;if(parts.length>1){const p=$('#cmdPrev');if(p)p.innerHTML=`<div class="mprev"><div class="mp-h"><b>${parts.length} things</b><small>Each one goes to the right place. Ratings can be added later.</small></div>${parts.map(t=>cmdPreview(parseCmd(t))).join('')}</div>`;return}_t(el)}}
{const _g=A.cmdGo;A.cmdGo=()=>{const v=(($('#cmdIn')||{}).value||'').trim();const parts=splitTasks(v).items;if(parts.length<2)return _g();closeSheet(true);let n=0;parts.forEach((t,i)=>setTimeout(()=>{try{runQuiet(parseCmd(t));n++}catch(e){console.error(e)}if(i===parts.length-1){toast(`Logged ${plural(n,'thing')}`,'ok','Rate and rank them any time');queueTrophyCheck();render()}},i*350))}}

/* Next up follows the plan when there is one */
{const _n=nextUp;nextUp=function(){const L=liveDoc();if(L.game||L.lift||L.skate||L.fit||focusDoc().run)return _n();const P=planDoc();if(P.date===ymd(new Date())){const nm=nowMin();const nx=P.items.filter(x=>!x.done&&x.start!=null&&x.start+x.min>nm).sort((a,b)=>a.start-b.start)[0];
  if(nx){const now=nm>=nx.start;return{t:nx.text,s:now?`On now in your plan, until ${clockOf(nx.start+nx.min)}`:`Next in your plan at ${clockOf(nx.start)}`,act:'planOpen',icon:PL_ICON[nx.kind]||'time'}}}return _n()}}

/* ================= POSTERS, COVERS AND AUTOFILL =================
   Films: TMDB when a key is saved, otherwise Apple's iTunes catalogue, with Wikipedia as a backstop.
   Games: Wikipedia box art (no key needed), RAWG adds genres and platforms when a key is saved.
   Music: Apple's iTunes catalogue, Wikipedia as a backstop. Nothing here needs a server. */
const ART_KIND={film:{doc:()=>filmsDoc(),path:'films/list'},game:{doc:()=>gamesDoc(),path:'games/list'},music:{doc:()=>musicDoc(),path:'music/list'}};
const artKeys=()=>{const s=S();s.keys=s.keys||{};return s.keys};
const an=s=>norm(s).replace(/&/g,'and').replace(/[^a-z0-9 ]/g,' ').replace(/^(the|a|an) /,'').replace(/\s+/g,' ').trim();
const okUrl=u=>/^https:\/\/[^\s"'<>]+$/i.test(String(u||''));
const TMDB_G={28:'Action',12:'Action',16:'Animation',35:'Comedy',80:'Crime',99:'Documentary',18:'Drama',10751:'Other',14:'Fantasy',36:'Drama',27:'Horror',10402:'Musical',9648:'Mystery',10749:'Romance',878:'Sci-fi',53:'Thriller',10752:'War',37:'Western',10770:'Other'};
function filmGenre(s){s=String(s||'').toLowerCase();const M=[['sci','Sci-fi'],['science','Sci-fi'],['horror','Horror'],['thriller','Thriller'],['crime','Crime'],['myster','Mystery'],['romance','Romance'],['romantic','Romance'],['anim','Animation'],['kids','Animation'],['document','Documentary'],['fantasy','Fantasy'],['war ','War'],['western','Western'],['music','Musical'],['comedy','Comedy'],['action','Action'],['adventure','Action'],['drama','Drama']];s+=' ';for(const [k,v] of M)if(s.includes(k))return v;return ''}
function platOf(names){const n=(names||[]).join('|').toLowerCase();for(const [re,p] of [[/playstation 5/,'PS5'],[/playstation 4/,'PS4'],[/playstation 3/,'PS3'],[/\bpsp\b/,'PSP'],[/\bpc\b/,'PC'],[/switch/,'Switch'],[/xbox/,'Xbox'],[/ios|android/,'Mobile']])if(re.test(n))return p;return ''}
const Art={busy:false,itLast:0,seq:0,
  async json(url,opt){const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),12000);try{const r=await fetch(url,Object.assign({signal:ctl.signal},opt||{}));if(!r.ok)throw new Error('http '+r.status);return await r.json()}finally{clearTimeout(t)}},
  jsonp(url,ms=10000){return new Promise((res,rej)=>{const n='sqj'+Math.random().toString(36).slice(2);const s=document.createElement('script');const done=()=>{clearTimeout(t);try{delete window[n]}catch(e){window[n]=undefined}s.remove()};const t=setTimeout(()=>{done();rej(new Error('timeout'))},ms);window[n]=d=>{done();res(d)};s.onerror=()=>{done();rej(new Error('net'))};s.src=url+(url.includes('?')?'&':'?')+'callback='+n;document.head.appendChild(s)})},
  size:(u,dim)=>u?String(u).replace(/\/\d+x\d+(bb|cc)?\.(jpg|png|webp)$/i,'/'+dim+'bb.jpg'):'',
  async itunes(params,bg){if(bg){const w=this.itLast+3200-Date.now();if(w>0)await new Promise(r=>setTimeout(r,w))}this.itLast=Date.now();return this.jsonp('https://itunes.apple.com/search?'+new URLSearchParams(params))},
  tmdb(path,params={}){const k=String(artKeys().tmdb||'').trim();const bearer=k.length>60;const u=new URL('https://api.themoviedb.org/3'+path);for(const p in params)u.searchParams.set(p,params[p]);if(!bearer)u.searchParams.set('api_key',k);return this.json(u.href,bearer?{headers:{Authorization:'Bearer '+k,accept:'application/json'}}:undefined)},
  rawg(params){const u=new URL('https://api.rawg.io/api/games');u.searchParams.set('key',String(artKeys().rawg||'').trim());for(const p in params)u.searchParams.set(p,params[p]);return this.json(u.href)},
  wikiQ(params){return this.json('https://en.wikipedia.org/w/api.php?'+new URLSearchParams(Object.assign({action:'query',format:'json',origin:'*',prop:'pageimages|description',piprop:'thumbnail',pithumbsize:'500',pilicense:'any',redirects:'1'},params)))},
  async wikiSearch(q,re){const d=await this.wikiQ({generator:'search',gsrsearch:q,gsrlimit:'10'});return Object.values((d.query||{}).pages||{}).sort((a,b)=>(a.index||0)-(b.index||0)).filter(p=>!re||re.test(p.description||''))},
  async wikiTitles(titles){const out={};titles=[...new Set(titles.filter(Boolean))];for(let i=0;i<titles.length;i+=50){const chunk=titles.slice(i,i+50);let d;try{d=await this.wikiQ({titles:chunk.join('|')})}catch(e){continue}const q=d.query||{};const map={};(q.normalized||[]).forEach(n=>{map[n.from]=n.to});(q.redirects||[]).forEach(r=>{map[r.from]=r.to});const byT={};Object.values(q.pages||{}).forEach(p=>{if(!('missing' in p)&&!('invalid' in p))byT[p.title]=p});chunk.forEach(t=>{let x=t,k=0;while(map[x]&&k++<4)x=map[x];if(byT[x])out[t]=byT[x]})}return out},
  /* search: what the add form and the cover picker show */
