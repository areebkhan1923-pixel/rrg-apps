<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KICKFLIP 2000"><meta name="application-name" content="KICKFLIP 2000"><meta name="theme-color" content="#0c0305">
<link rel="apple-touch-icon" href="kickflip-icon.png"><link rel="icon" href="kickflip-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>KICKFLIP 2000</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@300;400;600&family=M+PLUS+1p:wght@300;400;500;700;800&display=swap">
<style>
/* Layout: handheld console menu. Status bar, horizontal category rail, vertical item column, sliding sub panels, bottom sheets. One dark red world, so a single deliberate theme. */
:root{
  --bg:#0c0305; --ink:#fbf3f3; --dim:rgba(251,236,236,.62); --faint:rgba(251,236,236,.36);
  --line:rgba(255,232,232,.17); --line2:rgba(255,232,232,.08);
  --accent:#ff3341; --accent2:#ff8a92; --glow:rgba(255,60,72,.55);
  --glass:rgba(14,3,5,.66); --glass2:rgba(255,240,240,.06); --glass3:rgba(255,240,240,.12);
  --ok:#8df0b2; --warn:#ffd36e; --bad:#ff7378;
  --bronze:#d8925f; --silver:#d5dce4; --gold:#f5cf55; --plat:#a6dcff;
  --f-ui:"M PLUS 1p","Hiragino Sans","Segoe UI",system-ui,sans-serif;
  --f-num:"M PLUS 1 Code",ui-monospace,Menlo,Consolas,monospace;
  --sys-h:46px; --gut:max(16px,env(safe-area-inset-left,0px)); --gutR:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.i{width:20px;height:20px;flex:none}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* status bar */
.sys{height:var(--sys-h);flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-left:var(--gut);padding-right:var(--gutR);font-family:var(--f-num);font-size:13px;color:var(--ink)}
.sys-l{display:flex;align-items:center;gap:10px;min-width:0}
.logo{font-family:var(--f-ui);font-weight:800;letter-spacing:.22em;font-size:12px;opacity:.85;white-space:nowrap}
.sys-r{display:flex;align-items:center;gap:12px;flex:none}
#clock{white-space:nowrap}
@media(max-width:480px){.sys-l:has(.tchip) .logo{display:none}}
.sys-btn{border:0;background:none;padding:6px;margin:-6px;display:grid;place-items:center;color:var(--dim);cursor:pointer}
.sys-btn .i{width:18px;height:18px}
.tchip{display:flex;align-items:center;gap:6px;border:0;background:rgba(255,255,255,.08);border-radius:999px;padding:3px 10px 3px 8px;font-family:var(--f-num);font-size:12px;cursor:pointer;max-width:42vw}
.tchip .dotp{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--glow);animation:pulse 1.4s ease-in-out infinite}
.tchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.batt{display:flex;align-items:center;gap:2px}
.batt b{position:relative;width:24px;height:12px;border:1.5px solid rgba(255,255,255,.8);border-radius:3px;display:block;overflow:hidden}
.batt b i{position:absolute;left:1px;top:1px;bottom:1px;background:#fff;border-radius:1px;transition:width .4s}
.batt b.low i{background:var(--accent)}
.batt::after{content:"";width:2px;height:5px;background:rgba(255,255,255,.8);border-radius:0 1px 1px 0}

/* category rail */
.xmb{position:relative;height:98px;flex:none;overflow:hidden}
.xmb-track{position:absolute;top:6px;left:0;display:flex;gap:4px;transition:transform .38s cubic-bezier(.2,.8,.2,1);will-change:transform}
.cat{position:relative;width:66px;height:62px;border:0;background:none;display:grid;place-items:center;opacity:.46;cursor:pointer;transition:opacity .25s}
.cat .i{width:30px;height:30px;transition:transform .32s cubic-bezier(.2,.8,.2,1),filter .3s}
.cat.on{opacity:1}
.cat.on .i{transform:scale(1.3);filter:drop-shadow(0 0 7px rgba(255,255,255,.75))}
.cat-l{position:absolute;top:62px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13.5px;font-weight:500;letter-spacing:.02em;opacity:0;transition:opacity .25s;text-shadow:0 0 12px rgba(255,255,255,.55)}
.cat.on .cat-l{opacity:1}
.cat .badge{position:absolute;top:8px;right:13px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--glow)}
.cat:focus-visible{outline:none}
.cat:focus-visible .i{filter:drop-shadow(0 0 7px #fff)}

/* column */
.col{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-left:var(--gut);padding-right:var(--gutR);padding-block:2px 56px;-webkit-overflow-scrolling:touch}
.col-in{max-width:760px;margin:0 auto;display:grid;gap:22px;min-width:0}
.col-in.in-r{animation:colR .26s cubic-bezier(.2,.8,.2,1)}
.col-in.in-l{animation:colL .26s cubic-bezier(.2,.8,.2,1)}
@keyframes colR{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes colL{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
section{min-width:0}
.lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:0 0 8px}
.lbl-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.lbl-row .lbl{margin:0}
.empty{color:var(--dim);font-size:14px;margin:6px 0;padding:14px 0;border-top:1px dashed var(--line2);border-bottom:1px dashed var(--line2)}
.muted{color:var(--dim)}
.small{font-size:12.5px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:500}

/* rows */
.list{display:grid;gap:2px}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:9px 6px;background:none;border:0;text-align:left;border-radius:12px;cursor:pointer;min-width:0;position:relative}
.row:active,.row:focus-visible{background:linear-gradient(90deg,var(--glass3),rgba(255,255,255,0));outline:none}
.row-ic{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:13px;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.2),rgba(255,255,255,.035) 70%);box-shadow:inset 0 0 0 1px var(--line)}
.row-ic.acc{color:#fff;background:radial-gradient(circle at 30% 25%,#ff6a74,#a40f1a 80%);box-shadow:0 0 16px var(--glow)}
.row-ic.bad{color:var(--bad)} .row-ic.warn{color:var(--warn)} .row-ic.ok{color:var(--ok)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-t{font-size:16.5px;font-weight:500;line-height:1.3;text-shadow:0 0 14px rgba(255,255,255,.18);overflow-wrap:anywhere}
.row-s{font-size:12.5px;color:var(--dim);margin-top:2px;overflow-wrap:anywhere}
.row-side{display:flex;align-items:center;gap:6px;flex:none}
.row .chev{opacity:.4}
.swatch{width:10px;height:10px;border-radius:3px;background:var(--c,#fff);box-shadow:0 0 10px var(--c,#fff);flex:none;display:inline-block}
.row-ic .swatch{width:14px;height:14px;border-radius:4px}

/* plates: dialog bars with hairlines top and bottom */
.plate{position:relative;padding:16px;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.02));border-top:1px solid rgba(255,255,255,.3);border-bottom:1px solid rgba(255,255,255,.1);border-radius:6px;min-width:0}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;line-height:1.5;background:var(--glass2);box-shadow:inset 0 0 0 1px var(--line);color:var(--dim);border:0;white-space:nowrap}
button.chip{cursor:pointer}
.chip.ok{color:var(--ok);box-shadow:inset 0 0 0 1px rgba(141,240,178,.35)}
.chip.warn{color:var(--warn);box-shadow:inset 0 0 0 1px rgba(255,211,110,.35)}
.chip.bad{color:var(--bad);box-shadow:inset 0 0 0 1px rgba(255,115,120,.45);background:rgba(255,80,90,.08)}
.chip.acc,.chip.on{color:#fff;background:rgba(255,51,65,.22);box-shadow:inset 0 0 0 1px rgba(255,120,128,.6)}
.chip.big{font-size:14px;padding:8px 14px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.hs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-right:calc(-1 * var(--gutR));padding-right:var(--gutR);scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}

/* buttons and inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.04));font:500 14px var(--f-ui);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.btn.pri{background:linear-gradient(180deg,#ff5260,#c3101d);border-color:#ff8a92;box-shadow:0 0 18px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.sm{min-height:34px;padding:0 13px;font-size:13px}
.btn.ghost{background:none;border-color:var(--line)}
.btn.danger{border-color:rgba(255,115,120,.6);color:var(--bad);background:none}
.btn.wide{width:100%}
.btn .i{width:17px;height:17px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.ibtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--glass2);display:grid;place-items:center;cursor:pointer;flex:none}
.ibtn .i{width:17px;height:17px}
.ibtn.on{color:var(--gold);border-color:rgba(245,207,85,.5)}
.in{width:100%;min-height:44px;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:rgba(0,0,0,.38);color:var(--ink);font:400 16px var(--f-ui)}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:rgba(255,255,255,.55);box-shadow:0 0 0 3px rgba(255,51,65,.28)}
textarea.in{min-height:100px;resize:vertical;line-height:1.5}
select.in{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,rgba(255,255,255,.7) 50%),linear-gradient(135deg,rgba(255,255,255,.7) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
select.in option{background:#1a0508;color:#fff}
.cap{display:grid;grid-template-columns:1fr auto;gap:8px}
.cap .in-tag{grid-column:1/-1}
@media(min-width:560px){.cap{grid-template-columns:1fr 170px auto}.cap .in-tag{grid-column:auto}}
.field{display:grid;gap:6px}
.field>span{font-size:12px;color:var(--dim);letter-spacing:.04em}
.fgrid{display:grid;gap:14px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* checks */
.ck{width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.55);background:rgba(0,0,0,.25);transition:background .18s,border-color .18s,box-shadow .18s;cursor:pointer;padding:0}
.ck .i{width:18px;height:18px;opacity:0;transform:scale(.5);transition:.18s;stroke-width:2.6}
.ck.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 14px var(--glow)}
.ck.on .i{opacity:1;transform:none}
.ck.sm{width:24px;height:24px;border-radius:7px}
.ck.sm .i{width:15px;height:15px}

/* progress */
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#ff7a83,var(--accent));border-radius:9px;box-shadow:0 0 10px var(--glow)}
.bar.ok i{background:var(--ok);box-shadow:0 0 10px rgba(141,240,178,.5)}
.bar .pace{position:absolute;top:-2px;bottom:-2px;width:2px;background:rgba(255,255,255,.7)}
.ring .rv{transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px var(--glow))}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gutR)) 14px 0;padding-right:var(--gutR)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 13px;border-radius:999px;border:0;background:none;font-size:13.5px;color:var(--dim);cursor:pointer}
.tab.on{color:#fff;background:var(--glass3);box-shadow:inset 0 0 0 1px var(--line)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--dim);font-size:13px;cursor:pointer}
.seg button.on{color:#fff;border-color:rgba(255,130,138,.7);background:rgba(255,51,65,.22);box-shadow:0 0 12px rgba(255,51,65,.3)}

/* hero (today) */
.hero{display:grid;gap:6px}
.hero-d{font-size:clamp(40px,12vw,64px);font-weight:300;letter-spacing:-.01em;line-height:1}
.hero-fri{display:flex;align-items:center;gap:14px;margin-top:10px;padding:12px 14px;border:0;width:100%;text-align:left;cursor:pointer;background:linear-gradient(90deg,rgba(255,51,65,.22),rgba(255,51,65,0));border-left:2px solid var(--accent);border-radius:4px}
.hero-fri b{display:block;font-size:17px;font-weight:500}
.hero-fri small{display:block;color:var(--dim);font-size:12.5px}

/* friday */
.fri-head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.fri-title{font-size:clamp(28px,8vw,44px);font-weight:800;letter-spacing:.04em;line-height:1;text-transform:uppercase;text-shadow:0 0 24px rgba(255,51,65,.55)}
.fri-sub{color:var(--dim);font-size:13.5px;margin-top:8px}
.ringbox{position:relative;width:112px;height:112px;flex:none}
.ringbox .rt{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ringbox .rt b{font-family:var(--f-num);font-size:28px;font-weight:600;display:block}
.ringbox .rt small{font-size:10.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.weeknav{display:flex;align-items:center;gap:8px;margin-top:12px}
.fc{display:grid;gap:10px}
.fc-h{display:flex;align-items:center;gap:10px}
.fc-h .swatch{width:12px;height:12px}
.fc-n{font-size:18px;font-weight:700;flex:1;min-width:0}
.fc-c{font-family:var(--f-num);color:var(--dim);font-size:13px}
.fc.is-done{border-top-color:rgba(141,240,178,.55)}
.fc.is-done .fc-n{color:var(--ok)}
.fi{display:flex;align-items:center;gap:12px;width:100%;padding:8px 2px;border:0;background:none;text-align:left;cursor:pointer}
.fi-t{display:flex;flex-direction:column;font-size:16px;font-weight:500;min-width:0}
.fi-t small{font-size:12px;color:var(--dim);font-weight:400}
.fc-posts{display:grid;gap:2px;padding-top:8px;border-top:1px solid var(--line2)}
.pr{display:flex;align-items:center;gap:10px;min-width:0}
.pr-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:8px 2px;border:0;background:none;text-align:left;cursor:pointer}
.pr-d{font-family:var(--f-num);font-size:11px;letter-spacing:.06em;color:var(--dim);width:46px;flex:none;text-transform:uppercase;line-height:1.15}
.pr-d b{display:block;font-size:15px;color:var(--ink);font-weight:600}
.pr-t{flex:1;min-width:0;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-t.done{color:var(--dim);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.35)}
.pr-chips{display:flex;gap:4px;flex:none}
.fc-foot{display:flex;flex-wrap:wrap;gap:8px}
.hist{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.hist button{border:0;background:none;display:grid;gap:6px;justify-items:center;cursor:pointer;padding:6px 0;border-radius:8px;color:var(--dim);font-size:11px;font-family:var(--f-num)}
.hist button.on{background:var(--glass2);color:#fff}
.hcell{width:100%;max-width:44px;height:54px;border-radius:5px;border:1.5px solid rgba(255,255,255,.4);position:relative;overflow:hidden}
.hcell i{position:absolute;left:2px;right:2px;bottom:2px;border-radius:2px;background:var(--accent)}
.hcell.full i{background:var(--ok)}

/* time */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{position:relative;min-height:84px;padding:12px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02));text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);box-shadow:0 0 12px var(--c)}
.tile b{font-size:15px;font-weight:700;display:block}
.tile small{font-family:var(--f-num);font-size:12px;color:var(--dim)}
.tile.run{border-color:var(--c);box-shadow:0 0 22px color-mix(in srgb,var(--c) 40%,transparent),inset 0 0 30px color-mix(in srgb,var(--c) 14%,transparent)}
.tile.run small{color:#fff}
.bigtime{font-family:var(--f-num);font-size:clamp(40px,13vw,64px);font-weight:300;letter-spacing:.02em;line-height:1}
.tcard{display:grid;gap:10px}
.tc-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tc-row b{flex:1;min-width:0;font-size:16px}
.tc-el{font-family:var(--f-num);font-size:20px}
.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:76px 1fr 54px;align-items:center;gap:10px;font-size:13px}
.hb span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .num{text-align:right;color:var(--dim)}
.hb .bar i{background:var(--c);box-shadow:0 0 10px var(--c)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:110px}
.day{display:grid;grid-template-rows:1fr auto auto;gap:4px;height:100%;text-align:center;font-size:10.5px;color:var(--dim);font-family:var(--f-num)}
.day .col-b{align-self:end;width:100%;max-width:28px;margin:0 auto;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,#ff8a92,var(--accent));box-shadow:0 0 10px var(--glow);min-height:2px}
.day.today{color:#fff}
.day .col-b.z{background:rgba(255,255,255,.14);box-shadow:none}
.rtable{display:grid;gap:0}
.rt-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);align-items:center;font-size:14px}
.rt-row .num{text-align:right}
.rt-row small{display:block;color:var(--dim);font-size:11.5px}

/* misc blocks */
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kv>div{padding:12px;border-radius:10px;background:var(--glass2);box-shadow:inset 0 0 0 1px var(--line2)}
.kv b{display:block;font-family:var(--f-num);font-size:22px;font-weight:600;line-height:1.15}
.kv small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.dl{display:grid;gap:10px}
.deliv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.deliv .bar{grid-column:1/-1}
.ctr{display:flex;align-items:center;gap:8px}
.ctr .num{min-width:52px;text-align:center;font-size:15px}
.note{padding:12px 0;border-bottom:1px solid var(--line2);display:grid;gap:4px}
.note-h{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--faint);font-family:var(--f-num)}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.55;margin:0}
.hook{display:grid;grid-template-columns:1fr auto;gap:8px 10px;padding:12px 0;border-bottom:1px solid var(--line2);align-items:start}

const COLS=['ko','skate','lift'];
const Store={mode:'boot',db:null,data:Object.create(null),dirty:new Set(),timers:{},inflight:{},again:{},loaded:new Set(),ready:false,readOnly:false,_res:null,
  get(p){return this.data[p]||null},
  ensure(p,def){if(!this.data[p])this.data[p]=def();return this.data[p]},
  touch(p){if(this.readOnly){toast('Save data is read only here','err');return}this.dirty.add(p);clearTimeout(this.timers[p]);this.timers[p]=setTimeout(()=>this.flush(p),450);updSaving();queueTrophyCheck();this.cache()},
  remove(p){this.data[p]=null;this.touch(p)},
  async flush(p){
    clearTimeout(this.timers[p]);
    if(this.mode!=='cloud'){this.dirty.delete(p);if(this.data[p]===null)delete this.data[p];this.saveLocal();updSaving();return}
    if(this.inflight[p]){this.again[p]=true;return}
    this.inflight[p]=true;updSaving();
    const body=this.data[p];
    try{
      if(body===null)await this.db.doc(p).delete();else await this.db.doc(p).set(clone(body));
      if(body===null&&this.data[p]===null)delete this.data[p];
    }catch(e){
      const c=e&&e.code;
      if(c==='invalid_argument'||c==='not_granted'||c==='revoked'){this.readOnly=c!=='invalid_argument'?true:this.readOnly;toast(c==='invalid_argument'?'That change could not be saved':'Save data is read only in this view','err')}
      else if(c==='quota_exceeded'){toast('Storage is full. Delete old entries to keep saving.','err')}
      else{await new Promise(r=>setTimeout(r,800+Math.random()*900));try{if(body===null)await this.db.doc(p).delete();else await this.db.doc(p).set(clone(this.data[p]))}catch(e2){toast('Offline. Changes will retry.','err');this.again[p]=true;setTimeout(()=>this.flush(p),5000)}}
    }finally{
      this.inflight[p]=false;
      if(this.again[p]){this.again[p]=false;setTimeout(()=>this.flush(p),60)}else this.dirty.delete(p);
      updSaving();
    }
  },
  flushAll(){Object.keys(this.timers).forEach(p=>{if(this.dirty.has(p)&&!this.inflight[p])this.flush(p)})},
  subscribe(){
    COLS.forEach(col=>{
      try{this.db.collection(col).onSnapshot(snap=>{
        let changed=false;
        for(const ch of snap.docChanges()){
          const p=col+'/'+ch.doc.id;
          if(this.dirty.has(p)||this.inflight[p])continue;
          if(ch.type==='removed'){if(p in this.data){delete this.data[p];changed=true}}
          else{this.data[p]=clone(ch.doc.data());changed=true}
        }
        if(!this.loaded.has(col)){this.loaded.add(col);if(this.loaded.size===COLS.length)this.markReady()}
        if(changed&&this.ready){this.cache();requestRender()}
      },err=>{if(!this.loaded.has(col)){this.loaded.add(col);if(this.loaded.size===COLS.length)this.markReady()}if(err&&err.code==='revoked'){this.readOnly=true}})}catch(e){this.loaded.add(col)}
    });
  },
  markReady(){if(this.ready)return;this.ready=true;if(this._res)this._res()},
  waitReady(ms){return new Promise(r=>{if(this.ready)return r();this._res=r;setTimeout(()=>{this.markReady();r()},ms)})},
  _ct:0,cache(){clearTimeout(this._ct);this._ct=setTimeout(()=>lsSet(this.mode==='cloud'?'kf2k.cache':'kf2k.local',JSON.stringify(this.data)),900)},
  saveLocal(){lsSet('kf2k.local',JSON.stringify(this.data))},
  loadLocal(k='kf2k.local'){try{const d=JSON.parse(lsGet(k)||'{}');for(const p in d)if(d[p]!=null)this.data[p]=d[p]}catch(e){}}
};
function updSaving(){const busy=Store.mode==='cloud'&&(Store.dirty.size>0);$('#saving').hidden=!busy}
const S=()=>{const s=Store.ensure('ko/settings',()=>clone(DEFAULT_SETTINGS));for(const k in DEFAULT_SETTINGS)if(s[k]===undefined)s[k]=clone(DEFAULT_SETTINGS[k]);return s};

})();

function toast(msg,kind='',sub=''){const el=document.createElement('div');el.className='toast';const icn=kind==='err'?ico('warn','t-gold'):kind==='ok'?ico('check','t-silver'):ico('info');el.innerHTML=`${icn}<div><b>${esc(msg)}</b>${sub?`<small>${esc(sub)}</small>`:''}</div>`;$('#toasts').appendChild(el);if(kind==='err')Snd.play('err');setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),320)},kind==='err'?4200:2600)}
function trophyToast(t){const el=document.createElement('div');el.className='toast';el.innerHTML=`${ico('trophy','t-'+t.tier)}<div><small>You earned a trophy</small><b>${esc(t.n)}</b></div>`;$('#toasts').appendChild(el);Snd.play('trophy');setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),320)},4200)}
const CB=[];const cb=fn=>{CB.push(fn);return CB.length-1};
function openSheet(html){const sh=$('#sheet');sh.innerHTML=html;sh.hidden=false;$('#scrim').hidden=false;$('#opts').hidden=true;Snd.play('open');const f=sh.querySelector('[autofocus]');if(f&&matchMedia('(pointer:fine)').matches)setTimeout(()=>f.focus(),60)}
function closeSheet(silent){if($('#sheet').hidden&&$('#opts').hidden)return;$('#sheet').hidden=true;$('#opts').hidden=true;$('#scrim').hidden=true;$('#sheet').innerHTML='';if(!silent)Snd.play('back');if(pendingRender){pendingRender=false;render()}}
function fieldHtml(f){const id='f_'+f.key,v=f.value??'';const lab=`<span>${esc(f.label)}</span>`;
  if(f.type==='textarea')return `<label class="field">${lab}<textarea class="in" id="${id}" placeholder="${esc(f.ph||'')}" ${f.rows?`rows="${f.rows}"`:''}>${esc(v)}</textarea></label>`;
  if(f.type==='select')return `<label class="field">${lab}<select class="in" id="${id}">${f.options.map(o=>`<option value="${esc(o.v)}" ${String(o.v)===String(v)?'selected':''}>${esc(o.l)}</option>`).join('')}</select></label>`;
  return `<label class="field">${lab}<input class="in" id="${id}" type="${f.type||'text'}" value="${esc(v)}" placeholder="${esc(f.ph||'')}" ${f.type==='number'?'inputmode="decimal" step="any"':''} ${f.af?'autofocus':''}></label>`}
function openForm({title,fields,submit='Save',onSave,onDelete,intro=''}){
  const rows=[];for(let i=0;i<fields.length;i++){const f=fields[i];if(f.half&&fields[i+1]&&fields[i+1].half){rows.push(`<div class="f2">${fieldHtml(f)}${fieldHtml(fields[i+1])}</div>`);i++}else rows.push(fieldHtml(f))}
  openSheet(`<div class="sh-h"><div class="sh-t">${esc(title)}</div><button class="sh-x" data-act="closeSheet">Cancel</button></div>${intro}<form class="fgrid" id="sheetForm">${rows.join('')}<div class="sh-actions">${onDelete?`<button type="button" class="btn danger" data-act="cb" data-i="${cb(el=>armDelete(el,onDelete))}">Delete</button>`:''}<span class="sp"></span><button class="btn pri" type="submit">${esc(submit)}</button></div></form>`);
  $('#sheetForm').onsubmit=e=>{e.preventDefault();const v={};fields.forEach(f=>{const el=document.getElementById('f_'+f.key);let x=el?el.value:'';if(f.type==='number')x=x===''?null:Number(x);else x=String(x).trim();v[f.key]=x});if(onSave(v)!==false){closeSheet(true);Snd.play('check');render()}};
}
function armDelete(el,fn){if(el.dataset.armed){fn();closeSheet(true);Snd.play('back');render();return}el.dataset.armed='1';el.textContent='Tap again to delete';Snd.play('err');setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.textContent='Delete'}},3000)}
function openOpts(title,items){const o=$('#opts');o.innerHTML=`<div class="lbl">${esc(title)}</div>${items.map(it=>`<button class="opt ${it.danger?'danger':''}" data-act="cb" data-i="${cb(el=>{if(it.danger&&!el.dataset.armed){el.dataset.armed='1';el.lastChild.textContent='Tap again to confirm';Snd.play('err');return}closeSheet(true);it.fn();render()})}">${ico(it.icon||'next')}<span>${esc(it.label)}</span></button>`).join('')}<span style="flex:1"></span><button class="opt" data-act="closeSheet">${ico('back')}<span>Close</span></button>`;o.hidden=false;$('#scrim').hidden=false;$('#sheet').hidden=true;Snd.play('open')}
async function copyText(text,label='Copied'){try{await navigator.clipboard.writeText(text);toast(label,'ok');Snd.play('check')}catch(e){openSheet(`<div class="sh-h"><div class="sh-t">Copy this</div><button class="sh-x" data-act="closeSheet">Done</button></div><p class="muted small">Press and hold, then Copy.</p><textarea class="in" id="copyBox" rows="10">${esc(text)}</textarea>`);const b=$('#copyBox');b.focus();b.select()}}
function ring(p,size=112,stroke=6){const r=(size-stroke)/2,C=2*Math.PI*r,c=size/2;return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="${stroke}"/><circle class="rv" cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${p>=1?'#8df0b2':'#ff3341'}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C*(1-Math.min(1,Math.max(0,p)))).toFixed(2)}" transform="rotate(-90 ${c} ${c})"/></svg>`}
const tog=(on,act,data='')=>`<button class="tog ${on?'on':''}" data-act="${act}" ${data} role="switch" aria-checked="${on?'true':'false'}"></button>`;
const rowHtml=({act,data='',icon,iconCls='',iconHtml,t,s,side=''})=>`<button class="row" data-act="${act}" ${data}><span class="row-ic ${iconCls}">${iconHtml||ico(icon||'next')}</span><span class="row-main"><span class="row-t">${esc(t)}</span>${s?`<span class="row-s">${esc(s)}</span>`:''}</span><span class="row-side">${side}</span></button>`;

/* ================= domain ================= */
const skateDoc=()=>{const d=Store.ensure('ko/skate',()=>({step:0,best:{},att:0,lands:0}));d.best=d.best||{};return d};
const liveDoc=()=>Store.ensure('ko/live',()=>({skate:null,lift:null}));
const prDoc=()=>Store.ensure('ko/prs',()=>({}));
const saveLive=()=>Store.touch('ko/live');
const plan=()=>S().plan||PLAN_DEFAULT;
const dayActs=d=>plan()[String(d.getDay())]||['rest'];
function sessionsOf(col){const out=[];for(const p in Store.data)if(p.startsWith(col+'/')&&Store.data[p])for(const s of (Store.data[p].sessions||[]))out.push(Object.assign({_doc:p},s));return out.sort((a,b)=>b.start-a.start)}
function pushSession(col,s){const p=col+'/'+ymOf(new Date(s.start));const d=Store.ensure(p,()=>({sessions:[]}));d.sessions=d.sessions||[];d.sessions.push(s);Store.touch(p)}
function actDone(act,d){const k=ymd(d);const a=ACTS[act];if(!a)return false;if(a.kind==='rest')return true;if(a.kind==='skate')return sessionsOf('skate').some(s=>s.date===k);return sessionsOf('lift').some(s=>s.date===k&&s.wid===act)}
function weekStats(mon){let t=0,d=0;for(let i=0;i<7;i++){const day=addDays(mon,i);for(const a of dayActs(day)){if(ACTS[a]&&ACTS[a].kind==='rest')continue;t++;if(actDone(a,day))d++}}return{t,d,pct:t?d/t:0}}
const stepIdx=()=>Math.min(LADDER.length-1,skateDoc().step||0);
const allCleared=()=>(skateDoc().step||0)>=LADDER.length;
const trickName=id=>(LADDER.find(s=>s.id===id)||{}).n||id;
function lastSetsFor(ex){for(const s of sessionsOf('lift')){const sets=(s.sets||[]).filter(x=>x.ex===ex);if(sets.length)return sets}return null}
function suggest(exId){const e=EX[exId];const last=lastSetsFor(exId);const u=e.unit==='s'?'s':'';
  if(!last)return{w:null,r:e.hi,note:e.inc?`First time: pick a weight you could do about ${e.hi+2} times`:`Aim for ${e.hi}${u}`};
  const topW=Math.max(0,...last.map(s=>s.w||0));const work=last.filter(s=>(s.w||0)===topW);const allHit=work.length>=e.sets&&work.every(s=>s.r>=e.hi);
  if(!e.inc){const best=Math.max(...last.map(s=>s.r||0));return{w:null,r:e.amrap?best+1:Math.min(e.hi,best+(allHit?0:2)),note:`Last: ${last.map(s=>s.r+u).join(', ')}${e.amrap?` · beat ${best}`:''}`}}
  const w=allHit?Math.round((topW+e.inc)*10)/10:topW;return{w,r:allHit?e.lo:e.hi,note:`Last: ${topW}kg × ${last.map(s=>s.r).join(', ')}${allHit?` · all sets hit ${e.hi}, go up to ${w}kg`:` · hit ${e.hi} on every set to go up`}`}}

/* trophies */
function award(id){const s=S();s.trophies=s.trophies||{};if(s.trophies[id])return;s.trophies[id]=Date.now();saveS();const t=TROPHIES.find(x=>x.id===id);if(t)setTimeout(()=>trophyToast(t),300);if(id!=='plat'&&TROPHIES.filter(x=>x.id!=='plat').every(x=>s.trophies[x.id]))award('plat')}
let _tq=0;function queueTrophyCheck(){clearTimeout(_tq);_tq=setTimeout(checkTrophies,700)}
function checkTrophies(){if(!Store.ready)return;try{const sk=skateDoc();if(sessionsOf('skate').length)award('skate1');if((sk.att||0)>=1000)award('att1000');LADDER.forEach((s,i)=>{if((sk.step||0)>i)award(s.id)});
  const ls=sessionsOf('lift');if(ls.length)award('lift1');if(ls.length>=12)award('lift12');if(ls.some(s=>s.wid==='c'&&s.complete))award('dead');
  const mon=mondayOf(new Date());const lw=addDays(mon,-7);[mon,lw].forEach(m=>{const st=weekStats(m);if(st.t&&st.d>=st.t)award('week')})}catch(e){}renderStatus()}

/* ================= view and render ================= */
const view={cat:0,dir:1,panel:null};
let pendingRender=false,rq=0;
const isTyping=()=>{const a=document.activeElement;return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&(a.closest('#col')||a.closest('#panel'))};
function requestRender(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;if(isTyping()||!$('#sheet').hidden){pendingRender=true;return}render()})}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRender&&!isTyping()&&$('#sheet').hidden){pendingRender=false;render()}},80));
function renderStatus(){const now=new Date();$('#clock').textContent=`${pad(now.getDate())}/${pad(now.getMonth()+1)} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const st=Store.ready?weekStats(mondayOf(now)):{pct:0};const b=$('#batt b');b.querySelector('i').style.width=`calc(${Math.round(st.pct*100)}% - 2px)`;b.classList.toggle('low',st.pct<.25);$('#batt').title=`This week ${Math.round(st.pct*100)}%`;
  $('#sndBtn').innerHTML=ico(S().sound!==false?'sndOn':'sndOff');
  const L=Store.ready?liveDoc():{};const r=L.skate||L.lift;$('#tchip').innerHTML=r?`<button class="tchip" data-act="resume"><i class="dotp"></i><span>${L.skate?'Skate':'Lift'}</span><span data-tick="${r.start}">${fmtHMS(Date.now()-r.start)}</span></button>`:''}
function renderRail(){const tr=$('#track');if(!tr.children.length)tr.innerHTML=CATS.map((c,i)=>`<button class="cat" data-act="cat" data-i="${i}" aria-label="${c.label}">${ico(c.icon)}<span class="cat-l">${c.label}</span></button>`).join('');
  [...tr.children].forEach((el,i)=>{el.classList.toggle('on',i===view.cat);el.setAttribute('aria-current',i===view.cat?'page':'false')});
  const sel=tr.children[view.cat];const anchor=Math.max(10,parseFloat(getComputedStyle($('.col')).paddingLeft)-8);tr.style.transform=`translateX(${anchor-sel.offsetLeft}px)`}
const RENDER={},PANELS={};
function render(){if(!Store.ready)return;renderStatus();renderRail();const col=$('#col');const id=CATS[view.cat].id;const keep=col.dataset.cat===id?col.scrollTop:0;
  let html='';try{html=RENDER[id]()}catch(e){console.error(e);html=`<p class="empty">This section hit an error: ${esc(e.message)}</p>`}
  const anim=col.dataset.cat&&col.dataset.cat!==id?(view.dir>0?'in-r':'in-l'):'';col.innerHTML=`<div class="col-in ${anim}">${html}</div>`;col.dataset.cat=id;col.scrollTop=keep;if(view.panel)renderPanel()}
function goCat(i){if(i<0||i>=CATS.length||i===view.cat)return;view.dir=i>view.cat?1:-1;view.cat=i;view.panel=null;$('#panel').hidden=true;lsSet('kf2k.cat',CATS[i].id);Snd.play('move');render()}
function renderPanel(){const pn=view.panel;const el=$('#panel');if(!pn){el.hidden=true;return}const fn=PANELS[pn.type];let r=null;try{r=fn&&fn(pn)}catch(e){console.error(e);r={title:'Error',body:`<p class="empty">${esc(e.message)}</p>`}}
  if(!r){view.panel=null;el.hidden=true;return}const body=el.querySelector('.panel-b');const key=pn.type+(pn.id||'');const keep=body&&el.dataset.key===key?body.scrollTop:0;
  el.hidden=false;el.setAttribute('style',el.dataset.key?'animation:none':'');
  el.innerHTML=`<div class="panel-h"><button class="back" data-act="closePanel">${ico('back')}${esc(r.back||CATS[view.cat].label)}</button><div class="panel-t">${esc(r.title)}</div></div><div class="panel-b"><div class="panel-in">${r.body}</div></div>`;el.dataset.key=key;el.querySelector('.panel-b').scrollTop=keep}
function openPanel(type,id){view.panel={type,id};const el=$('#panel');el.dataset.key='';el.removeAttribute('style');el.hidden=true;Snd.play('open');renderPanel()}

/* ================= TODAY ================= */
RENDER.today=()=>{const now=new Date(),mon=mondayOf(now),wk=weekStats(mon);const L=liveDoc();const sk=skateDoc();const i=stepIdx();
  let h=`<section class="hero"><div class="lbl">${DOWL[now.getDay()]}</div><div class="hero-d">${now.getDate()} ${MONL[now.getMonth()]}</div></section>`;
  if(L.skate||L.lift)h+=`<section class="plate tcard"><div class="lbl">In progress</div><div class="tc-row"><b>${L.skate?'Skate session':esc(WORKOUTS[L.lift.wid].n)}</b><span class="tc-el" data-tick="${(L.skate||L.lift).start}">${fmtHMS(Date.now()-(L.skate||L.lift).start)}</span><button class="btn sm pri" data-act="resume">Resume</button></div></section>`;
  const acts=dayActs(now);
  h+=`<section><div class="lbl">Today's plan</div><div class="list">${acts.map(a=>{const A_=ACTS[a];if(!A_)return '';const done=actDone(a,now);const act=A_.kind==='skate'?'goSkate':A_.kind==='lift'?'openWorkout':'goPlan';return rowHtml({act,data:`data-id="${a}"`,icon:A_.icon,iconCls:done&&A_.kind!=='rest'?'ok':A_.kind==='rest'?'':'acc',t:A_.n,s:A_.kind==='rest'?'Stretch 10 minutes, walk, sleep well':done?'Done today':A_.kind==='skate'?`Working on: ${allCleared()?'Kickflips for fun':LADDER[i].n}`:WORKOUTS[a].sub,side:done&&A_.kind!=='rest'?`<span class="chip ok">Done</span>`:''})}).join('')}</div></section>`;
  h+=`<section><div class="lbl-row"><div class="lbl">Road to kickflip</div><span class="num muted small">${Math.min(sk.step||0,LADDER.length)} of ${LADDER.length}</span></div><button class="hero-fri" data-act="goSkate"><span style="flex:1;min-width:0"><b>${allCleared()?'Kickflip landed. Legend.':esc(LADDER[i].n)}</b><small>${allCleared()?'Keep them clean':`${esc(LADDER[i].goal)}: ${LADDER[i].need} in one session`}</small><span class="stagebar" style="margin-top:9px">${LADDER.map((s,j)=>`<i class="${j<(sk.step||0)?'on':''}"></i>`).join('')}</span></span></button></section>`;
  h+=weekBlock(mon,wk);
  return h};
function weekBlock(mon,wk){const today=ymd(new Date());return `<section><div class="lbl-row"><div class="lbl">This week · ${wk.d} of ${wk.t}</div><button class="btn sm ghost" data-act="goPlan">Plan</button></div><div class="week7">${[0,1,2,3,4,5,6].map(i=>{const d=addDays(mon,i);const acts=dayActs(d).filter(a=>ACTS[a]);const real=acts.filter(a=>ACTS[a].kind!=='rest');const hit=real.length&&real.every(a=>actDone(a,d));return `<button class="dcell ${ymd(d)===today?'today':''} ${hit?'hit':''}" data-act="dayOpts" data-d="${ymd(d)}"><span>${DOW[d.getDay()].slice(0,2)}</span>${ico(acts[0]?ACTS[acts[0]].icon:'moon')}<span class="dots">${real.map(a=>`<i class="${actDone(a,d)?'on':''}"></i>`).join('')}</span></button>`}).join('')}</div></section>`}

/* ================= SKATE ================= */
RENDER.skate=()=>{const L=liveDoc(),sk=skateDoc(),i=stepIdx();let h='';
  if(L.skate){const s=L.skate;const cur=LADDER.find(x=>x.id===s.cur)||LADDER[i];const c=(s.c&&s.c[cur.id])||{a:0,l:0};const tot=Object.values(s.c||{}).reduce((m,x)=>({a:m.a+x.a,l:m.l+x.l}),{a:0,l:0});const isGoal=LADDER.indexOf(cur)===(sk.step||0);
    h+=`<section class="plate" style="display:grid;gap:14px"><div class="lbl-row" style="margin:0"><div class="lbl">Session · <span data-tick="${s.start}">${fmtHMS(Date.now()-s.start)}</span></div><button class="btn sm ghost" data-act="pickTrick">Switch trick</button></div>
    <div><div class="player-ex">${esc(cur.n)}</div><div class="muted small" style="margin-top:4px">${isGoal?`Goal: ${cur.need} ${esc(cur.unit)} this session to unlock the next step`:'Practice'}</div></div>
    ${isGoal?`<div><div class="lbl-row" style="margin-bottom:6px"><span class="num">${c.l} / ${cur.need}</span><span class="num muted small">${c.a?Math.round(c.l/c.a*100):0}% landed</span></div><div class="bar ${c.l>=cur.need?'ok':''}"><i style="width:${Math.min(100,c.l/cur.need*100).toFixed(1)}%"></i></div></div>`:''}
    <div class="bigbtns"><button class="big" data-act="skTry">Bail<small>${c.a-c.l} missed</small></button><button class="big land" data-act="skLand">Landed<small>${c.l} landed</small></button></div>
    <div class="statrow"><div><b>${tot.a}</b><small>Tries</small></div><div><b>${tot.l}</b><small>Landed</small></div><div><b>${tot.a?Math.round(tot.l/tot.a*100):0}%</b><small>Rate</small></div></div>
    <div class="btns"><button class="btn ghost" data-act="skUndo">Undo</button><span style="flex:1"></span><button class="btn pri" data-act="skEnd">${ico('stop')}End session</button></div></section>`;
    h+=tipsBlock(cur)}
  else{const cur=allCleared()?LADDER[LADDER.length-1]:LADDER[i];
    h+=`<section class="plate" style="display:grid;gap:12px"><div class="lbl">${allCleared()?'All steps cleared':`Step ${i+1} of ${LADDER.length}`}</div><div class="player-ex">${esc(cur.n)}</div><div class="muted">${esc(cur.goal)}: ${cur.need} in one session · ${esc(cur.where)}</div><div class="btns"><button class="btn pri" data-act="skStart">${ico('play')}Start session</button></div></section>`;
    h+=tipsBlock(cur)}
  h+=`<section><div class="lbl">The ladder</div><div class="list">${LADDER.map((s,j)=>{const st=j<(sk.step||0)?'done':j===(sk.step||0)?'cur':'lock';return `<button class="step ${st}" data-act="openStep" data-id="${s.id}"><span class="step-n">${st==='done'?'✓':j+1}</span><span class="row-main"><span class="row-t">${esc(s.n)}</span><span class="row-s">${st==='done'?`Cleared · best ${sk.best[s.id]||0} in a session`:`${s.need} ${esc(s.unit)} in one session`}</span></span></button>`}).join('')}</div></section>`;
  return h};
const tipsBlock=s=>`<section><div class="lbl">How to</div><ul class="tips">${s.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><p class="flag" style="margin-top:12px">${ico('warn')}<span>${esc(s.safe)}</span></p></section>`;
PANELS.step=pn=>{const s=LADDER.find(x=>x.id===pn.id);if(!s)return null;const sk=skateDoc();const j=LADDER.indexOf(s);const st=j<(sk.step||0)?'done':j===(sk.step||0)?'cur':'lock';
  const hist=sessionsOf('skate').filter(x=>x.c&&x.c[s.id]&&x.c[s.id].a).slice(0,14).reverse();
  return{title:s.n,body:`<section><div class="chips"><span class="chip ${st==='done'?'ok':st==='cur'?'acc':''}">${st==='done'?'Cleared':st==='cur'?'Current step':'Locked'}</span><span class="chip">${s.need} ${esc(s.unit)} in one session</span><span class="chip">${esc(s.where)}</span></div></section>${tipsBlock(s)}
  <section><div class="lbl">Land rate by session</div>${hist.length?spark(hist.map(x=>x.c[s.id].l/x.c[s.id].a)):'<p class="empty">No sessions on this one yet.</p>'}</section>
  ${st!=='done'?`<section class="btns"><button class="btn ghost" data-act="cb" data-i="${cb(el=>armSkip(el,s))}">I can already do this</button></section>`:''}`}};
function armSkip(el,s){if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Tap again to mark it cleared';Snd.play('err');return}const sk=skateDoc();const j=LADDER.indexOf(s);if((sk.step||0)<=j){sk.step=j+1;Store.touch('ko/skate');award(s.id);Snd.play('done');Waves.flash()}view.panel=null;$('#panel').hidden=true;render()}
function spark(vals){const w=300,h=70,n=vals.length;if(!n)return '';const pts=vals.map((v,i)=>[n===1?w/2:i/(n-1)*(w-12)+6,h-8-v*(h-16)]);const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');const last=pts[n-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="Land rate trend"><line x1="0" y1="${h-8}" x2="${w}" y2="${h-8}" stroke="rgba(255,255,255,.12)"/><line x1="0" y1="8" x2="${w}" y2="8" stroke="rgba(255,255,255,.06)"/><path d="${d} L${last[0].toFixed(1)} ${h-8} L${pts[0][0].toFixed(1)} ${h-8} Z" fill="rgba(255,51,65,.16)"/><path d="${d}" fill="none" stroke="#ff3341" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="#fff"/></svg><div class="lbl-row small muted" style="margin-top:4px"><span>Oldest</span><span class="num">Last: ${Math.round(vals[n-1]*100)}%</span></div>`}

/* ================= LIFT ================= */
RENDER.lift=()=>{const L=liveDoc();const ls=sessionsOf('lift');let h='';
  if(L.lift)h+=`<section class="plate tcard"><div class="lbl">In progress</div><div class="tc-row"><b>${esc(WORKOUTS[L.lift.wid].n)}</b><span class="tc-el" data-tick="${L.lift.start}">${fmtHMS(Date.now()-L.lift.start)}</span><button class="btn sm pri" data-act="resume">Resume</button></div></section>`;
  h+=`<section><div class="lbl">Workouts</div><div class="list">${Object.values(WORKOUTS).map(w=>{const last=ls.find(s=>s.wid===w.id);const days=Object.keys(plan()).filter(k=>plan()[k].includes(w.id)).map(k=>DOW[+k]);return rowHtml({act:'openWorkout',data:`data-id="${w.id}"`,icon:w.circuit?'flame':'dumbbell',iconCls:w.circuit?'acc':'',t:w.n,s:[w.sub,days.length?days.join(', '):'',last?`last ${fmtDM(new Date(last.start))}`:'not done yet'].filter(Boolean).join(' · ')})}).join('')}</div></section>`;
  h+=`<section><div class="lbl">Recent</div>${ls.length?`<div class="list">${ls.slice(0,8).map(s=>rowHtml({act:'sessOpen',data:`data-c="lift" data-doc="${s._doc}" data-id="${s.id}"`,icon:s.wid==='c'?'flame':'dumbbell',t:WORKOUTS[s.wid].n,s:`${fmtD(new Date(s.start))} · ${fmtDur(s.end-s.start)}${s.sets?` · ${plural(s.sets.length,'set')}`:''}`})).join('')}</div>`:'<p class="empty">No lifts logged yet. Monday is Legs and Pop.</p>'}</section>`;
  return h};
PANELS.workout=pn=>{const w=WORKOUTS[pn.id];if(!w)return null;let b='';
  if(w.circuit){const c=w.circuit;b=`<section><p class="muted">${esc(w.sub)}. ${c.rounds} rounds of ${c.stations.length} moves, ${c.work} seconds on and ${c.rest} off, ${c.roundRest} seconds between rounds. About ${Math.round((c.rounds*c.stations.length*(c.work+c.rest)+(c.rounds-1)*c.roundRest)/60)} minutes. Use one dumbbell you could press about 12 times.</p></section><section><div class="lbl">Stations</div><div class="list">${c.stations.map((s,i)=>rowHtml({act:'noop',iconHtml:`<b class="num">${i+1}</b>`,t:s,s:`${c.work}s`})).join('')}</div></section>`}
  else b=`<section><p class="muted">${esc(w.sub)}. Weights come from your last session.</p></section><section><div class="list">${w.ex.map(id=>{const e=EX[id];const sg=suggest(id);return rowHtml({act:'noop',icon:e.eq==='Bodyweight'?'user':'dumbbell',t:e.n,s:`${e.sets} × ${e.lo===e.hi?e.hi:e.lo+' to '+e.hi}${e.unit==='s'?' sec':''}${e.each?' each side':''} · ${e.eq}${sg.w?` · ${sg.w}kg`:''}`})}).join('')}</div></section>`;
  b+=`<section class="btns"><button class="btn pri" data-act="liftStart" data-id="${w.id}">${ico('play')}Start${S().warmup!==false?' with warmup':''}</button></section>`;
  return{title:w.n,body:b}};

/* player */
function liftNew(wid){const w=WORKOUTS[wid];const warm=S().warmup!==false;const L={wid,start:Date.now(),sets:[]};
  if(warm){L.phase='warm';L.wi=0;L.endAt=Date.now()+WARMUP[0][1]*1000}else liftBegin(L);return L}
function liftBegin(L){const w=WORKOUTS[L.wid];if(w.circuit){L.phase='work';L.round=1;L.st=0;L.endAt=Date.now()+w.circuit.work*1000}else{L.phase='work';L.ei=0;L.si=0}L.wi=null}
PANELS.player=()=>{const L=liveDoc().lift;if(!L)return null;const w=WORKOUTS[L.wid];const left=L.paused!=null?L.paused:Math.max(0,(L.endAt||0)-Date.now());let b='';
  if(L.phase==='warm'){const [n,sec]=WARMUP[L.wi];b=`<section class="restbox"><div class="lbl">Warmup ${L.wi+1} of ${WARMUP.length}</div><div class="player-ex" style="text-align:center">${esc(n)}</div><div class="ringbox">${ring(1-left/(sec*1000),200,8)}<div class="rt"><div><b data-cd>${fmtMS(left)}</b><small>Warmup</small></div></div></div><div class="muted small">Next: ${L.wi+1<WARMUP.length?esc(WARMUP[L.wi+1][0]):'Workout'}</div></section><section class="btns" style="justify-content:center"><button class="btn" data-act="warmNext">Next</button><button class="btn ghost" data-act="warmSkip">Skip warmup</button></section>`}
  else if(w.circuit){const c=w.circuit;const tot=L.phase==='work'?c.work:L.phase==='rest'?c.rest:c.roundRest;const nm=L.phase==='work'?c.stations[L.st]:L.phase==='rest'?'Rest':'Round break';const nx=L.phase==='work'?(L.st+1<c.stations.length?c.stations[L.st+1]:(L.round<c.rounds?'Round break':'Done')):c.stations[L.phase==='roundRest'?0:Math.min(L.st+1,c.stations.length-1)];
    b=`<section class="restbox"><div class="lbl">Round ${L.round} of ${c.rounds} · move ${L.st+1} of ${c.stations.length}</div><div class="player-ex" style="text-align:center;${L.phase!=='work'?'color:var(--dim)':''}">${esc(nm)}</div><div class="ringbox">${ring(1-left/(tot*1000),200,8)}<div class="rt"><div><b data-cd>${fmtMS(left)}</b><small>${L.phase==='work'?'Go':'Breathe'}</small></div></div></div><div class="muted">Next: ${esc(nx)}</div></section>
    <section class="btns" style="justify-content:center"><button class="btn" data-act="cPause">${L.paused!=null?ico('play')+'Resume':ico('pause')+'Pause'}</button><button class="btn ghost" data-act="cSkip">Skip</button></section>`}
  else{const id=w.ex[L.ei];const e=EX[id];const sg=suggest(id);const done=L.sets.filter(x=>x.ex===id);const bw=!e.inc;const u=e.unit==='s'?'sec':(e.each?'reps each':'reps');
    if(L.phase==='rest'){const nextEx=EX[w.ex[L.ei]];b+=`<section class="restbox"><div class="lbl">Rest</div><div class="ringbox">${ring(1-left/((L.restFor||60)*1000),200,8)}<div class="rt"><div><b data-cd>${fmtMS(left)}</b><small>Rest</small></div></div></div><div class="muted">Next: ${esc(nextEx.n)}, set ${L.si+1}</div><button class="btn" data-act="restSkip">Skip rest</button></section>`}
    b+=`<section style="display:grid;gap:6px"><div class="lbl">Exercise ${L.ei+1} of ${w.ex.length} · ${esc(e.eq)}</div><div class="player-ex">${esc(e.n)}</div><div class="muted">${esc(e.cue)}</div><div class="chips" style="margin-top:6px"><span class="chip acc">${e.sets} × ${e.lo===e.hi?e.hi:e.lo+' to '+e.hi} ${u}</span><span class="chip">${esc(sg.note)}</span></div></section>
    <section>${Array.from({length:e.sets},(_,k)=>{const d=done[k];const isCur=!d&&k===done.length;return `<div class="setrow ${d?'done':''}"><span class="sn">${k+1}</span>${bw?`<span class="muted small" style="text-align:center">Body</span>`:`<input class="in" id="w_${k}" type="number" inputmode="decimal" step="0.5" value="${d?d.w:(done.length?done[done.length-1].w:(sg.w??''))}" placeholder="kg" ${d?'disabled':''} aria-label="Weight in kg">`}<input class="in" id="r_${k}" type="number" inputmode="numeric" value="${d?d.r:(done.length?done[done.length-1].r:sg.r)}" ${d?'disabled':''} aria-label="${u}"><button class="ck ${d?'on':''}" data-act="${d?'noop':isCur?'setLog':'noop'}" data-k="${k}" ${!d&&!isCur?'style="opacity:.3"':''} aria-label="Log set">${ico('check')}</button></div>`}).join('')}<div class="setrow"><span></span><span class="muted small" style="text-align:center">${bw?'':'kg'}</span><span class="muted small" style="text-align:center">${u}</span><span></span></div></section>
    <section class="btns">${L.ei>0?`<button class="btn ghost" data-act="exPrev">${ico('back')}Previous</button>`:''}${L.ei<w.ex.length-1?`<button class="btn ghost" data-act="exNext">Skip exercise${ico('next')}</button>`:''}</section>`}
  b+=`<section class="btns" style="margin-top:8px"><button class="btn danger" data-act="cb" data-i="${cb(el=>{if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Tap again to discard';Snd.play('err');return}liveDoc().lift=null;saveLive();view.panel=null;$('#panel').hidden=true;Snd.play('back');render()})}">Discard</button><span style="flex:1"></span><button class="btn pri" data-act="liftFinish">${ico('check')}Finish</button></section>`;
  return{title:w.n,back:'Lift',body:b}};
function liftAdvance(){const L=liveDoc().lift;if(!L)return;const w=WORKOUTS[L.wid];const now=Date.now();
  if(L.phase==='warm'){L.wi++;if(L.wi>=WARMUP.length){liftBegin(L);Snd.play('go')}else{L.endAt=now+WARMUP[L.wi][1]*1000;Snd.play('go')}}
  else if(w&&w.circuit){const c=w.circuit;
    if(L.phase==='work'){if(L.st+1<c.stations.length){L.phase='rest';L.endAt=now+c.rest*1000}else if(L.round<c.rounds){L.phase='roundRest';L.endAt=now+c.roundRest*1000}else{L.complete=true;saveLive();liftFinish(true);return}Snd.play('beep')}
    else if(L.phase==='rest'){L.phase='work';L.st++;L.endAt=now+c.work*1000;Snd.play('go')}
    else{L.phase='work';L.round++;L.st=0;L.endAt=now+c.work*1000;Snd.play('go')}}
  else if(L.phase==='rest'){L.phase='work';L.endAt=null;Snd.play('go')}
  saveLive();renderPanel()}
function liftFinish(auto){const L=liveDoc().lift;if(!L)return;const w=WORKOUTS[L.wid];const end=Date.now();
  if(!w.circuit&&!L.sets.length&&!auto){toast('Log at least one set first','err');return}
  const pr=prDoc();let newPr=[];
  if(!w.circuit)for(const s of L.sets){const e=EX[s.ex];const best=pr[s.ex];const score=e.inc?(s.w||0)*1000+s.r:s.r;const bs=best?(e.inc?(best.w||0)*1000+best.r:best.r):-1;if(s.r>=(e.amrap?1:e.lo)&&score>bs){if(best)newPr.push(e.n);pr[s.ex]={w:s.w||null,r:s.r,date:ymd(new Date())}}}
  if(Object.keys(pr).length)Store.touch('ko/prs');
  pushSession('lift',{id:uid(),date:ymd(new Date(L.start)),wid:L.wid,start:L.start,end,sets:L.sets,complete:!!L.complete||!w.circuit});
  liveDoc().lift=null;saveLive();view.panel=null;$('#panel').hidden=true;Snd.play('done');Waves.flash();
  toast(w.circuit?(L.complete?'DEAD Circuit done':'Circuit saved'):`${w.n} done`,'ok',`${fmtDur(end-L.start)}${newPr.length?` · new best: ${newPr.slice(0,2).join(', ')}`:''}`);
  if(newPr.length)award('pr');if(w.circuit&&L.complete)award('dead');queueTrophyCheck();render()}

/* ================= PLAN ================= */
RENDER.plan=()=>{const mon=mondayOf(new Date());const order=[1,2,3,4,5,6,0];
  return `${weekBlock(mon,weekStats(mon))}
  <section><div class="lbl">Every week</div><div class="list">${order.map(k=>{const acts=(plan()[String(k)]||[]).filter(a=>ACTS[a]);return rowHtml({act:'dayOpts',data:`data-k="${k}"`,icon:acts[0]?ACTS[acts[0]].icon:'moon',t:DOWL[k],s:acts.map(a=>ACTS[a].n).join(' + ')||'Rest'})}).join('')}</div></section>
  <section class="plate"><div class="lbl">Why this plan</div><ul class="tips"><li>Skate little and often. Short sessions 4 to 5 days a week beat one long one for learning tricks.</li><li>Three lifts on Monday, Wednesday and Friday with a day between, so your legs recover.</li><li>Legs and Pop builds the jump and ankle strength your ollie and flick run on.</li><li>Friday's DEAD Circuit is the one that flattens you. Saturday's long skate is lighter on the legs than it sounds, so stop when you get sloppy.</li><li>Sunday is rest. That is when you get stronger.</li></ul></section>
  ${S().plan?`<section class="btns"><button class="btn ghost" data-act="planReset">Back to the default plan</button></section>`:''}`};

/* ================= LOG ================= */
RENDER.log=()=>{const ss=sessionsOf('skate'),ls=sessionsOf('lift'),sk=skateDoc(),pr=prDoc();const cur=LADDER[stepIdx()];
  const hist=ss.filter(x=>x.c&&x.c[cur.id]&&x.c[cur.id].a).slice(0,14).reverse();
  let streak=0;for(let i=0;i<120;i++){const d=ymd(addDays(new Date(),-i));if(ss.some(s=>s.date===d)||ls.some(s=>s.date===d))streak++;else if(i>0)break}
  return `<section class="kv"><div><small>Day streak</small><b>${streak}</b></div><div><small>Skate sessions</small><b>${ss.length}</b></div><div><small>Tries</small><b>${sk.att||0}</b></div><div><small>Landed</small><b>${sk.lands||0}</b></div><div><small>Lifts</small><b>${ls.length}</b></div></section>
  <section><div class="lbl">${esc(cur.n)} · land rate</div>${hist.length?spark(hist.map(x=>x.c[cur.id].l/x.c[cur.id].a)):'<p class="empty">Log a session to see your trend.</p>'}</section>
  <section><div class="lbl">Best lifts</div>${Object.keys(pr).length?`<div class="rtable">${Object.keys(pr).filter(k=>EX[k]).map(k=>`<div class="rt-row"><span>${esc(EX[k].n)}<small>${fmtDM(parseYmd(pr[k].date))}</small></span><span class="num">${pr[k].w?pr[k].w+'kg':''}</span><span class="num">${pr[k].r}${EX[k].unit==='s'?'s':' reps'}</span></div>`).join('')}</div>`:'<p class="empty">Your bests show up after your first lift.</p>'}</section>
  <section><div class="lbl">History</div>${[...ss.map(s=>({s,k:'skate'})),...ls.map(s=>({s,k:'lift'}))].sort((a,b)=>b.s.start-a.s.start).slice(0,20).map(({s,k})=>{const t=k==='skate'?Object.values(s.c||{}).reduce((m,x)=>({a:m.a+x.a,l:m.l+x.l}),{a:0,l:0}):null;return rowHtml({act:'sessOpen',data:`data-c="${k}" data-doc="${s._doc}" data-id="${s.id}"`,icon:k==='skate'?'board':s.wid==='c'?'flame':'dumbbell',t:k==='skate'?`Skate · ${t.l} of ${t.a} landed`:WORKOUTS[s.wid].n,s:`${fmtD(new Date(s.start))} · ${fmtDur(s.end-s.start)}`})}).join('')||'<p class="empty">Nothing yet. Pick the board up and press start.</p>'}</section>`};

/* ================= SYSTEM ================= */
RENDER.system=()=>{const s=S();const got=Object.keys(s.trophies||{}).length;
  return `<section><div class="lbl">Settings</div><div class="list">
  <div class="row" style="cursor:default"><span class="row-ic">${ico('sndOn')}</span><span class="row-main"><span class="row-t">Sound effects</span><span class="row-s">Ticks, beeps and countdowns</span></span>${tog(s.sound!==false,'toggleSound')}</div>
  <div class="row" style="cursor:default"><span class="row-ic">${ico('flame')}</span><span class="row-main"><span class="row-t">Warmup before lifts</span><span class="row-s">4 minutes, guided</span></span>${tog(s.warmup!==false,'toggleWarm')}</div>
  <div class="row" style="cursor:default"><span class="row-ic">${ico('play')}</span><span class="row-main"><span class="row-t">Boot screen</span><span class="row-s">Start up animation and chime</span></span>${tog(s.boot!==false,'toggleBoot')}</div></div></section>
  <section><div class="lbl">Trophies</div><div class="trophies">${TROPHIES.map(t=>{const g=s.trophies&&s.trophies[t.id];return `<div class="tro ${g?'':'lock'}">${ico('trophy','t-'+t.tier)}<b>${esc(t.n)}</b><small>${esc(t.d)}</small><small>${g?'Earned '+fmtDM(new Date(g)):t.tier==='plat'?'Platinum':t.tier[0].toUpperCase()+t.tier.slice(1)}</small></div>`}).join('')}</div><p class="muted small">${got} of ${TROPHIES.length} earned</p></section>
  <section><div class="lbl">Save data</div><div class="list"><div class="row" style="cursor:default"><span class="row-ic ${Store.mode==='cloud'?'ok':'warn'}">${ico('save')}</span><span class="row-main"><span class="row-t">${Store.mode==='cloud'?'Synced to your Claude account':'This device only'}</span></span></div>${rowHtml({act:'backupCopy',icon:'copy',t:'Copy backup'})}${rowHtml({act:'backupRestore',icon:'paste',t:'Restore from backup'})}</div></section>`};

/* ================= actions ================= */
const A={},IN={},CH={};
const findIn=(arr,id)=>(arr||[]).find(x=>x.id===id);
A.noop=()=>{};
A.cat=el=>goCat(+el.dataset.i);
A.closeSheet=()=>closeSheet();
A.cb=el=>{const fn=CB[+el.dataset.i];if(fn)fn(el)};
A.closePanel=()=>{view.panel=null;$('#panel').hidden=true;Snd.play('back');render()};
A.goSkate=()=>goCat(CATS.findIndex(c=>c.id==='skate'));
A.goPlan=()=>goCat(CATS.findIndex(c=>c.id==='plan'));
A.toggleSound=()=>{const s=S();s.sound=s.sound===false;saveS();Snd.init();Snd.play('check');render()};
A.toggleBoot=()=>{const s=S();s.boot=s.boot===false;saveS();lsSet('kf2k.boot',s.boot?'1':'0');render()};
A.toggleWarm=()=>{const s=S();s.warmup=s.warmup===false;saveS();Snd.play('tick');render()};
A.resume=()=>{const L=liveDoc();if(L.lift)openPanel('player');else if(L.skate)A.goSkate()};
A.openStep=el=>openPanel('step',el.dataset.id);
A.skStart=()=>{openSheet(`<div class="sh-h"><div class="sh-t">Before you roll</div><button class="sh-x" data-act="closeSheet">Cancel</button></div><div class="list">${SAFETY.map((s,i)=>`<button class="fi" data-act="cb" data-i="${cb(el=>{const c=el.querySelector('.ck');c.classList.toggle('on');Snd.play(c.classList.contains('on')?'check':'uncheck')})}"><span class="ck">${ico('check')}</span><span class="fi-t" style="font-size:15px">${esc(s)}</span></button>`).join('')}</div><div class="sh-actions" style="margin-top:14px"><span class="sp"></span><button class="btn pri" data-act="skGo">${ico('play')}Start session</button></div>`)};
A.skGo=()=>{const L=liveDoc();const i=stepIdx();L.skate={start:Date.now(),cur:LADDER[allCleared()?LADDER.length-1:i].id,c:{},h:[]};saveLive();closeSheet(true);Snd.play('go');render()};
function skHit(land){const L=liveDoc();const s=L.skate;if(!s)return;s.c=s.c||{};const c=s.c[s.cur]=s.c[s.cur]||{a:0,l:0};c.a++;if(land)c.l++;s.h=(s.h||[]).concat([[s.cur,land?1:0]]).slice(-30);saveLive();Snd.play(land?'land':'tick');
  const sk=skateDoc();const j=LADDER.findIndex(x=>x.id===s.cur);if(land&&j===(sk.step||0)&&c.l>=LADDER[j].need){sk.step=j+1;sk.best[s.cur]=Math.max(sk.best[s.cur]||0,c.l);Store.touch('ko/skate');award(s.cur);Snd.play('done');Waves.flash();toast(`${LADDER[j].n} cleared`,'ok',j+1<LADDER.length?`Next up: ${LADDER[j+1].n}`:'That is the kickflip. Legend.')}
  render()}
A.skTry=()=>skHit(false);
A.skLand=()=>skHit(true);
A.skUndo=()=>{const s=liveDoc().skate;if(!s||!(s.h||[]).length){Snd.play('err');return}const [id,l]=s.h.pop();const c=s.c[id];if(c){c.a=Math.max(0,c.a-1);if(l)c.l=Math.max(0,c.l-1)}saveLive();Snd.play('back');render()};
A.pickTrick=()=>{const sk=skateDoc();const avail=LADDER.filter((s,j)=>j<=(sk.step||0));openOpts('Practice',avail.map(s=>({label:s.n,icon:s.id===liveDoc().skate.cur?'check':'board',fn:()=>{liveDoc().skate.cur=s.id;saveLive()}})))};
A.skEnd=()=>{const L=liveDoc();const s=L.skate;if(!s)return;const end=Date.now();const tot=Object.values(s.c||{}).reduce((m,x)=>({a:m.a+x.a,l:m.l+x.l}),{a:0,l:0});
  if(tot.a){const sk=skateDoc();sk.att=(sk.att||0)+tot.a;sk.lands=(sk.lands||0)+tot.l;for(const k in s.c)sk.best[k]=Math.max(sk.best[k]||0,s.c[k].l);Store.touch('ko/skate');pushSession('skate',{id:uid(),date:ymd(new Date(s.start)),start:s.start,end,c:s.c});Snd.play('done');toast('Session saved','ok',`${tot.l} of ${tot.a} landed · ${fmtDur(end-s.start)}`)}
  else{Snd.play('back');toast('Nothing logged, session discarded')}
  L.skate=null;saveLive();queueTrophyCheck();render()};
A.openWorkout=el=>openPanel('workout',el.dataset.id);
A.liftStart=el=>{const L=liveDoc();if(L.lift&&L.lift.wid!==el.dataset.id){toast('Finish or discard the workout in progress first','err');openPanel('player');return}if(!L.lift)L.lift=liftNew(el.dataset.id);saveLive();Snd.play('go');view.panel={type:'player'};const p=$('#panel');p.dataset.key='';p.removeAttribute('style');p.hidden=true;renderPanel()};
A.warmNext=()=>liftAdvance();
A.warmSkip=()=>{const L=liveDoc().lift;liftBegin(L);saveLive();Snd.play('go');renderPanel()};
A.setLog=el=>{const L=liveDoc().lift;const w=WORKOUTS[L.wid];const id=w.ex[L.ei];const e=EX[id];const k=+el.dataset.k;const wv=document.getElementById('w_'+k);const rv=document.getElementById('r_'+k);const r=Math.round(+((rv&&rv.value)||0));const wt=e.inc?Math.round((+((wv&&wv.value)||0))*10)/10:null;
  if(!r){toast(e.unit==='s'?'Add the seconds':'Add your reps','err');return}if(e.inc&&!wt){toast('Add the weight','err');return}
  L.sets.push({ex:id,w:wt,r});const done=L.sets.filter(x=>x.ex===id).length;Snd.play('check');
  const lastEx=L.ei>=w.ex.length-1;if(done>=e.sets){if(lastEx){saveLive();renderPanel();toast('Last set done','ok','Tap Finish to save');return}L.ei++;L.si=0}else L.si=done;
  L.phase='rest';L.restFor=e.rest;L.endAt=Date.now()+e.rest*1000;saveLive();renderPanel()};
A.restSkip=()=>liftAdvance();
A.exNext=()=>{const L=liveDoc().lift;L.ei=Math.min(WORKOUTS[L.wid].ex.length-1,L.ei+1);L.si=0;L.phase='work';L.endAt=null;saveLive();Snd.play('move');renderPanel()};
A.exPrev=()=>{const L=liveDoc().lift;L.ei=Math.max(0,L.ei-1);L.phase='work';L.endAt=null;saveLive();Snd.play('move');renderPanel()};
A.cPause=()=>{const L=liveDoc().lift;if(L.paused!=null){L.endAt=Date.now()+L.paused;L.paused=null;Snd.play('go')}else{L.paused=Math.max(0,L.endAt-Date.now());Snd.play('back')}saveLive();renderPanel()};
A.cSkip=()=>{const L=liveDoc().lift;if(L.paused!=null){L.paused=null}liftAdvance()};
A.liftFinish=()=>liftFinish(false);
A.dayOpts=el=>{const k=el.dataset.k!=null?el.dataset.k:String(parseYmd(el.dataset.d).getDay());const combos=[['a','skate20'],['a'],['b'],['b','skate20'],['c'],['skate20'],['skate40'],['skate60'],['rest']];const cur=(plan()[k]||[]).join(',');
  openOpts(DOWL[+k],combos.map(cmb=>({label:cmb.map(a=>ACTS[a].n).join(' + '),icon:cmb.join(',')===cur?'check':ACTS[cmb[0]].icon,fn:()=>{const s=S();s.plan=Object.assign({},plan(),{[k]:cmb});saveS()}})))};
A.planReset=()=>{S().plan=null;saveS();Snd.play('back');render()};
A.sessOpen=el=>{const d=Store.get(el.dataset.doc);const s=d&&findIn(d.sessions,el.dataset.id);if(!s)return;const isSk=el.dataset.c==='skate';
  const body=isSk?`<div class="list">${Object.keys(s.c||{}).map(k=>`<div class="rt-row"><span>${esc(trickName(k))}</span><span class="num">${s.c[k].l}/${s.c[k].a}</span><span class="num">${s.c[k].a?Math.round(s.c[k].l/s.c[k].a*100):0}%</span></div>`).join('')}</div>`:(s.sets&&s.sets.length?`<div class="rtable">${s.sets.map(x=>`<div class="rt-row"><span>${esc((EX[x.ex]||{}).n||x.ex)}</span><span class="num">${x.w?x.w+'kg':''}</span><span class="num">${x.r}${EX[x.ex]&&EX[x.ex].unit==='s'?'s':''}</span></div>`).join('')}</div>`:`<p class="muted">${s.complete?'All rounds finished.':'Stopped early.'}</p>`);
  openSheet(`<div class="sh-h"><div class="sh-t">${isSk?'Skate session':esc(WORKOUTS[s.wid].n)}</div><button class="sh-x" data-act="closeSheet">Close</button></div><p class="muted small" style="margin-top:0">${fmtD(new Date(s.start))} · ${fmtDur(s.end-s.start)}</p>${body}<div class="sh-actions" style="margin-top:14px"><button class="btn danger" data-act="cb" data-i="${cb(b=>armDelete(b,()=>{const i=d.sessions.findIndex(x=>x.id===s.id);if(i>=0)d.sessions.splice(i,1);if(isSk){const sk=skateDoc();const t=Object.values(s.c||{}).reduce((m,x)=>({a:m.a+x.a,l:m.l+x.l}),{a:0,l:0});sk.att=Math.max(0,(sk.att||0)-t.a);sk.lands=Math.max(0,(sk.lands||0)-t.l);Store.touch('ko/skate')}Store.touch(el.dataset.doc)}))}">Delete</button></div>`)};
A.backupCopy=()=>{const out={};for(const p in Store.data)if(Store.data[p])out[p]=Store.data[p];copyText(JSON.stringify({app:'kickflip-2000',v:1,at:new Date().toISOString(),data:out}),'Backup copied')};

A.backupRestore=()=>openForm({title:'Restore backup',intro:'<p class="muted small" style="margin:0 0 12px">Paste a backup you copied earlier. It replaces what is here.</p>',fields:[{key:'json',label:'Backup text',type:'textarea',rows:8}],submit:'Restore',onSave:v=>{try{const o=JSON.parse(v.json);if(!o||o.app!=='kickflip-2000'||!o.data)throw 0;let n=0;for(const p in o.data){if(!/^(ko|skate|lift)\/[A-Za-z0-9_\-.~:@+]+$/.test(p))continue;Store.data[p]=o.data[p];Store.touch(p);n++}toast(`Restored ${n} items`,'ok')}catch(e){toast('That is not a KICKFLIP 2000 backup','err');return false}}});
/* ================= events ================= */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;if(el.tagName==='A')return;const fn=A[el.dataset.act];if(fn){e.preventDefault();Snd.init();try{fn(el,e)}catch(err){console.error(err);toast('Something went wrong','err',err.message)}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#sheet').hidden||!$('#opts').hidden)closeSheet();else if(view.panel)A.closePanel()}
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement&&document.activeElement.tagName))return;
  if(!$('#sheet').hidden||!$('#opts').hidden||view.panel||!Store.ready||!$('#boot').classList.contains('go'))return;
  if(e.key==='ArrowRight')goCat(view.cat+1);if(e.key==='ArrowLeft')goCat(view.cat-1)});
$('#scrim').addEventListener('click',()=>closeSheet());
(()=>{let sx=0,sy=0,st=0,tgt=null;const on=(el,fn)=>{el.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now();tgt=e.target},{passive:true});el.addEventListener('touchend',e=>{const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;if(Date.now()-st>600||Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.6)return;if(tgt&&tgt.closest&&tgt.closest('.hs,.tabs,textarea,input,select,.bigbtns,.week7'))return;fn(dx)},{passive:true})};
  on($('#col'),dx=>goCat(view.cat+(dx<0?1:-1)));on($('#xmb'),dx=>goCat(view.cat+(dx<0?1:-1)));on($('#panel'),dx=>{if(dx>0&&view.panel&&view.panel.type!=='player')A.closePanel()})})();
document.addEventListener('visibilitychange',()=>{if(document.hidden)Store.flushAll();else{renderStatus();requestRender()}});
addEventListener('pagehide',()=>Store.flushAll());
addEventListener('resize',()=>{if(Store.ready)renderRail()});

/* ticker: countdowns and beeps */
let lastMin=-1,lastBeep=-1;
setInterval(()=>{const now=Date.now();document.querySelectorAll('[data-tick]').forEach(el=>{el.textContent=fmtHMS(now-(+el.dataset.tick))});
  if(!Store.ready)return;const L=liveDoc().lift;
  if(L&&L.endAt&&L.paused==null&&(L.phase==='warm'||L.phase==='rest'||(WORKOUTS[L.wid].circuit&&L.phase))){const left=L.endAt-now;const cd=document.querySelector('[data-cd]');if(cd)cd.textContent=fmtMS(left);const sec=Math.ceil(left/1000);
    if(sec<=3&&sec>=1&&sec!==lastBeep){lastBeep=sec;Snd.play('beep')}
    if(left<=0){lastBeep=-1;liftAdvance()}}
  const m=new Date().getMinutes();if(m!==lastMin){lastMin=m;renderStatus()}},250);

/* ================= boot ================= */
(async function boot(){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  const bootEl=$('#boot');const showBoot=lsGet('kf2k.boot')!=='0';$('#bootTap').hidden=true;$('#bootLoad').hidden=false;
  const saved=lsGet('kf2k.cat');view.cat=Math.max(0,CATS.findIndex(c=>c.id===(saved||'today')));
  let db=null;try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(db){Store.db=db;Store.mode='cloud';Store.subscribe();await Store.waitReady(9000);if(Object.keys(Store.data).length===0)Store.loadLocal('kf2k.cache')}
  else{Store.mode='local';Store.loadLocal();Store.markReady()}
  const s=S();lsSet('kf2k.boot',s.boot===false?'0':'1');
  const enter=()=>{bootEl.classList.add('go');render();if(liveDoc().lift)setTimeout(()=>{view.panel={type:'player'};renderPanel()},200);setTimeout(()=>{award('boot');checkTrophies()},900);setTimeout(()=>bootEl.remove(),900)};
  if(!showBoot||s.boot===false){enter();return}
  $('#bootLoad').hidden=true;$('#bootTap').hidden=false;
  bootEl.addEventListener('click',()=>{Snd.init();Snd.play('boot');bootEl.classList.add('lit');Waves.flash();setTimeout(enter,1300)},{once:true});
})();
</script>
